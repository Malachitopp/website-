<!doctype html>
<!--
  Offline renderer for the studio page's warehouse images.

  A small WebGL2 path tracer: the warehouse is a big box with procedural surfaces, lit
  only by rows of fluorescent tubes (plus a glowing loading door at the far end). A school
  blackboard on casters stands mid-hall with a tagline chalked on it (the writing is drawn
  on a 2D canvas and sampled as a texture) and broken chalk scattered on the floor; the
  name hangs from the tubes; to the right is the music corner (a record player on a
  wooden box, a second board the site writes the top artists on, and a candle burning on a
  crate beside that board); to the left a small sofa in a fleece cover with the dog asleep on
  it, chin on the arm, and between the sofa and the board a work station: a tall crate of
  books with an open laptop on it (its screen showing GitHub's mark), a second candle, and
  scribbled sheets of physics on the floor round it. Every frame adds one more light path per
  pixel; after enough frames the noise settles into something photographic, then a film look
  is applied in JS. The hall is black and white; the only colour is the candles (their navy
  glass, and the warm light of their flames, each kept apart from the tubes' light so post can
  make it flicker on its own).

  Not part of the site. Run `node tools/studio-render/render.mjs` from the repo root to
  regenerate frontend/src/assets/studio-*. It loads this page with query params w, h
  (pixels), spp (samples per pixel) and row (which row of tubes the name hangs from), waits
  for window.studio, and then asks it for stills, loop frames and walk frames from
  whichever camera it wants (see the bottom of the script). Debug params: ?board, ?letters.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>studio render</title>
    <style>
      /* Michroma (OFL) stands in for the Eurostile Extended of the Endless sleeve */
      @font-face { font-family: 'Michroma'; src: url('Michroma-Regular.ttf'); }
    </style>
  </head>
  <body style="margin: 0; background: #111">
    <canvas id="out"></canvas>
    <script type="x-shader/x-vertex" id="vs">#version 300 es
      in vec2 aPos;
      void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
    </script>
    <script type="x-shader/x-fragment" id="fs">#version 300 es
      precision highp float;
      precision highp int;

      uniform sampler2D uPrev; // the sums so far: light from the tubes and the door (rgb)
      uniform sampler2D uPrevCandle; // ...light from the candle by the music board (rgb) and its flame seen directly (a)
      uniform sampler2D uPrevCandle2; // ...and the same for the candle on the work station
      uniform sampler2D uBoard; // chalk on the blackboard, drawn in JS (r: 0 = slate, 1 = chalk)
      uniform sampler2D uLabel; // the gold printing round the candle's glass (r: 0 = glass, 1 = gold)
      uniform vec4 uFlame[2]; // each flame's pose: sway in x and z of its tip (m), height scale
      uniform sampler2D uScreen; // what the laptop's screen shows (r: 0 = dark, 1 = a white pixel)
      uniform sampler2D uPaper; // the drawings on the sheets of paper, four in a 2 × 2 atlas (r: 0 = paper, 1 = pencil)
      uniform vec2 uRes;
      uniform int uFrame;
      uniform float uTanY;
      uniform vec3 uCamPos, uCamRight, uCamUp, uCamFwd; // the camera, set per render from JS
      uniform sampler2D uBoard2; // the music board's slate: just the haze of old wiping (the site writes on it live)
      uniform float uSpin; // how far the record has turned (rad)
      uniform float uBreath; // the dog's ribs: 1 at rest, a little more as he breathes in
      // the name, hung letter by letter from a row of tubes; laid out in JS (see hangingLetters)
      const int LETTER_N = 11;
      uniform sampler2D uLetters; // signed distance to each letter's outline, in atlas pixels
      uniform float uLetterScale; // metres per atlas pixel
      uniform vec4 uLetterHang[LETTER_N]; // x, y, z where the wire meets the tube; wire length
      uniform vec4 uLetterSize[LETTER_N]; // half-width, height (m); x of the card's centre and y of its top edge, from the tube point
      uniform vec4 uLetterUV[LETTER_N]; // u0, v0, u1, v1 of the letter in the atlas
      uniform mat3 uLetterRot[LETTER_N]; // letter frame → world: twist on the wire, then pendulum tilt
      uniform vec4 uLetterLegs[LETTER_N]; // a bridle for a letter open at the top (the M): x, y of each leg's end; all 0 when the wire ties straight on
      uniform vec3 uLetterMin, uLetterMax; // box around all the letters and their wires
      layout(location = 0) out vec4 outBase;
      layout(location = 1) out vec4 outCandle;
      layout(location = 2) out vec4 outCandle2;

      const float PI = 3.14159265;

      // ---- the building (metres). The overview camera stands near the front wall at eye
      // height, looking down +z. ----
      const float HALF_W = 8.0;
      const float H = 6.4;
      const float FRONT = -3.0;
      const float BACK = 52.0;

      const int ROWS = 16;
      const int COLS = 4;
      const float ROW0 = 2.5;
      const float ROW_STEP = 3.1;
      const float COL0 = -5.4;
      const float COL_STEP = 3.6;
      const float TUBE_HALF_LEN = 1.4;
      const float TUBE_HALF_W = 0.055;
      const float TUBE_Y = 5.6; // underside of the tubes
      const float TUBE_T = 0.06;
      const float TUBE_LE = 24.0;
      const float TUBE_AREA = 4.0 * TUBE_HALF_LEN * TUBE_HALF_W;

      const float STUD_DEPTH = 0.16;
      const float STUD_STEP = 1.22;
      const float STUD_HALF = 0.035;

      const float BEAM_STEP = 6.0;
      const float BEAM_OFF = 4.0;
      const float BEAM_HALF = 0.16;
      const float BEAM_DEPTH = 0.55;

      const float DOOR_HALF_W = 2.8;
      const float DOOR_H = 4.0;
      const float DOOR_LE = 1.6;

      // sealed concrete: a narrow glossy lobe (Phong exponent) around the mirror direction
      const float GLOSS_N = 300.0;
      const float GLOSS_SPREAD = 0.058; // ≈ 1/sqrt(GLOSS_N) radians

      // ---- the blackboard: a school board on a wheeled stand, parked mid-hall ----
      // Everything about it is described in a local frame (board centred on x = 0 at floor
      // level, writing face towards the camera at -z) and turned into the room by a 10° yaw
      // about y, so it sits a little askew instead of squared up to the walls.
      const vec3 BOARD_POS = vec3(0.1, 0.0, 12.0);
      const float BOARD_C = 0.98480775, BOARD_S = 0.17364818; // cos / sin of the yaw
      const float BOARD_HALF_W = 1.0; // writing surface 2 × 1 m
      const float BOARD_Y0 = 0.88;
      const float BOARD_H = 1.0;
      const float RAIL = 0.05; // aluminium rail around the slate
      const float POST_X = 1.10; // uprights either side
      const float WHEEL_R = 0.035;
      const float CHALK_R = 0.006;

      // ---- the music corner, to the right of that board ----
      // A little wooden box standing 50 cm to the right of the board and 50 cm in front of
      // it, turned to face the room at a diagonal, with a record player on top; and behind
      // it, off to the right so the player does not hide it, a second board of the same kind.
      // The site writes the top artists on that one live, over the render, so its slate only
      // carries old wipe marks (uBoard2).
      const vec3 BOARD2_POS = vec3(3.25, 0.0, 12.55);
      const float BOARD2_C = 0.93969262;
      const float BOARD2_S = 0.34202014; // 20°
      const vec3 TABLE_POS = vec3(1.81, 0.0, 10.98);
      const float TABLE_C = 0.8660254;
      const float TABLE_S = 0.5; // 30°

      // ---- the candle, on a crate of its own on the right of the music board ----
      // A Carby Musk candle (Better World Fragrance House): a navy glass tumbler with its name
      // printed in gold, burning. Its crate is stood on end just in front of the board's right
      // leg, squared up with the board (it shares the board's yaw), at (1.30, -0.50) in the
      // board's frame. Its light is warm and kept in a channel of its own (see main).
      const vec3 CANDLE_TABLE_POS = vec3(4.3006, 0.0, 11.6355);
      const float CRATE_HW = 0.17, CRATE_HD = 0.15, CRATE_H = 0.66, SHELF_Y = 0.3; // half width, half depth, height, the shelf's underside
      const vec2 CANDLE_C = vec2(-0.03, -0.02); // where the jar stands on top (x, z in the crate's frame)
      const float JAR_R = 0.041, JAR_H = 0.11, JAR_T = 0.003, JAR_BASE = 0.016; // outer radius, height, wall, solid glass base
      const float WAX_Y = 0.104; // the wax's surface, up from the bottom of the jar: a new candle, so the flame clears the rim
      const float FLAME_Y = 0.107, FLAME_H = 0.026, FLAME_R = 0.0052; // where the flame starts, how tall and wide it is
      const float FLAME_LE = 6000.0; // the flame's glow per metre of it a ray passes through
      const float LABEL_FACING = -1.63; // the angle round the jar (atan(z, x), crate frame) the printing faces: the close-ups
      const vec3 CANDLE_RGB = vec3(1.0, 0.76, 0.42); // warm yellow
      const float CANDLE_SOFT = 0.7; // m: softens the fall-off of its light close to it
      const float CANDLE_REACH = 9.0; // m: beyond this the candle adds nothing that can be seen

      // ---- the sofa on the left of the tagline board, with the dog asleep on it ----
      // A small two-seater in a fluffy grey fleece cover (the cover reaches the floor; plump
      // rolled arms, a leaning back with two loose cushions on it, a couple of pillows piled in
      // its left corner), stood half a metre left of the board's left leg and a little in front
      // of it, turned a touch towards the middle of the hall. The dog — a black schnauzer — lies
      // along the seat on his front at an angle, back end by the pillows, chest at the front
      // edge, chin propped on the right arm, one front paw hanging over the edge. His ribs rise
      // and fall with uBreath in the loops. All of it is one signed distance field, sphere-traced
      // in the sofa's frame (origin in the middle of its footprint on the floor, front at -z).
      const vec3 SOFA_POS = vec3(-2.35, 0.0, 11.1);
      const float SOFA_C = 0.96126, SOFA_S = -0.27564; // -16°
      const float SEAT_Y = 0.52; // the top of the seat cushion
      const vec3 DOG_POS = vec3(0.20, 0.62, -0.10); // the middle of his body (sofa frame)
      const float DOG_C = 0.8660254, DOG_S = 0.5; // 30°: he lies across the seat at an angle, chest towards the front right corner
      const vec3 HEAD_C = vec3(0.60, 0.74, -0.22); // the middle of his head (sofa frame); the muzzle points along +x, over the arm

      // ---- the work station, between the sofa and the tagline board ----
      // A plywood crate like the candle's but taller and wider, stood on end just in front of the
      // board's left leg and clear of the sofa's arm, turned a little to the right so its front
      // faces the room: two shelves of books inside, and on top an open laptop (its screen showing
      // the GitHub mark — up close the site lays its home screen over it), a second Carby Musk
      // candle burning at the laptop's right, a pencil, and a sheet of paper half under the
      // laptop. More sheets of scribbled physics and system diagrams lie on the floor round its
      // feet. Everything is in the crate's frame: origin in the middle of its footprint, open side
      // at -z.
      const vec3 DESK_POS = vec3(-1.15, 0.0, 11.3);
      const float DESK_C = 0.90630779, DESK_S = -0.42261826; // -25°
      const float DESK_HW = 0.25, DESK_HD = 0.20, DESK_H = 0.9; // half width, half depth, height
      const float DESK_S1 = 0.29, DESK_S2 = 0.58; // the two shelves' undersides
      const vec2 DESK_JAR = vec2(-0.175, 0.0); // where the second candle stands on top (x, z): the laptop's left, its lid between the flame and the tagline board
      // the laptop: a 14" machine with its lid open 110°, in its own frame: origin under the middle of its base
      const vec2 LAP_C = vec2(0.07, 0.012); // where the base sits on the crate (x, z)
      const float LAP_HW = 0.155, LAP_HD = 0.108, LAP_T = 0.016, LAP_R = 0.004; // base: half width, half depth, thickness, rounding
      const float LID_H = 0.206, LID_T = 0.005; // the lid: how far it reaches from the hinge, thickness
      const float LID_C = 0.93969262, LID_S = 0.34202014; // 20°: how far past upright it leans back
      const float HINGE_Z = 0.102; // the hinge runs along the back of the base (z from the base's middle), at the base's top
      const float BEZEL_X = 0.006, BEZEL_LO = 0.0125, BEZEL_HI = 0.0075; // the screen inside the lid's face: from its sides, its bottom, its top
      const float SCREEN_LE = 0.9; // the screen's glow, for a white pixel
      // sheets of A4 (x, z of the middle, yaw, which of the four drawings): four on the floor round the crate, one on top under the laptop
      const int PAPER_N = 5;
      const vec4 PAPER[PAPER_N] = vec4[PAPER_N](
        vec4(-0.42, -0.34, 0.35, 0.0), vec4(0.16, -0.46, -0.55, 1.0), vec4(0.50, -0.12, 1.25, 2.0),
        vec4(-0.08, -0.62, 0.12, 3.0), vec4(0.085, -0.095, 1.45, 2.0));
      const float PAPER_HW = 0.105, PAPER_HL = 0.1485, PAPER_T = 0.0003;
      // the books on the shelves: min and max corners of each row standing spine-out (the first
      // four) and of each one lying flat (the rest)
      const int DBOOK_N = 8, DBOOK_STANDING = 4;
      const vec3 DBOOK[2 * DBOOK_N] = vec3[2 * DBOOK_N](
        vec3(0.12, 0.018, -0.14), vec3(0.228, 0.245, 0.17), // bottom right, standing
        vec3(-0.228, 0.308, -0.15), vec3(-0.07, 0.545, 0.17), // middle shelf, two rows of different heights
        vec3(-0.07, 0.308, -0.135), vec3(0.04, 0.52, 0.17),
        vec3(-0.228, 0.598, -0.145), vec3(-0.11, 0.83, 0.17), // top shelf
        vec3(-0.21, 0.018, -0.16), vec3(0.06, 0.052, 0.12), // a stack lying flat in the bottom, not squared up
        vec3(-0.2, 0.052, -0.15), vec3(0.075, 0.08, 0.125),
        vec3(-0.215, 0.08, -0.165), vec3(0.05, 0.104, 0.115),
        vec3(-0.08, 0.598, -0.17), vec3(0.16, 0.628, 0.07)); // one lying on the top shelf
      const vec3 DBOOK_LEAN = vec3(0.045, 0.308, 0.0); // a book leaning over from the middle row to the crate's side
      const float LEAN_C = 0.88295, LEAN_S = 0.46947; // 28°

      // ---- the art corner, on the left of the sofa: where I paint ----
      // A wooden studio easel with a blank canvas on it, turned a little towards the middle of the
      // hall so its face is towards the door (the site lays my paintings onto that canvas); spare
      // canvases leaning about behind it and one lying face up on the floor in front of the sofa;
      // a crate like the other three at the painter's side, with a tin of brushes, tubes of oil
      // paint and a rag on top and a palette leaning against it; and oil paint flicked over the
      // concrete all round it, and onto the sofa, as happens. Everything is in the corner's frame:
      // origin in the middle of the easel's footprint, the canvas facing -z. The paint, the wood
      // and the palette are the one part of the hall with colour in it besides the candles — see
      // surface().
      // The easel itself stands in the open floor at the sofa's front-left corner, about 35 cm clear
      // of its left side and a little ahead of its front — in the foreground, not tucked away
      // behind (the user, 2026-09-16: "i want the actual easel to be like 25-50cm to the left and
      // infront of the sofa, but the mess can extend behind the sofa … dont have the easel pushed in
      // the backgroudn"). The mess does the opposite: the spare canvases and the paint run from in
      // front of the easel back past the sofa, one canvas ending up behind it with only its top
      // showing over the back.
      // Where it stands is pinned between two limits: the gap to the sofa wants it further left,
      // and a phone's `cover` crop of the portrait overview wants it further right and deeper (the
      // canvas's left corner has to stay inside 0.88 of the render's half-width, which at this depth
      // is 3.97 m). This is both, with about 30 cm of floor between it and the sofa's left side.
      const vec3 ART_POS = vec3(-3.62, 0.0, 10.78);
      const float ART_C = 0.98481, ART_S = -0.17365; // -10°
      // The easel is a lyre easel: its mast — two uprights, two braces, the ledge the canvas
      // stands on and the clamp over the canvas's top edge — leans back as one piece, so all of
      // that is axis-aligned in the mast's own frame (easelLocal, pivoting on the floor). The two
      // front feet and the rear leg don't lean with it: they stand in the corner's frame.
      const float EASEL_LEAN_C = 0.99452, EASEL_LEAN_S = 0.10453; // 6°
      const float EASEL_X = 0.145; // half the gap between the uprights
      const float EASEL_W = 0.026, EASEL_T = 0.021; // half the width and half the thickness of a batten
      const float EASEL_H = 1.78; // how tall the uprights stand
      const float LEDGE_Y = 0.745; // the top of the ledge: where the canvas stands
      const float EASEL_FOOT = 0.19, EASEL_REAR = 0.58; // how far a front foot reaches forward, and the rear leg's foot back

      // The canvases: a stretcher CANVAS_T deep with primed cotton over it, standing on the middle
      // of its bottom edge at CANVAS_POS (x, y, z in the corner's frame) turned by that yaw, and
      // leaning back from upright by CANVAS_FORM.x, CANVAS_FORM.yz wide and tall. In a canvas's own
      // frame x runs across it, y up it from the bottom edge and z into it from the face, so a lean
      // of a right angle lays it face up on the floor — which is the last one, in front of the sofa.
      // Index 0 is the one on the easel; its place comes from the mast, not from a guess.
      const int CANVAS_N = 8;
      const float CANVAS_T = 0.018;
      const vec4 CANVAS_POS[CANVAS_N] = vec4[CANVAS_N](
        vec4(0.0, 0.745, 0.0391, 0.0), // on the easel, leaning with the mast
        // three stacked in a loose rack just behind it, each resting on the one in front, stepping
        // back along their own normal; the third is turned round, so that one shows its stretcher
        vec4(0.10, 0.0053, 0.55, 0.35),
        vec4(0.129, 0.0053, 0.63, 0.35),
        vec4(0.158, 0.0, 0.71, 3.4916),
        vec4(-0.30, 0.0045, 0.85, -0.52), // a small one out to the left, leaning the other way
        vec4(0.30, 0.0, 1.30, 3.30), // one further back level with the sofa, its stretcher out
        vec4(1.00, 0.0046, 1.70, 0.55), // and one behind the sofa, only its top showing over the back
        vec4(1.05, 0.018, -0.48, 1.466)); // one lying face up on the floor in front of the sofa
      const vec3 CANVAS_FORM[CANVAS_N] = vec3[CANVAS_N](
        vec3(0.10472, 0.70, 0.90), vec3(0.30, 0.50, 0.70), vec3(0.30, 0.60, 0.80),
        vec3(-0.30, 0.55, 0.75), vec3(0.25, 0.40, 0.50), vec3(-0.28, 0.55, 0.75),
        vec3(0.26, 0.60, 0.95), vec3(1.5708, 0.55, 0.75));
      // Paint that has ended up on the spare canvases: x across the face from its middle, y up it
      // (m), how wide the mark is, and which colour. Each canvas but the easel's takes a window of
      // four of these, so no two are splattered alike.
      const int CSPLAT_N = 12;
      const vec4 CSPLAT[CSPLAT_N] = vec4[CSPLAT_N](
        vec4(-0.12, 0.22, 0.045, 0.0), vec4(0.09, 0.48, 0.028, 1.0), vec4(-0.05, 0.62, 0.018, 3.0),
        vec4(0.16, 0.14, 0.036, 2.0), vec4(-0.20, 0.40, 0.022, 4.0), vec4(0.02, 0.30, 0.052, 5.0),
        vec4(0.21, 0.58, 0.020, 0.0), vec4(-0.16, 0.08, 0.030, 1.0), vec4(0.06, 0.70, 0.026, 2.0),
        vec4(-0.24, 0.55, 0.016, 3.0), vec4(0.13, 0.36, 0.040, 4.0), vec4(-0.02, 0.12, 0.024, 5.0));

      // The crate at the painter's side, in front of the easel and to its left, sharing the
      // corner's yaw: a plywood crate like the candle's, open to the front, with a shelf.
      const vec3 ART_BOX = vec3(0.44, 0.0, -0.54); // the middle of its footprint (corner frame): ahead of the easel, on the sofa's side, where a painter's hand goes
      const float ART_BOX_HW = 0.21, ART_BOX_HD = 0.175, ART_BOX_H = 0.62, ART_BOX_SHELF = 0.29;
      const vec2 POT_C = vec2(0.055, -0.03); // the tin of brushes on top (x, z in the crate's frame)
      const float POT_R = 0.052, POT_H = 0.135;
      const int BRUSH_N = 9;
      // tubes of oil paint lying about: x, z in the crate's frame, yaw, and which of PAINT is on the label
      const int PAINT_TUBE_N = 6;
      const vec4 PAINT_TUBE[PAINT_TUBE_N] = vec4[PAINT_TUBE_N](
        vec4(-0.085, 0.055, 0.42, 0.0), vec4(-0.055, -0.015, -0.31, 1.0), vec4(-0.12, -0.075, 1.05, 3.0),
        vec4(-0.03, -0.105, 0.18, 4.0), vec4(-0.1, 0.02, 0.85, 2.0), vec4(0.075, -0.13, -0.62, 5.0));
      const float PAINT_TUBE_R = 0.0135, PAINT_TUBE_L = 0.043; // radius, half the length of the body
      // the palette, standing on the floor and leaning against the crate's front, its blobs facing the door
      const vec3 PALETTE_AT = vec3(0.40, 0.008, -0.792); // middle of its bottom edge (corner frame): its top leans on the crate's front
      const float PALETTE_YAW = -0.22, PALETTE_LEAN = 0.26;
      const float PALETTE_HW = 0.19, PALETTE_H = 0.30, PALETTE_T = 0.009;

      // Oil paint on the floor round the easel (x, z in the corner's frame) and on the sofa (in the
      // sofa's): where each dab is, how wide it is, and which of PAINT it is. Colour only — no
      // geometry, it is painted into the surface.
      // The big trodden-in smears come first and the flicked droplets last, since a later dab
      // lands on top of an earlier one. Everything is clustered where you stand to paint, round
      // the crate, and in a trail over to the canvas on the floor by the sofa.
      const int SPLAT_N = 48, SPLAT_FLOOR = 38; // the first SPLAT_FLOOR are the floor's, the rest the sofa's
      const vec4 SPLAT[SPLAT_N] = vec4[SPLAT_N](
        vec4(0.05, -0.75, 0.17, 2.0), vec4(-0.35, -0.50, 0.13, 0.0), vec4(0.45, -0.95, 0.15, 1.0),
        vec4(-0.15, -1.15, 0.12, 4.0), vec4(0.62, -0.55, 0.11, 5.0), vec4(-0.55, -0.90, 0.14, 3.0),
        vec4(0.25, 0.55, 0.12, 2.0), vec4(-0.45, 0.35, 0.10, 0.0),
        vec4(-0.18, -0.32, 0.058, 0.0), vec4(0.30, -0.42, 0.046, 1.0), vec4(-0.62, -0.35, 0.052, 3.0),
        vec4(0.15, -0.20, 0.038, 4.0), vec4(0.52, -0.28, 0.044, 2.0), vec4(-0.30, -1.35, 0.034, 5.0),
        vec4(0.08, -0.55, 0.048, 1.0), vec4(0.72, -0.78, 0.030, 0.0), vec4(-0.72, -0.62, 0.036, 4.0),
        vec4(0.38, -1.25, 0.042, 2.0), vec4(-0.05, 0.28, 0.032, 0.0), vec4(0.48, 0.42, 0.026, 1.0),
        vec4(-0.28, 0.72, 0.038, 3.0), vec4(0.18, 0.95, 0.028, 5.0), vec4(-0.60, 0.15, 0.034, 2.0),
        vec4(0.05, 1.25, 0.024, 0.0), vec4(0.35, 1.60, 0.030, 4.0), vec4(-0.20, 1.45, 0.022, 1.0),
        vec4(0.85, -0.40, 0.026, 3.0), vec4(1.15, -0.62, 0.032, 0.0), vec4(1.45, -0.52, 0.024, 2.0),
        vec4(0.95, -0.85, 0.020, 5.0), vec4(1.70, -0.70, 0.028, 1.0), vec4(0.78, 1.15, 0.022, 4.0),

      const int M_NONE = 0, M_FLOOR = 1, M_CEIL = 2, M_LEFT = 3, M_RIGHT = 4, M_BACK = 5,
        M_FRONT = 6, M_STUD = 7, M_BEAM = 8, M_TUBE = 9, M_PIPE = 10, M_PLATE = 11,
        M_BOARD = 12, M_FRAME = 13, M_STAND = 14, M_WHEEL = 15, M_CHALK = 16, M_ERASER = 17,
        M_LETTER = 18, M_WIRE = 19, M_BOARD2 = 20, M_WOOD = 21, M_SLEEVE = 22, M_PLINTH = 23,
        M_PLATTER = 24, M_RECORD = 25, M_METAL = 26, M_RUBBER = 27, M_GLASS = 28, M_WAX = 29,

        M_EASEL = 42, M_CANVAS = 43, M_PALETTE = 44, M_BRUSH = 45, M_BRISTLE = 46,

      struct Hit { float t; vec3 n; int m; };

      // Frames turned about y (cos c, sin s of the yaw) with their origin at pos: the boards and the box
      vec3 yawLocal(vec3 p, vec3 pos, float c, float s) { p -= pos; return vec3(c * p.x - s * p.z, p.y, s * p.x + c * p.z); }
      vec3 yawLocalDir(vec3 d, float c, float s) { return vec3(c * d.x - s * d.z, d.y, s * d.x + c * d.z); }
      vec3 yawWorldDir(vec3 d, float c, float s) { return vec3(c * d.x + s * d.z, d.y, -s * d.x + c * d.z); }
      vec3 boardLocal(vec3 p) { return yawLocal(p, BOARD_POS, BOARD_C, BOARD_S); }
      vec3 board2Local(vec3 p) { return yawLocal(p, BOARD2_POS, BOARD2_C, BOARD2_S); }
      vec3 tableLocal(vec3 p) { return yawLocal(p, TABLE_POS, TABLE_C, TABLE_S); }
      vec3 crateLocal(vec3 p) { return yawLocal(p, CANDLE_TABLE_POS, BOARD2_C, BOARD2_S); }
      vec3 sofaLocal(vec3 p) { return yawLocal(p, SOFA_POS, SOFA_C, SOFA_S); }
      vec3 deskLocal(vec3 p) { return yawLocal(p, DESK_POS, DESK_C, DESK_S); }
      vec3 artLocal(vec3 p) { return yawLocal(p, ART_POS, ART_C, ART_S); }
      // the easel's mast, leaning back from the corner's frame about x on the floor
      vec3 easelLocal(vec3 q) { return vec3(q.x, EASEL_LEAN_C * q.y + EASEL_LEAN_S * q.z, EASEL_LEAN_C * q.z - EASEL_LEAN_S * q.y); }
      // Into the frame of something standing at base in the corner's frame, turned by a yaw about
      // y and then tipped back by a lean about x: a canvas (x across it, y up it from its bottom
      // edge, z into it from its face — so a lean of a right angle lays it face up) or the palette.
      vec3 tiltedLocal(vec3 q, vec3 base, float yaw, float lean) {
        q -= base;
        float c = cos(yaw), s = sin(yaw);
        q = vec3(c * q.x - s * q.z, q.y, s * q.x + c * q.z);
        float lc = cos(lean), ls = sin(lean);
        return vec3(q.x, lc * q.y + ls * q.z, lc * q.z - ls * q.y);
      }
      vec3 canvasLocal(vec3 q, int i) { return tiltedLocal(q, CANVAS_POS[i].xyz, CANVAS_POS[i].w, CANVAS_FORM[i].x); }
      vec3 paletteLocal(vec3 q) { return tiltedLocal(q, PALETTE_AT, PALETTE_YAW, PALETTE_LEAN); }
      // The two candles' jars, each in a frame of its own with the origin under the middle of its
      // base and the yaw of the crate it stands on: 0 is the one by the music board, 1 the one on
      // the work station.
      const int CANDLE_N = 2;
      vec2 jarYaw(int i) { return i == 0 ? vec2(BOARD2_C, BOARD2_S) : vec2(DESK_C, DESK_S); }
      vec3 jarOrigin(int i) {
        return i == 0 ? CANDLE_TABLE_POS + yawWorldDir(vec3(CANDLE_C.x, CRATE_H, CANDLE_C.y), BOARD2_C, BOARD2_S)
                      : DESK_POS + yawWorldDir(vec3(DESK_JAR.x, DESK_H, DESK_JAR.y), DESK_C, DESK_S);
      }
      vec3 jarLocal(vec3 p, int i) { vec2 y = jarYaw(i); return yawLocalDir(p - jarOrigin(i), y.x, y.y); }
      vec3 jarWorld(vec3 q, int i) { vec2 y = jarYaw(i); return jarOrigin(i) + yawWorldDir(q, y.x, y.y); }
      int nearestJar(vec3 p) { return distance(p, jarOrigin(0)) < distance(p, jarOrigin(1)) ? 0 : 1; }
      // a point on one of the boards' shared parts (rail, tray, stand), in that board's frame
      vec3 nearestBoardLocal(vec3 p) { return distance(p.xz, BOARD_POS.xz) < distance(p.xz, BOARD2_POS.xz) ? boardLocal(p) : board2Local(p); }

      // ---- random numbers & noise ----
      uint rngState;
      uint pcg(uint v) {
        uint s = v * 747796405u + 2891336453u;
        uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u;
        return (w >> 22u) ^ w;
      }
      float rnd() { rngState = pcg(rngState); return float(rngState) / 4294967295.0; }

      float hash2(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash2(i), hash2(i + vec2(1, 0)), u.x),
                   mix(hash2(i + vec2(0, 1)), hash2(i + vec2(1, 1)), u.x), u.y);
      }
      float fbm(vec2 p) {
        float v = 0.0, a = 0.5;
        for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + 17.1; a *= 0.5; }
        return v;
      }

      // ---- intersection ----
      vec3 safeDir(vec3 d) { return d + vec3(1e-7) * (1.0 - abs(sign(d))); }

      void shell(vec3 o, vec3 d, inout Hit h) {
        vec3 far = mix(vec3(-HALF_W, 0.0, FRONT), vec3(HALF_W, H, BACK), step(0.0, d));
        vec3 t = (far - o) / d;
        float best = t.x; vec3 n = vec3(-sign(d.x), 0, 0); int m = d.x > 0.0 ? M_RIGHT : M_LEFT;
        if (t.y < best) { best = t.y; n = vec3(0, -sign(d.y), 0); m = d.y > 0.0 ? M_CEIL : M_FLOOR; }
        if (t.z < best) { best = t.z; n = vec3(0, 0, -sign(d.z)); m = d.z > 0.0 ? M_BACK : M_FRONT; }
        if (best > 1e-4 && best < h.t) { h.t = best; h.n = n; h.m = m; }
      }

      bool slab(vec3 o, vec3 d, vec3 bmin, vec3 bmax, out float tn, out float tf, out vec3 n) {
        vec3 t0 = (bmin - o) / d, t1 = (bmax - o) / d;
        vec3 lo = min(t0, t1), hi = max(t0, t1);
        tn = max(max(lo.x, lo.y), lo.z);
        tf = min(min(hi.x, hi.y), hi.z);
        n = tn == lo.x ? vec3(-sign(d.x), 0, 0) : tn == lo.y ? vec3(0, -sign(d.y), 0) : vec3(0, 0, -sign(d.z));
        return tn <= tf && tf > 1e-4;
      }

      void box(vec3 o, vec3 d, vec3 bmin, vec3 bmax, int m, inout Hit h) {
        float tn, tf; vec3 n;
        if (!slab(o, d, bmin, bmax, tn, tf, n) || tn < 1e-4 || tn >= h.t) return;
        h.t = tn; h.n = n; h.m = m;
      }

      // Evenly spaced boards along z inside a region (studs, ceiling beams): O(1) per ray
      void repeatedZ(vec3 o, vec3 d, vec3 bmin, vec3 bmax, float stepZ, float offset, float halfT, int m, inout Hit h) {
        float tn, tf; vec3 n;
        if (!slab(o, d, bmin, bmax, tn, tf, n)) return;
        float ts = max(tn, 1e-4);
        if (ts >= h.t) return;
        float z = o.z + d.z * ts;
        float local = mod(z - offset + 0.5 * stepZ, stepZ) - 0.5 * stepZ;
        float centre = z - local;
        if (abs(local) <= halfT) {
          if (tn > 1e-4) { h.t = tn; h.n = n; h.m = m; }
          return;
        }
        float face;
        if (d.z > 0.0) face = local < 0.0 ? centre - halfT : centre + stepZ - halfT;
        else face = local > 0.0 ? centre + halfT : centre - stepZ + halfT;
        float t = (face - o.z) / d.z;
        if (t > 1e-4 && t <= tf && t < h.t) { h.t = t; h.n = vec3(0, 0, -sign(d.z)); h.m = m; }
      }

      void tubes(vec3 o, vec3 d, inout Hit h) {
        float planeY;
        vec3 n;
        if (o.y < TUBE_Y && d.y > 0.0) { planeY = TUBE_Y; n = vec3(0, -1, 0); }
        else if (o.y > TUBE_Y + TUBE_T && d.y < 0.0) { planeY = TUBE_Y + TUBE_T; n = vec3(0, 1, 0); }
        else return;
        float t = (planeY - o.y) / d.y;
        if (t < 1e-4 || t >= h.t) return;
        vec3 p = o + d * t;
        float c = clamp(floor((p.x - COL0) / COL_STEP + 0.5), 0.0, float(COLS - 1));
        float r = clamp(floor((p.z - ROW0) / ROW_STEP + 0.5), 0.0, float(ROWS - 1));
        if (abs(p.x - (COL0 + c * COL_STEP)) > TUBE_HALF_LEN) return;
        if (abs(p.z - (ROW0 + r * ROW_STEP)) > TUBE_HALF_W) return;
        h.t = t; h.n = n; h.m = M_TUBE;
      }

      // Capped cylinder from a to b (after Inigo Quilez): wheels and sticks of chalk.
      void cylinder(vec3 o, vec3 d, vec3 a, vec3 b, float r, int m, inout Hit h) {
        vec3 ca = b - a, oc = o - a;
        float caca = dot(ca, ca), card = dot(ca, d), caoc = dot(ca, oc);
        float qa = caca - card * card;
        if (qa < 1e-9) return; // running along the axis
        float qb = caca * dot(oc, d) - caoc * card;
        float qc = caca * dot(oc, oc) - caoc * caoc - r * r * caca;
        float disc = qb * qb - qa * qc;
        if (disc < 0.0) return;
        disc = sqrt(disc);
        float t = (-qb - disc) / qa;
        float y = caoc + t * card;
        vec3 n;
        if (y > 0.0 && y < caca) n = (oc + t * d - ca * y / caca) / r;
        else {
          t = ((y < 0.0 ? 0.0 : caca) - caoc) / card;
          if (abs(qb + qa * t) >= disc) return;
          n = normalize(ca) * sign(y);
        }
        if (t <= 1e-4 || t >= h.t) return;
        h.t = t; h.n = n; h.m = m;
      }

      // A blackboard (at pos, turned by the yaw with cosine c and sine s) and, if litter is
      // set, the broken chalk dropped around it. Rays are moved into the board's frame first,
      // so the parts can all be axis-aligned boxes; one bounding box keeps the cost away from
      // rays that never come near it. slate is the material of the writing surface, which
      // decides which chalk texture it shows.
      void blackboard(vec3 wo, vec3 wd, vec3 pos, float c, float s, int slate, bool litter, inout Hit h) {
        vec3 o = yawLocal(wo, pos, c, s), d = yawLocalDir(wd, c, s);
        float tn, tf; vec3 n;
        if (!slab(o, d, litter ? vec3(-1.6, 0.0, -2.5) : vec3(-1.2, 0.0, -0.35), litter ? vec3(1.5, 2.0, 0.5) : vec3(1.2, 2.0, 0.35), tn, tf, n) || tn >= h.t) return;
        Hit l; l.t = h.t; l.m = M_NONE; l.n = vec3(0);
        // slate in its rail, the chalk tray along the bottom, and what's been left on it
        box(o, d, vec3(-BOARD_HALF_W - RAIL, BOARD_Y0 - RAIL, -0.015), vec3(BOARD_HALF_W + RAIL, BOARD_Y0 + BOARD_H + RAIL, 0.015), slate, l);
        box(o, d, vec3(-0.9, 0.83, -0.09), vec3(0.9, 0.85, -0.015), M_FRAME, l);
        box(o, d, vec3(-0.9, 0.83, -0.09), vec3(0.9, 0.87, -0.078), M_FRAME, l);
        box(o, d, vec3(0.30, 0.85, -0.08), vec3(0.43, 0.885, -0.03), M_ERASER, l);
        cylinder(o, d, vec3(-0.55, 0.856, -0.055), vec3(-0.48, 0.856, -0.055), CHALK_R, M_CHALK, l);
        cylinder(o, d, vec3(-0.30, 0.856, -0.045), vec3(-0.27, 0.856, -0.05), CHALK_R, M_CHALK, l);
        cylinder(o, d, vec3(0.62, 0.856, -0.06), vec3(0.67, 0.856, -0.035), CHALK_R, M_CHALK, l);
        // the stand: two uprights on feet, a crossbar, a caster at each corner
        for (int s = -1; s <= 1; s += 2) {
          float x = float(s) * POST_X;
          box(o, d, vec3(x - 0.02, 0.10, -0.02), vec3(x + 0.02, 1.98, 0.02), M_STAND, l);
          box(o, d, vec3(x - 0.02, 0.06, -0.32), vec3(x + 0.02, 0.10, 0.32), M_STAND, l);
          float bx0 = float(s) * (BOARD_HALF_W + RAIL), bx1 = float(s) * (POST_X - 0.02);
          box(o, d, vec3(min(bx0, bx1), 1.36, -0.015), vec3(max(bx0, bx1), 1.40, 0.015), M_STAND, l);
          for (int e = -1; e <= 1; e += 2) {
            float z = float(e) * 0.27;
            box(o, d, vec3(x - 0.016, 0.03, z - 0.02), vec3(x + 0.016, 0.06, z + 0.02), M_STAND, l);
            cylinder(o, d, vec3(x - 0.013, WHEEL_R, z), vec3(x + 0.013, WHEEL_R, z), WHEEL_R, M_WHEEL, l);
          }
        }
        box(o, d, vec3(-POST_X, 0.28, -0.02), vec3(POST_X, 0.32, 0.02), M_STAND, l);
        // broken chalk on the floor
        if (litter && slab(o, d, vec3(-1.5, 0.0, -2.45), vec3(1.4, 2.0 * CHALK_R, 0.4), tn, tf, n) && tn < l.t) {
          for (int i = 0; i < CHALK_N; i++) {
            vec4 piece = CHALK[i];
            vec3 arm = vec3(cos(piece.z), 0.0, sin(piece.z)) * (0.5 * piece.w);
            vec3 mid = vec3(piece.x, CHALK_R, piece.y);
            cylinder(o, d, mid - arm, mid + arm, CHALK_R, M_CHALK, l);
          }
        }
        if (l.t < h.t) { h.t = l.t; h.n = yawWorldDir(l.n, c, s); h.m = l.m; }
      }

      // The record player on its box, all in the box's frame: origin in the middle of its
      // footprint on the floor, the open side of the box and the front of the player at -z.
      // The box is a plywood crate on its side with records filed spine-out inside; the
      // player is a plinth on four feet, a platter with a record (turned by uSpin) and a
      // tonearm resting in the grooves.
      const float BOX_HW = 0.26, BOX_HD = 0.21, BOX_H = 0.5, BOX_T = 0.018; // half width, half depth, height, plank
      const float PLINTH_Y0 = 0.52, PLINTH_Y1 = 0.6;
      const vec2 REC_C = vec2(-0.04, 0.0); // centre of the record (x, z)
      const float REC_R = 0.1505, REC_Y = 0.628, LABEL_R = 0.05;
      const vec3 ARM_PIVOT = vec3(0.17, 0.66, 0.11);
      const vec3 ARM_HEAD = vec3(-0.015, 0.646, -0.085);
      const float SLEEVE_LEAN = 0.42; // rad, the last record in the box leans over

      void musicTable(vec3 wo, vec3 wd, inout Hit h) {
        vec3 o = tableLocal(wo), d = yawLocalDir(wd, TABLE_C, TABLE_S);
        float tn, tf; vec3 n;
        if (!slab(o, d, vec3(-0.3, 0.0, -0.25), vec3(0.3, 0.7, 0.25), tn, tf, n) || tn >= h.t) return;
        Hit l; l.t = h.t; l.m = M_NONE; l.n = vec3(0);
        // the crate: top, bottom, sides and back; open to the front
        box(o, d, vec3(-BOX_HW, BOX_H - BOX_T, -BOX_HD), vec3(BOX_HW, BOX_H, BOX_HD), M_WOOD, l);
        box(o, d, vec3(-BOX_HW, 0.0, -BOX_HD), vec3(BOX_HW, BOX_T, BOX_HD), M_WOOD, l);
        box(o, d, vec3(-BOX_HW, BOX_T, -BOX_HD), vec3(-BOX_HW + BOX_T, BOX_H - BOX_T, BOX_HD), M_WOOD, l);
        box(o, d, vec3(BOX_HW - BOX_T, BOX_T, -BOX_HD), vec3(BOX_HW, BOX_H - BOX_T, BOX_HD), M_WOOD, l);
        box(o, d, vec3(-BOX_HW + BOX_T, BOX_T, BOX_HD - BOX_T), vec3(BOX_HW - BOX_T, BOX_H - BOX_T, BOX_HD), M_WOOD, l);
        // records filed inside (one block, the spines drawn in albedo), the last one leaning over
        box(o, d, vec3(-BOX_HW + BOX_T, BOX_T, -BOX_HD + 0.07), vec3(0.05, BOX_T + 0.316, BOX_HD - BOX_T), M_SLEEVE, l);
        {
          vec3 pivot = vec3(0.052, BOX_T, 0.0);
          float cs = cos(SLEEVE_LEAN), sn = sin(SLEEVE_LEAN);
          vec3 ro = o - pivot, rd = d;
          ro.xy = vec2(cs * ro.x - sn * ro.y, sn * ro.x + cs * ro.y); // into the leaning sleeve's frame
          rd.xy = vec2(cs * rd.x - sn * rd.y, sn * rd.x + cs * rd.y);
          Hit s; s.t = l.t; s.m = M_NONE; s.n = vec3(0);
          box(ro, rd, vec3(0.0, 0.0, -BOX_HD + 0.075), vec3(0.004, 0.316, BOX_HD - BOX_T - 0.005), M_SLEEVE, s);
          if (s.t < l.t) { l.t = s.t; l.m = s.m; l.n = vec3(cs * s.n.x + sn * s.n.y, -sn * s.n.x + cs * s.n.y, s.n.z); }
        }
        // the player
        for (int i = 0; i < 4; i++) {
          vec2 f = vec2(i < 2 ? -0.19 : 0.19, i % 2 == 0 ? -0.14 : 0.14);
          cylinder(o, d, vec3(f.x, BOX_H, f.y), vec3(f.x, PLINTH_Y0, f.y), 0.024, M_RUBBER, l);
        }
        box(o, d, vec3(-0.225, PLINTH_Y0, -0.175), vec3(0.225, PLINTH_Y1, 0.175), M_PLINTH, l);
        cylinder(o, d, vec3(REC_C.x, PLINTH_Y1, REC_C.y), vec3(REC_C.x, 0.625, REC_C.y), 0.148, M_PLATTER, l);
        cylinder(o, d, vec3(REC_C.x, 0.624, REC_C.y), vec3(REC_C.x, REC_Y, REC_C.y), REC_R, M_RECORD, l);
        cylinder(o, d, vec3(REC_C.x, REC_Y - 0.001, REC_C.y), vec3(REC_C.x, REC_Y + 0.013, REC_C.y), 0.0035, M_METAL, l);
        // tonearm: its base, the tube, the counterweight behind the pivot, the headshell and
        // the cartridge down in the grooves, and an empty arm rest
        vec3 along = normalize(ARM_HEAD - ARM_PIVOT);
        cylinder(o, d, vec3(ARM_PIVOT.x, PLINTH_Y1, ARM_PIVOT.z), vec3(ARM_PIVOT.x, ARM_PIVOT.y + 0.006, ARM_PIVOT.z), 0.026, M_METAL, l);
        cylinder(o, d, ARM_PIVOT, ARM_HEAD, 0.0045, M_METAL, l);
        cylinder(o, d, ARM_PIVOT - along * 0.03, ARM_PIVOT - along * 0.068, 0.018, M_METAL, l);
        cylinder(o, d, ARM_HEAD - along * 0.004, ARM_HEAD + along * 0.03, 0.009, M_METAL, l);
        vec3 stylus = ARM_HEAD + along * 0.018;
        cylinder(o, d, vec3(stylus.x, REC_Y + 0.002, stylus.z), vec3(stylus.x, ARM_HEAD.y, stylus.z), 0.007, M_PLINTH, l);
        cylinder(o, d, vec3(0.2, PLINTH_Y1, -0.07), vec3(0.2, 0.642, -0.07), 0.005, M_METAL, l);
        // start button and speed selector at the front left
        cylinder(o, d, vec3(-0.19, PLINTH_Y1, -0.145), vec3(-0.19, PLINTH_Y1 + 0.007, -0.145), 0.014, M_METAL, l);
        cylinder(o, d, vec3(-0.15, PLINTH_Y1, -0.15), vec3(-0.15, PLINTH_Y1 + 0.005, -0.15), 0.008, M_METAL, l);
        if (l.t < h.t) { h.t = l.t; h.n = yawWorldDir(l.n, TABLE_C, TABLE_S); h.m = l.m; }
      }

      // the top of the record outside its label: vinyl, which gets a glossy reflection
      bool vinyl(vec3 p, vec3 n) {
        if (n.y < 0.5) return false;
        vec3 q = tableLocal(p);
        return q.y > REC_Y - 5e-4 && length(q.xz - REC_C) > LABEL_R;
      }

      // The candle's tumbler, in the jar's frame: a glass cylinder open at the top with wax
      // inside up to WAX_Y. The navy glass is treated as opaque (too dark to see into), so only
      // what shows from outside is modelled: the outer wall, the rim, and through the opening
      // the inside of the wall above the wax, and the wax.
      void jar(vec3 o, vec3 d, inout Hit h) {
        float a = dot(d.xz, d.xz);
        float ri = JAR_R - JAR_T;
        if (a > 1e-12) {
          float b = dot(o.xz, d.xz);
          float disc = b * b - a * (dot(o.xz, o.xz) - JAR_R * JAR_R);
          if (disc < 0.0) return; // nowhere near it
          float t = (-b - sqrt(disc)) / a; // the outer wall, from outside
          float y = o.y + d.y * t;
          if (t > 1e-4 && t < h.t && y > 0.0 && y < JAR_H) { h.t = t; h.n = vec3((o.xz + d.xz * t) / JAR_R, 0.0).xzy; h.m = M_GLASS; }
          disc = b * b - a * (dot(o.xz, o.xz) - ri * ri);
          if (disc > 0.0) {
            t = (-b + sqrt(disc)) / a; // the inner wall, from inside (anything else would have met the outer wall first)
            y = o.y + d.y * t;
            if (t > 1e-4 && t < h.t && y > WAX_Y && y < JAR_H) { h.t = t; h.n = -vec3((o.xz + d.xz * t) / ri, 0.0).xzy; h.m = M_GLASS; }
          }
        }
        if (d.y < 0.0) {
          float t = (JAR_H - o.y) / d.y; // the rim
          vec2 q = o.xz + d.xz * t;
          float r2 = dot(q, q);
          if (t > 1e-4 && t < h.t && r2 < JAR_R * JAR_R && r2 > ri * ri) { h.t = t; h.n = vec3(0, 1, 0); h.m = M_GLASS; }
          t = (WAX_Y - o.y) / d.y; // the wax
          q = o.xz + d.xz * t;
          if (t > 1e-4 && t < h.t && dot(q, q) < ri * ri) { h.t = t; h.n = vec3(0, 1, 0); h.m = M_WAX; }
        }
      }

      // The crate the candle stands on, in its frame (origin in the middle of its footprint,
      // open side at -z): a plywood crate like the record player's, stood on end, with a shelf
      // and a few books lying in the bottom; on top the jar, a box of matches and a spent match.
      void candleTable(vec3 wo, vec3 wd, inout Hit h) {
        vec3 o = crateLocal(wo), d = yawLocalDir(wd, BOARD2_C, BOARD2_S);
        float tn, tf; vec3 n;
        if (!slab(o, d, vec3(-CRATE_HW - 0.01, 0.0, -CRATE_HD - 0.01), vec3(CRATE_HW + 0.01, CRATE_H + JAR_H + 0.04, CRATE_HD + 0.01), tn, tf, n) || tn >= h.t) return;
        Hit l; l.t = h.t; l.m = M_NONE; l.n = vec3(0);
        box(o, d, vec3(-CRATE_HW, CRATE_H - BOX_T, -CRATE_HD), vec3(CRATE_HW, CRATE_H, CRATE_HD), M_WOOD, l);
        box(o, d, vec3(-CRATE_HW, 0.0, -CRATE_HD), vec3(CRATE_HW, BOX_T, CRATE_HD), M_WOOD, l);
        box(o, d, vec3(-CRATE_HW, BOX_T, -CRATE_HD), vec3(-CRATE_HW + BOX_T, CRATE_H - BOX_T, CRATE_HD), M_WOOD, l);
        box(o, d, vec3(CRATE_HW - BOX_T, BOX_T, -CRATE_HD), vec3(CRATE_HW, CRATE_H - BOX_T, CRATE_HD), M_WOOD, l);
        box(o, d, vec3(-CRATE_HW + BOX_T, BOX_T, CRATE_HD - BOX_T), vec3(CRATE_HW - BOX_T, CRATE_H - BOX_T, CRATE_HD), M_WOOD, l);
        box(o, d, vec3(-CRATE_HW + BOX_T, SHELF_Y, -CRATE_HD + 0.01), vec3(CRATE_HW - BOX_T, SHELF_Y + BOX_T, CRATE_HD - BOX_T), M_WOOD, l);
        // books lying flat on the bottom, spines out, not quite squared up
        box(o, d, vec3(-0.135, BOX_T, -0.125), vec3(0.12, BOX_T + 0.034, 0.11), M_BOOK, l);
        box(o, d, vec3(-0.125, BOX_T + 0.034, -0.118), vec3(0.105, BOX_T + 0.058, 0.1), M_BOOK, l);
        box(o, d, vec3(-0.14, BOX_T + 0.058, -0.13), vec3(0.128, BOX_T + 0.079, 0.115), M_BOOK, l);
        // on top: the jar, a box of matches (turned a little) and a spent match
        {
          vec3 jo = o - vec3(CANDLE_C.x, CRATE_H, CANDLE_C.y);
          Hit j; j.t = l.t; j.m = M_NONE; j.n = vec3(0);
          jar(jo, d, j);
          cylinder(jo, d, vec3(0.0, WAX_Y - 0.002, 0.0), vec3(0.0006, FLAME_Y + 0.002, 0.0003), 0.0009, M_RUBBER, j); // the wick, charred black
          if (j.t < l.t) l = j;
        }
        {
          vec3 pivot = vec3(0.095, CRATE_H, 0.06);
          float cs = cos(0.42), sn = sin(0.42);
          vec3 ro = o - pivot, rd = d;
          ro.xz = vec2(cs * ro.x - sn * ro.z, sn * ro.x + cs * ro.z);
          rd.xz = vec2(cs * rd.x - sn * rd.z, sn * rd.x + cs * rd.z);
          Hit s; s.t = l.t; s.m = M_NONE; s.n = vec3(0);
          box(ro, rd, vec3(-0.027, 0.0, -0.018), vec3(0.027, 0.014, 0.018), M_MATCHBOX, s);
          if (s.t < l.t) { l.t = s.t; l.m = s.m; l.n = vec3(cs * s.n.x + sn * s.n.z, s.n.y, -sn * s.n.x + cs * s.n.z); }
        }
        cylinder(o, d, vec3(0.03, CRATE_H + 0.0012, -0.075), vec3(0.074, CRATE_H + 0.0012, -0.09), 0.0012, M_MATCH, l);
        if (l.t < h.t) { h.t = l.t; h.n = yawWorldDir(l.n, BOARD2_C, BOARD2_S); h.m = l.m; }
      }

      // ---- the sofa and the dog: soft shapes, so a signed distance field rather than boxes ----
      float sdRoundBox(vec3 p, vec3 b, float r) { vec3 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - r; }
      float sdEllipsoid(vec3 p, vec3 r) { float k0 = length(p / r); float k1 = length(p / (r * r)); return k0 * (k0 - 1.0) / max(k1, 1e-6); }
      float sdCapsule(vec3 p, vec3 a, vec3 b, float r) { vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - r; }
      float smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }
      // into the frame of something leaning back by the angle with cosine c and sine s (about x), or turned about z
      vec3 leanBack(vec3 p, float c, float s) { return vec3(p.x, c * p.y + s * p.z, c * p.z - s * p.y); }
      vec3 turnZ(vec3 p, float c, float s) { return vec3(c * p.x - s * p.y, s * p.x + c * p.y, p.z); }

      // The sofa, in its frame: the base (the cover hangs to the floor), the seat cushion, two
      // rolled arms, the back leaning a little with a cushion each side propped on it, and in the
      // left corner a square patterned pillow with a smaller fluffy one leaning on it. m is the
      // nearest part's material.
      float sofaSDF(vec3 p, out int m) {
        float d = sdRoundBox(p - vec3(0.0, 0.21, 0.04), vec3(0.72, 0.13, 0.33), 0.09); // the base: to the floor, top at 0.43
        d = smin(d, sdRoundBox(p - vec3(0.0, 0.45, -0.08), vec3(0.50, 0.0, 0.28), 0.07), 0.03); // the seat cushion: top at SEAT_Y, its lip out past the base
        vec3 a = vec3(abs(p.x), p.y, p.z); // the arms: a block from x 0.56 out, with a roll along the top (top at 0.675)
        d = smin(d, sdRoundBox(a - vec3(0.69, 0.40, 0.02), vec3(0.03, 0.10, 0.31), 0.10), 0.03);
        d = smin(d, sdCapsule(a, vec3(0.69, 0.56, -0.30), vec3(0.69, 0.56, 0.36), 0.115), 0.04);
        vec3 q = leanBack(p - vec3(0.0, 0.30, 0.31), 0.99027, 0.13917); // the back leans 8°: a slab with a roll along its top
        d = smin(d, sdRoundBox(q - vec3(0.0, 0.26, 0.05), vec3(0.72, 0.18, 0.01), 0.08), 0.03);
        d = smin(d, sdCapsule(q, vec3(-0.70, 0.50, 0.05), vec3(0.70, 0.50, 0.05), 0.10), 0.04);
        q = leanBack(p - vec3(0.0, 0.50, 0.14), 0.98481, 0.17365); // the back cushions lean 10°
        d = smin(d, sdRoundBox(vec3(abs(q.x), q.y, q.z) - vec3(0.29, 0.17, 0.10), vec3(0.19, 0.10, 0.03), 0.07), 0.02);
        m = M_SOFA;
        q = turnZ(leanBack(p - vec3(-0.36, 0.52, 0.10), 0.92718, 0.37461), 0.99756, 0.06976); // the square pillow: 22° back, turned 4°
        float pillow = sdRoundBox(q - vec3(0.0, 0.20, 0.0), vec3(0.17, 0.17, 0.015), 0.03);
        if (pillow < d) { d = pillow; m = M_PILLOW; }
        q = turnZ(leanBack(p - vec3(-0.26, 0.52, -0.02), 0.86603, 0.5), 0.99452, -0.10453); // the fluffy one: 30° back, turned -6°
        pillow = sdRoundBox(q - vec3(0.0, 0.16, 0.0), vec3(0.13, 0.13, 0.02), 0.035);
        if (pillow < d) { d = pillow; m = M_SOFA; }
        return d;
      }

      // The dog, in the sofa's frame. His body lies at DOG's angle: the ribs (swelling with
      // uBreath), the hindquarters, the near hind leg sprawled flat out to the side with its foot
      // beside his belly, a tail lying on the cushion. The neck reaches for the right arm, where
      // his head rests on its chin: a domed skull, the long brick of a schnauzer muzzle and beard,
      // a ridge of brow over the eyes, ears folded forward and down the sides of his head, a nose.
      // The front legs lie ahead of his chest; the near one hangs its paw over the front edge, the
      // far one lies along the seat by the arm.
      float dogSDF(vec3 p, out int m) {
        m = M_DOG;
        float bound = sdRoundBox(p - vec3(0.325, 0.59, -0.135), vec3(0.475, 0.23, 0.335), 0.0);
        if (bound > 0.04) return bound; // nowhere near him: the box round him is a fair enough distance
        vec3 b = yawLocal(p, DOG_POS, DOG_C, DOG_S);
        float ribs = sdEllipsoid(b - vec3(0.10, 0.0, 0.0), vec3(0.17, 0.125 * uBreath, 0.11 * uBreath));
        float body = smin(ribs, sdEllipsoid(b - vec3(-0.15, -0.01, 0.0), vec3(0.135, 0.11, 0.105)), 0.08);
        body = smin(body, sdEllipsoid(b - vec3(-0.13, -0.05, -0.09), vec3(0.10, 0.075, 0.045)), 0.04); // the near thigh, flat on the seat
        body = smin(body, sdCapsule(b, vec3(-0.06, -0.07, -0.13), vec3(0.06, -0.075, -0.145), 0.03), 0.02); // its foot, out beside the belly
        body = smin(body, sdCapsule(b, vec3(-0.27, -0.02, 0.02), vec3(-0.36, -0.085, 0.06), 0.018), 0.03); // the tail
        body = smin(body, sdCapsule(p, vec3(0.39, 0.68, -0.21), vec3(0.55, 0.715, -0.22), 0.06), 0.05); // the neck
        vec3 h = p - HEAD_C;
        vec3 hm = vec3(h.x, h.y, abs(h.z)); // the head is symmetrical
        float head = sdRoundBox(h, vec3(0.038, 0.02, 0.022), 0.036); // the skull: a dome flattened on top and at the sides, as the breed's is
        head = smin(head, sdCapsule(h, vec3(0.03, -0.005, 0.0), vec3(0.115, -0.015, -0.002), 0.03), 0.03); // the muzzle
        head = smin(head, sdRoundBox(h - vec3(0.10, -0.055, -0.002), vec3(0.045, 0.018, 0.022), 0.014), 0.02); // the beard, a deep block hanging under it
        head = smin(head, sdEllipsoid(hm - vec3(0.058, 0.032, 0.026), vec3(0.022, 0.012, 0.017)), 0.012); // a bushy brow over each eye
        vec3 e = turnZ(hm - vec3(0.0, 0.0, 0.062), 0.34202, 0.93969); // the ears: flaps down the sides of the skull, tips 70° down and a little forward...
        head = smin(head, sdEllipsoid(e, vec3(0.05, 0.03, 0.011)), 0.01);
        head = smin(head, sdEllipsoid(hm - vec3(-0.008, 0.052, 0.05), vec3(0.03, 0.012, 0.018)), 0.012); // ...folded over the top corners of the skull
        float nose = length(h - vec3(0.135, -0.005, -0.002)) - 0.016;
        float near = sdCapsule(p, vec3(0.39, 0.59, -0.26), vec3(0.45, 0.55, -0.35), 0.04); // near front leg: upper, forearm, the paw hanging over the edge
        near = smin(near, sdCapsule(p, vec3(0.45, 0.55, -0.35), vec3(0.53, 0.52, -0.42), 0.032), 0.02);
        near = smin(near, sdCapsule(p, vec3(0.53, 0.51, -0.43), vec3(0.535, 0.43, -0.445), 0.034), 0.02);
        float far = sdCapsule(p, vec3(0.43, 0.58, -0.17), vec3(0.51, 0.555, -0.27), 0.04); // far front leg, lying along the seat by the arm
        far = smin(far, sdCapsule(p, vec3(0.51, 0.555, -0.27), vec3(0.545, 0.55, -0.36), 0.032), 0.02);
        float d = smin(smin(body, head, 0.03), min(near, far), 0.04);
        if (nose < d) { d = nose; m = M_NOSE; }
        return d;
      }

      float sofaField(vec3 p) { int m; return min(sofaSDF(p, m), dogSDF(p, m)); }

      // Sphere-traces the sofa and the dog inside one box round them. The normal is the field's
      // gradient, roughened a little: curly fleece on the sofa, a wiry coat on the dog.
      void sofa(vec3 wo, vec3 wd, inout Hit h) {
        vec3 o = sofaLocal(wo), d = yawLocalDir(wd, SOFA_C, SOFA_S);
        float tn, tf; vec3 n;
        if (!slab(o, d, vec3(-0.84, 0.0, -0.47), vec3(0.84, 0.92, 0.48), tn, tf, n) || tn >= h.t) return;
        float t = max(tn, 1e-4);
        tf = min(tf, h.t);
        int m = M_NONE, ms, md;
        float dist = 1.0;
        for (int i = 0; i < 192; i++) {
          vec3 p = o + d * t;
          float ds = sofaSDF(p, ms), dd = dogSDF(p, md);
          dist = min(ds, dd);
          if (dist < 3e-4) { m = dd < ds ? md : ms; break; }
          t += max(dist * 0.95, 2e-4);
          if (t > tf) return;
        }
        // out of steps creeping along a silhouette: if it's within a few mm, that's a hit (a miss would show the background through the edge)
        if (m == M_NONE) { if (dist > 3e-3) return; int mm; m = dogSDF(o + d * t, mm) < sofaSDF(o + d * t, ms) ? mm : ms; }
        vec3 p = o + d * t;
        vec2 e = vec2(4e-4, 0.0);
        n = normalize(vec3(sofaField(p + e.xyy) - sofaField(p - e.xyy), sofaField(p + e.yxy) - sofaField(p - e.yxy), sofaField(p + e.yyx) - sofaField(p - e.yyx)));
        float rough = m == M_DOG ? 0.14 : m == M_NOSE ? 0.0 : 0.09, freq = m == M_DOG ? 350.0 : 110.0;
        n = normalize(n + rough * 2.0 * (vec3(noise(p.yz * freq), noise(p.zx * freq + 7.0), noise(p.xy * freq + 13.0)) - 0.5));
        h.t = t; h.n = yawWorldDir(n, SOFA_C, SOFA_S); h.m = m;
      }

      // ---- the work station ----
      // the laptop's frame (origin under the middle of its base) from the crate's, and the lid's from
      // the laptop's: x across, y up the lid from the hinge, z through it from the screen's face to its back
      vec3 lapLocal(vec3 q) { return q - vec3(LAP_C.x, DESK_H, LAP_C.y); }
      vec3 lidLocal(vec3 q) {
        q -= vec3(0.0, LAP_T, HINGE_Z);
        return vec3(q.x, LID_C * q.y + LID_S * q.z, LID_C * q.z - LID_S * q.y);
      }
      // the base and the lid, both slabs with rounded corners
      float laptopSDF(vec3 q) {
        float base = sdRoundBox(q - vec3(0.0, 0.5 * LAP_T, 0.0), vec3(LAP_HW, 0.5 * LAP_T, LAP_HD) - LAP_R, LAP_R);
        vec3 l = lidLocal(q);
        float lid = sdRoundBox(l - vec3(0.0, 0.5 * LID_H, 0.5 * LID_T), vec3(LAP_HW, 0.5 * LID_H, 0.5 * LID_T) - 0.002, 0.002);
        return min(base, lid);
      }
      // where on the screen a point of the lid's face is (0..1 across from the left, 0..1 down from the top); outside that it's bezel
      vec2 screenUV(vec3 l) {
        return vec2((l.x + LAP_HW - BEZEL_X) / (2.0 * (LAP_HW - BEZEL_X)), 1.0 - (l.y - BEZEL_LO) / (LID_H - BEZEL_LO - BEZEL_HI));
      }

      // Sphere-traces the laptop (crate frame). A hit on the lid's face inside the bezel is the screen.
      void laptop(vec3 o, vec3 d, inout Hit l) {
        vec3 lo = lapLocal(o);
        float tn, tf; vec3 n;
        vec3 top = vec3(LAP_HW + 0.01, LAP_T + LID_H * LID_C + 0.01, HINGE_Z + LID_H * LID_S + LID_T + 0.01);
        if (!slab(lo, d, vec3(-LAP_HW - 0.01, -0.002, -LAP_HD - 0.01), top, tn, tf, n) || tn >= l.t) return;
        float t = max(tn, 1e-4);
        tf = min(tf, l.t);
        for (int i = 0; i < 64; i++) {
          vec3 q = lo + d * t;
          float dist = laptopSDF(q);
          if (dist < 1e-4) {
            vec2 e = vec2(2e-4, 0.0);
            vec3 nn = normalize(vec3(laptopSDF(q + e.xyy) - laptopSDF(q - e.xyy), laptopSDF(q + e.yxy) - laptopSDF(q - e.yxy), laptopSDF(q + e.yyx) - laptopSDF(q - e.yyx)));
            vec3 lq = lidLocal(q);
            vec2 uv = screenUV(lq);
            bool face = lq.z < 0.0015 && lq.y > 0.0 && dot(nn, vec3(0.0, LID_S, -LID_C)) > 0.7;
            l.t = t; l.n = nn; l.m = face && uv.x > 0.0 && uv.x < 1.0 && uv.y > 0.0 && uv.y < 1.0 ? M_SCREEN : M_LAPTOP;
            return;
          }
          t += max(dist * 0.95, 1e-4);
          if (t > tf) return;
        }
      }

      // the sheets of paper, each a thin box turned to its own angle; on the floor they lie one over
      // another where they overlap, later ones on top
      float paperTop(int i) { return i == PAPER_N - 1 ? DESK_H + 0.0004 : 0.0002 + PAPER_T * float(i); }
      void papers(vec3 o, vec3 d, inout Hit l) {
        for (int i = 0; i < PAPER_N; i++) {
          vec4 s = PAPER[i];
          float top = paperTop(i);
          float cs = cos(s.z), sn = sin(s.z);
          vec3 ro = o - vec3(s.x, 0.0, s.y), rd = d;
          ro.xz = vec2(cs * ro.x - sn * ro.z, sn * ro.x + cs * ro.z);
          rd.xz = vec2(cs * rd.x - sn * rd.z, sn * rd.x + cs * rd.z);
          Hit p; p.t = l.t; p.m = M_NONE; p.n = vec3(0);
          box(ro, rd, vec3(-PAPER_HW, top - PAPER_T, -PAPER_HL), vec3(PAPER_HW, top, PAPER_HL), M_PAPER, p);
          if (p.t < l.t) { l.t = p.t; l.m = p.m; l.n = vec3(cs * p.n.x + sn * p.n.z, p.n.y, -sn * p.n.x + cs * p.n.z); }
        }
      }

      // The crate with its shelves of books, the laptop, the candle, the pencil and the papers.
      void workstation(vec3 wo, vec3 wd, inout Hit h) {
        vec3 o = deskLocal(wo), d = yawLocalDir(wd, DESK_C, DESK_S);
        float tn, tf; vec3 n;
        if (!slab(o, d, vec3(-0.65, 0.0, -0.85), vec3(0.7, DESK_H + 0.24, 0.25), tn, tf, n) || tn >= h.t) return;
        Hit l; l.t = h.t; l.m = M_NONE; l.n = vec3(0);
        // the crate and what stands on it, up to the top of the laptop's lid (1.11 m; it was once clipped at the jar's rim + 4 cm, and the top of the lid went missing)
        if (slab(o, d, vec3(-DESK_HW - 0.02, 0.0, -DESK_HD - 0.02), vec3(DESK_HW + 0.02, DESK_H + 0.24, DESK_HD + 0.04), tn, tf, n) && tn < l.t) {
          // the crate: top, bottom, sides, back and two shelves; open to the front
          box(o, d, vec3(-DESK_HW, DESK_H - BOX_T, -DESK_HD), vec3(DESK_HW, DESK_H, DESK_HD), M_WOOD, l);
          box(o, d, vec3(-DESK_HW, 0.0, -DESK_HD), vec3(DESK_HW, BOX_T, DESK_HD), M_WOOD, l);
          box(o, d, vec3(-DESK_HW, BOX_T, -DESK_HD), vec3(-DESK_HW + BOX_T, DESK_H - BOX_T, DESK_HD), M_WOOD, l);
          box(o, d, vec3(DESK_HW - BOX_T, BOX_T, -DESK_HD), vec3(DESK_HW, DESK_H - BOX_T, DESK_HD), M_WOOD, l);
          box(o, d, vec3(-DESK_HW + BOX_T, BOX_T, DESK_HD - BOX_T), vec3(DESK_HW - BOX_T, DESK_H - BOX_T, DESK_HD), M_WOOD, l);
          box(o, d, vec3(-DESK_HW + BOX_T, DESK_S1, -DESK_HD + 0.01), vec3(DESK_HW - BOX_T, DESK_S1 + BOX_T, DESK_HD - BOX_T), M_WOOD, l);
          box(o, d, vec3(-DESK_HW + BOX_T, DESK_S2, -DESK_HD + 0.01), vec3(DESK_HW - BOX_T, DESK_S2 + BOX_T, DESK_HD - BOX_T), M_WOOD, l);
          // the books: rows standing spine-out and a few lying flat, and one leaning over to the side
          for (int i = 0; i < DBOOK_N; i++) box(o, d, DBOOK[2 * i], DBOOK[2 * i + 1], M_DBOOK, l);
          {
            vec3 ro = o - DBOOK_LEAN, rd = d;
            ro.xy = vec2(LEAN_C * ro.x - LEAN_S * ro.y, LEAN_S * ro.x + LEAN_C * ro.y);
            rd.xy = vec2(LEAN_C * rd.x - LEAN_S * rd.y, LEAN_S * rd.x + LEAN_C * rd.y);
            Hit s; s.t = l.t; s.m = M_NONE; s.n = vec3(0);
            box(ro, rd, vec3(0.0, 0.0, -0.12), vec3(0.026, 0.23, 0.17), M_DBOOK, s);
            if (s.t < l.t) { l.t = s.t; l.m = s.m; l.n = vec3(LEAN_C * s.n.x + LEAN_S * s.n.y, -LEAN_S * s.n.x + LEAN_C * s.n.y, s.n.z); }
          }
          // on top: the laptop, the candle in its jar, a pencil
          laptop(o, d, l);
          {
            vec3 jo = o - vec3(DESK_JAR.x, DESK_H, DESK_JAR.y);
            Hit j; j.t = l.t; j.m = M_NONE; j.n = vec3(0);
            jar(jo, d, j);
            cylinder(jo, d, vec3(0.0, WAX_Y - 0.002, 0.0), vec3(-0.0005, FLAME_Y + 0.002, 0.0004), 0.0009, M_RUBBER, j);
            if (j.t < l.t) l = j;
          }
          cylinder(o, d, vec3(-0.235, DESK_H + 0.0035, -0.175), vec3(-0.145, DESK_H + 0.0035, -0.115), 0.0035, M_PENCIL, l);
        }
        papers(o, d, l);
        if (l.t < h.t) { h.t = l.t; h.n = yawWorldDir(l.n, DESK_C, DESK_S); h.m = l.m; }
      }

      // ---- the art corner ----
      // A box turned by a yaw about y and then tipped back by a lean about x, standing at base:
      // a canvas (leaning against something, or laid flat by a lean of a right angle), the
      // palette, the easel's rear leg.
      void tiltedBox(vec3 o, vec3 d, vec3 base, float yaw, float lean, vec3 lo, vec3 hi, int m, inout Hit h) {
        float c = cos(yaw), s = sin(yaw), lc = cos(lean), ls = sin(lean);
        vec3 ro = o - base, rd = d;
        ro = vec3(c * ro.x - s * ro.z, ro.y, s * ro.x + c * ro.z);
        rd = vec3(c * rd.x - s * rd.z, rd.y, s * rd.x + c * rd.z);
        ro = vec3(ro.x, lc * ro.y + ls * ro.z, lc * ro.z - ls * ro.y);
        rd = vec3(rd.x, lc * rd.y + ls * rd.z, lc * rd.z - ls * rd.y);
        Hit l; l.t = h.t; l.m = M_NONE; l.n = vec3(0);
        box(ro, rd, lo, hi, m, l);
        if (l.t >= h.t) return;
        vec3 n = vec3(l.n.x, lc * l.n.y - ls * l.n.z, ls * l.n.y + lc * l.n.z); // out of the lean...
        h.t = l.t; h.n = vec3(c * n.x + s * n.z, n.y, -s * n.x + c * n.z); // ...and out of the yaw
        h.m = l.m;
      }

      void canvasBox(vec3 o, vec3 d, int i, inout Hit l) {
        vec3 f = CANVAS_FORM[i];
        tiltedBox(o, d, CANVAS_POS[i].xyz, CANVAS_POS[i].w, f.x,
          vec3(-0.5 * f.y, 0.0, 0.0), vec3(0.5 * f.y, f.z, CANVAS_T), M_CANVAS, l);
      }

      // The easel (corner frame): everything in the mast is axis-aligned in its leaning frame, so
      // the uprights, the braces, the canvas ledge with its lip and the clamp over the canvas's
      // top edge are plain boxes there; the two front feet lie flat on the floor and the rear leg
      // props the mast up from behind, so those stand in the corner's frame.
      void easel(vec3 o, vec3 d, inout Hit l) {
        vec3 mo = easelLocal(o), md = easelLocal(d);
        Hit e; e.t = l.t; e.m = M_NONE; e.n = vec3(0);
        for (int i = -1; i <= 1; i += 2) {
          float x = float(i) * EASEL_X;
          box(mo, md, vec3(x - EASEL_W, 0.0, -EASEL_T), vec3(x + EASEL_W, EASEL_H, EASEL_T), M_EASEL, e);
        }
        box(mo, md, vec3(-EASEL_X, 0.400, -0.017), vec3(EASEL_X, 0.436, 0.017), M_EASEL, e); // two braces between them
        box(mo, md, vec3(-EASEL_X, 1.290, -0.017), vec3(EASEL_X, 1.326, 0.017), M_EASEL, e);
        box(mo, md, vec3(-0.24, LEDGE_Y - 0.03, -0.076), vec3(0.24, LEDGE_Y, EASEL_T), M_EASEL, e); // the ledge the canvas stands on
        box(mo, md, vec3(-0.24, LEDGE_Y, -0.076), vec3(0.24, LEDGE_Y + 0.037, -0.063), M_EASEL, e); // and the lip along its front
        box(mo, md, vec3(-0.175, 1.651, -0.052), vec3(0.175, 1.687, EASEL_T), M_EASEL, e); // the clamp bar over the canvas's top edge...
        box(mo, md, vec3(-0.175, 1.616, -0.052), vec3(0.175, 1.651, -0.040), M_EASEL, e); // ...and the pad it presses the face with
        if (e.t < l.t) {
          l.t = e.t; l.m = e.m;
          l.n = vec3(e.n.x, EASEL_LEAN_C * e.n.y - EASEL_LEAN_S * e.n.z, EASEL_LEAN_S * e.n.y + EASEL_LEAN_C * e.n.z);
        }
        for (int i = -1; i <= 1; i += 2) {
          float x = float(i) * EASEL_X;
          box(o, d, vec3(x - 0.032, 0.0, -EASEL_FOOT), vec3(x + 0.032, 0.038, 0.10), M_EASEL, l);
        }
        tiltedBox(o, d, vec3(0.0, 0.0, EASEL_REAR), 0.0, -0.2377, vec3(-0.024, 0.0, -0.019), vec3(0.024, 1.6555, 0.019), M_EASEL, l);
      }

      // The crate at the painter's side (its own frame: the corner's, moved to its footprint —
      // it shares the corner's yaw, as the candle's crate shares its board's): a plywood crate
      // open to the front with a shelf, two spare canvas boards stacked in the bottom, and on top
      // an old tin with brushes standing bristle-up in it, tubes of oil paint and a folded rag.
      void artBox(vec3 o, vec3 d, inout Hit l) {
        vec3 b = o - ART_BOX;
        float tn, tf; vec3 n;
        if (!slab(b, d, vec3(-ART_BOX_HW - 0.01, 0.0, -ART_BOX_HD - 0.01), vec3(ART_BOX_HW + 0.01, ART_BOX_H + 0.27, ART_BOX_HD + 0.01), tn, tf, n) || tn >= l.t) return;
        box(b, d, vec3(-ART_BOX_HW, ART_BOX_H - BOX_T, -ART_BOX_HD), vec3(ART_BOX_HW, ART_BOX_H, ART_BOX_HD), M_WOOD, l);
        box(b, d, vec3(-ART_BOX_HW, 0.0, -ART_BOX_HD), vec3(ART_BOX_HW, BOX_T, ART_BOX_HD), M_WOOD, l);
        box(b, d, vec3(-ART_BOX_HW, BOX_T, -ART_BOX_HD), vec3(-ART_BOX_HW + BOX_T, ART_BOX_H - BOX_T, ART_BOX_HD), M_WOOD, l);
        box(b, d, vec3(ART_BOX_HW - BOX_T, BOX_T, -ART_BOX_HD), vec3(ART_BOX_HW, ART_BOX_H - BOX_T, ART_BOX_HD), M_WOOD, l);
        box(b, d, vec3(-ART_BOX_HW + BOX_T, BOX_T, ART_BOX_HD - BOX_T), vec3(ART_BOX_HW - BOX_T, ART_BOX_H - BOX_T, ART_BOX_HD), M_WOOD, l);
        box(b, d, vec3(-ART_BOX_HW + BOX_T, ART_BOX_SHELF, -ART_BOX_HD + 0.01), vec3(ART_BOX_HW - BOX_T, ART_BOX_SHELF + BOX_T, ART_BOX_HD - BOX_T), M_WOOD, l);
        box(b, d, vec3(-0.17, BOX_T, -0.13), vec3(0.16, BOX_T + 0.019, 0.12), M_CANVAS, l); // spare canvas boards stacked in the bottom
        box(b, d, vec3(-0.155, BOX_T + 0.019, -0.145), vec3(0.175, BOX_T + 0.036, 0.105), M_CANVAS, l);
        // the tin, and the brushes fanned out of it: a handle, its ferrule and the bristles, which
        // have not been cleaned
        vec3 potBase = vec3(POT_C.x, ART_BOX_H, POT_C.y);
        cylinder(b, d, potBase, potBase + vec3(0.0, POT_H, 0.0), POT_R, M_POT, l);
        for (int i = 0; i < BRUSH_N; i++) {
          float a = 6.2831853 * float(i) / float(BRUSH_N) + 0.37;
          float k = hash2(vec2(float(i), 11.0));
          vec3 root = potBase + vec3(0.62 * POT_R * cos(a), 0.012, 0.62 * POT_R * sin(a));
          vec3 dir = normalize(vec3((0.055 + 0.10 * k) * cos(a), 1.0, (0.055 + 0.10 * k) * sin(a)));
          vec3 top = root + dir * (0.17 + 0.075 * hash2(vec2(float(i), 23.0)));
          cylinder(b, d, root, top, 0.0045 + 0.0015 * k, M_BRUSH, l);
          cylinder(b, d, top, top + dir * 0.022, 0.0062, M_METAL, l);
          cylinder(b, d, top + dir * 0.021, top + dir * 0.048, 0.0052 + 0.002 * k, M_BRISTLE, l);
        }
        for (int i = 0; i < PAINT_TUBE_N; i++) {
          vec4 t = PAINT_TUBE[i];
          vec3 mid = vec3(t.x, (i < 4 ? ART_BOX_H : ART_BOX_SHELF + BOX_T) + PAINT_TUBE_R, t.y);
          vec3 axis = vec3(cos(t.z), 0.0, sin(t.z));
          cylinder(b, d, mid - axis * PAINT_TUBE_L, mid + axis * PAINT_TUBE_L, PAINT_TUBE_R, M_PAINT_TUBE, l);
          cylinder(b, d, mid + axis * PAINT_TUBE_L, mid + axis * (PAINT_TUBE_L + 0.014), 0.0085, M_PAINT_TUBE, l); // the cap
        }
        box(b, d, vec3(-0.19, ART_BOX_H, 0.06), vec3(-0.07, ART_BOX_H + 0.016, 0.16), M_RAG, l); // a rag, folded over once
        box(b, d, vec3(-0.175, ART_BOX_H + 0.016, 0.075), vec3(-0.095, ART_BOX_H + 0.029, 0.15), M_RAG, l);
      }

      // The whole corner, in its frame. The mess is spread over nearly three metres of floor, so
      // inner boxes keep the cost off rays that only pass through part of it: one round the easel
      // and the canvases stacked just behind it, one round the two further back by the sofa, and one
      // round the canvas lying flat in front of it. The paint on the floor is colour only.
      void artCorner(vec3 wo, vec3 wd, inout Hit h) {
        vec3 o = artLocal(wo), d = yawLocalDir(wd, ART_C, ART_S);
        float tn, tf; vec3 n;
        if (!slab(o, d, vec3(-0.62, 0.0, -0.82), vec3(1.90, 1.85, 2.10), tn, tf, n) || tn >= h.t) return;
        Hit l; l.t = h.t; l.m = M_NONE; l.n = vec3(0);
        if (slab(o, d, vec3(-0.60, 0.0, -0.28), vec3(0.60, 1.85, 1.15), tn, tf, n) && tn < l.t) {
          easel(o, d, l);
          for (int i = 0; i < 5; i++) canvasBox(o, d, i, l);
        }
        if (slab(o, d, vec3(0.0, 0.0, 1.20), vec3(1.40, 1.00, 2.10), tn, tf, n) && tn < l.t) {
          canvasBox(o, d, 5, l);
          canvasBox(o, d, 6, l);
        }
        artBox(o, d, l);
        tiltedBox(o, d, PALETTE_AT, PALETTE_YAW, PALETTE_LEAN, vec3(-PALETTE_HW, 0.0, 0.0), vec3(PALETTE_HW, PALETTE_H, PALETTE_T), M_PALETTE, l);
        if (slab(o, d, vec3(0.98, 0.0, -0.79), vec3(1.86, 0.05, -0.09), tn, tf, n) && tn < l.t) canvasBox(o, d, CANVAS_N - 1, l);
        if (l.t < h.t) { h.t = l.t; h.n = yawWorldDir(l.n, ART_C, ART_S); h.m = l.m; }
      }

      // The flame, seen directly: not a surface but a glowing teardrop the ray passes through,
      // summed along the part of the ray in front of tMax (whatever the ray hits). Widest a third
      // of the way up, pointed at the tip, dim at the root where a real flame burns blue; its tip
      // sways and it stretches with uFlame.
      float flameGlow(vec3 wo, vec3 wd, float tMax, int i) {
        vec2 yaw = jarYaw(i);
        vec4 pose = uFlame[i];
        vec3 o = jarLocal(wo, i) - vec3(0.0, FLAME_Y, 0.0), d = yawLocalDir(wd, yaw.x, yaw.y);
        float height = FLAME_H * pose.z;
        float reach = FLAME_R + max(abs(pose.x), abs(pose.y));
        float tn, tf; vec3 n;
        if (!slab(o, d, vec3(-reach, 0.0, -reach), vec3(reach, height, reach), tn, tf, n)) return 0.0;
        tn = max(tn, 0.0);
        tf = min(tf, tMax);
        if (tf <= tn) return 0.0;
        const int STEPS = 14;
        float dt = (tf - tn) / float(STEPS);
        float sum = 0.0;
        for (int i = 0; i < STEPS; i++) {
          vec3 p = o + d * (tn + (float(i) + 0.5) * dt);
          float s = p.y / height;
          vec2 axis = pose.xy * s * s;
          float radius = FLAME_R * sqrt(max(s, 0.0)) * pow(max(1.0 - s, 0.0), 0.8) / 0.42;
          float q = length(p.xz - axis) / max(radius, 1e-5);
          float core = pow(clamp(1.0 - q, 0.0, 1.0), 0.7);
          sum += core * smoothstep(0.0, 0.2, s) * (0.55 + 0.45 * (1.0 - s));
        }
        return sum * dt * FLAME_LE;
      }

      // The name: letters cut from thick card, each hung by a wire from a tube. A letter is
      // its glyph extruded LETTER_T deep — the atlas holds the signed distance to the
      // outline, so the extrusion is sphere-traced inside the letter's box and the sides
      // get normals from the field's gradient. Each letter's frame has its origin where the
      // wire meets the tube and carries the letter's own rotation (a twist on the wire and
      // a small pendulum tilt), so wire and letter swing together. The wire ties onto the
      // first ink under the letter's balance point — the top of an o, the shoulder of an h,
      // through the dot of the i to its stem — so the card sits offset from the wire
      // (uLetterSize.zw); a letter open at the top there (the M) hangs from a bridle
      // instead: two legs from the end of the wire to its peaks.
      const float LETTER_T = 0.07;
      const float WIRE_R = 0.008;

      void letters(vec3 o, vec3 d, inout Hit h) {
        float tn, tf; vec3 n;
        if (!slab(o, d, uLetterMin, uLetterMax, tn, tf, n) || tn >= h.t) return;
        vec2 texel = 1.0 / vec2(textureSize(uLetters, 0));
        for (int i = 0; i < LETTER_N; i++) {
          vec4 hang = uLetterHang[i];
          vec4 size = uLetterSize[i];
          vec4 r = uLetterUV[i];
          mat3 rot = uLetterRot[i];
          vec3 lo = (o - hang.xyz) * rot; // v * M is transpose(M) * v: world → letter frame
          vec3 ld = d * rot;
          Hit l; l.t = h.t; l.m = M_NONE; l.n = vec3(0);
          vec4 legs = uLetterLegs[i];
          vec3 tie = vec3(0.0, -hang.w, 0.0);
          cylinder(lo, ld, tie - vec3(0.0, legs.y == 0.0 ? 0.02 : 0.0, 0.0), vec3(0.0), WIRE_R, M_WIRE, l); // the end sits inside the board
          if (legs.y != 0.0) {
            cylinder(lo, ld, tie, vec3(legs.xy, 0.0), WIRE_R, M_WIRE, l);
            cylinder(lo, ld, tie, vec3(legs.zw, 0.0), WIRE_R, M_WIRE, l);
          }
          float hw = size.x, hh = size.y, cx = size.z, top = size.w;
          if (slab(lo, ld, vec3(cx - hw, top - hh, -0.5 * LETTER_T), vec3(cx + hw, top, 0.5 * LETTER_T), tn, tf, n) && tn < l.t) {
            float t = max(tn, 1e-4);
            for (int k = 0; k < 48; k++) {
              vec3 p = lo + ld * t;
              vec2 uv = mix(r.xy, r.zw, vec2(0.5 + 0.5 * (p.x - cx) / hw, (top - p.y) / hh));
              float dxy = textureLod(uLetters, uv, 0.0).r * uLetterScale;
              float dz = abs(p.z) - 0.5 * LETTER_T;
              float dist = max(dxy, dz);
              if (dist < 3e-4) {
                if (t < l.t) {
                  if (dz >= dxy) l.n = vec3(0.0, 0.0, sign(p.z));
                  else {
                    float gx = textureLod(uLetters, uv + vec2(texel.x, 0.0), 0.0).r - textureLod(uLetters, uv - vec2(texel.x, 0.0), 0.0).r;
                    float gy = textureLod(uLetters, uv + vec2(0.0, texel.y), 0.0).r - textureLod(uLetters, uv - vec2(0.0, texel.y), 0.0).r;
                    l.n = normalize(vec3(gx, -gy, 0.0));
                  }
                  l.t = t; l.m = M_LETTER;
                }
                break;
              }
              t += max(dist, 2e-4);
              if (t > tf) break;
            }
          }
          if (l.t < h.t) { h.t = l.t; h.n = rot * l.n; h.m = l.m; }
        }
      }

      const float PIPE_Z0 = 9.3, PIPE_Z1 = 21.6, PIPE_Z2 = 33.1;

      Hit trace(vec3 o, vec3 d) {
        Hit h; h.t = 1e9; h.m = M_NONE; h.n = vec3(0);
        shell(o, d, h);
        // bare stud wall on the right, with plates and two rows of blocking
        repeatedZ(o, d, vec3(HALF_W - STUD_DEPTH, 0.0, FRONT), vec3(HALF_W, H, BACK), STUD_STEP, 0.0, STUD_HALF, M_STUD, h);
        box(o, d, vec3(HALF_W - STUD_DEPTH, 2.05, FRONT), vec3(HALF_W, 2.18, BACK), M_PLATE, h);
        box(o, d, vec3(HALF_W - STUD_DEPTH, 4.15, FRONT), vec3(HALF_W, 4.28, BACK), M_PLATE, h);
        box(o, d, vec3(HALF_W - STUD_DEPTH, 0.0, FRONT), vec3(HALF_W, 0.09, BACK), M_PLATE, h);
        box(o, d, vec3(HALF_W - STUD_DEPTH, H - 0.12, FRONT), vec3(HALF_W, H, BACK), M_PLATE, h);
        // deep beams across the ceiling
        repeatedZ(o, d, vec3(-HALF_W, H - BEAM_DEPTH, FRONT), vec3(HALF_W, H, BACK), BEAM_STEP, BEAM_OFF, BEAM_HALF, M_BEAM, h);
        // conduit pipes running up the left wall
        box(o, d, vec3(-HALF_W, 0.0, PIPE_Z0 - 0.045), vec3(-HALF_W + 0.09, H, PIPE_Z0 + 0.045), M_PIPE, h);
        box(o, d, vec3(-HALF_W, 0.0, PIPE_Z1 - 0.045), vec3(-HALF_W + 0.09, H, PIPE_Z1 + 0.045), M_PIPE, h);
        box(o, d, vec3(-HALF_W, 0.0, PIPE_Z2 - 0.045), vec3(-HALF_W + 0.09, H, PIPE_Z2 + 0.045), M_PIPE, h);
        tubes(o, d, h);
        blackboard(o, d, BOARD_POS, BOARD_C, BOARD_S, M_BOARD, true, h);
        blackboard(o, d, BOARD2_POS, BOARD2_C, BOARD2_S, M_BOARD2, false, h);
        musicTable(o, d, h);
        candleTable(o, d, h);
        sofa(o, d, h);
        workstation(o, d, h);
        artCorner(o, d, h);
        letters(o, d, h);
        return h;
      }

      bool occluded(vec3 o, vec3 d, float maxT) {
        Hit h = trace(o, d);
        return h.m != M_TUBE && h.t < maxT - 1e-3;
      }

      // ---- surfaces ----
      float edgeLine(float v, float width) { return 1.0 - smoothstep(0.0, width, abs(v)); }

      float blob(vec2 q, vec2 c, float s) { vec2 v = q - c; return exp(-dot(v, v) / s); }

      // chalk dust trodden into the floor in front of the board (board-frame xz)
      float chalkDust(vec2 q) {
        float dust = blob(q, vec2(-0.30, -0.30), 0.05) + blob(q, vec2(0.20, -0.22), 0.04)
          + 0.7 * blob(q, vec2(0.58, -0.45), 0.03) + 0.8 * blob(q, vec2(-0.05, -0.12), 0.06)
          + 0.5 * blob(q, vec2(0.90, -0.60), 0.08) + 0.5 * blob(q, vec2(-0.85, -0.55), 0.06)
          + 0.6 * blob(q, vec2(0.15, -1.05), 0.07) + 0.5 * blob(q, vec2(-0.45, -1.60), 0.05)
          + 0.4 * blob(q, vec2(0.40, -2.00), 0.06);
        float grain = smoothstep(0.4, 0.78, fbm(q * 16.0 + 3.0));
        return min(dust, 1.0) * grain * 0.8;
      }

      // A mark of oil paint at c, r across: stretched up to three times along an angle of its own
      // so nothing comes out a neat circle, its edge broken up, with a drip running off one end
      // and a few droplets thrown clear of it. seed makes each one different.
      float splatMask(vec2 q, vec2 c, float r, float seed) {
        float a = 6.2831853 * hash2(vec2(seed, 1.0));
        float cs = cos(a), sn = sin(a);
        vec2 v = q - c;
        v = vec2(cs * v.x + sn * v.y, cs * v.y - sn * v.x); // into the mark's own direction
        float stretch = 1.0 + 2.1 * hash2(vec2(seed, 2.0));
        vec2 u = vec2(v.x / stretch, v.y);
        float edge = r * (0.68 + 0.46 * noise(u / r * 2.1 + seed));
        float m = 1.0 - smoothstep(-0.16 * r, 0.16 * r, length(u) - edge);
        // the drip: a tapering run off the far end of it
        float run = r * (1.5 + 3.0 * hash2(vec2(seed, 5.0)));
        float width = r * 0.32 * pow(max(1.0 - v.x / run, 0.0), 1.6);
        if (v.x > 0.0 && v.x < run) m = max(m, 1.0 - smoothstep(0.55 * width, width, abs(v.y)));
        for (int i = 0; i < 3; i++) {
          float da = 6.2831853 * hash2(vec2(seed + 3.0, float(i)));
          vec2 dc = c + vec2(cos(da), sin(da)) * r * (1.8 + 3.0 * hash2(vec2(seed + 11.0, float(i))));
          float dr = r * (0.09 + 0.17 * hash2(vec2(seed + 7.0, float(i))));
          m = max(m, 1.0 - smoothstep(0.55 * dr, dr, length(q - dc)));
        }
        return m;
      }

      // The paint flicked over the floor round the easel (the corner's frame, dabs from..to of
      // SPLAT) or over the sofa (the sofa's): which colour is on top of that spot, and how much of
      // it covers the surface there. Colour only — none of it is geometry. Dust is trodden into
      // every mark, and the big old smears show the concrete through them.
      vec4 paintOn(vec2 q, int from, int to) {
        vec3 rgb = vec3(0.0);
        float cover = 0.0;
        for (int i = from; i < to; i++) {
          vec4 s = SPLAT[i];
          if (abs(q.x - s.x) > 6.0 * s.z || abs(q.y - s.y) > 6.0 * s.z) continue;
          float m = splatMask(q, s.xy, s.z, float(i) * 1.7 + 0.3);
          if (m <= 0.0) continue;
          rgb = mix(rgb, mix(PAINT[int(s.w)], vec3(0.55), 0.10 + 0.24 * noise(q * 90.0)), m); // a later dab lands on top of an earlier one
          cover = max(cover, m * mix(1.0, 0.40, smoothstep(0.06, 0.18, s.z))); // the wide ones have been walked over for years
        }
        return vec4(rgb, cover);
      }

      float albedo(int m, vec3 p) {
        if (m == M_FLOOR) {
          float a = 0.5;
          a += 0.12 * (fbm(p.xz * 0.18) - 0.5);
          a -= 0.13 * smoothstep(0.52, 0.72, fbm(p.xz * 0.7 + 31.0));
          a -= 0.07 * smoothstep(0.6, 0.8, fbm(p.xz * 3.1 + 7.0));
          a += 0.05 * (noise(p.xz * 45.0) - 0.5);
          vec2 cell = abs(mod(p.xz + vec2(0.0, 3.0), vec2(3.75, 6.0)) - vec2(1.875, 3.0));
          float joint = max(edgeLine(cell.x - 1.875, 0.012), edgeLine(cell.y - 3.0, 0.012));
          a *= 1.0 - 0.45 * joint;
          vec3 q = boardLocal(p);
          if (abs(q.x) < 1.6 && q.z > -2.6 && q.z < 0.6) a = mix(a, 0.9, chalkDust(q.xz));
          return a;
        }
        if (m == M_BOARD || m == M_BOARD2) {
          vec3 q = m == M_BOARD ? boardLocal(p) : board2Local(p);
          if (abs(q.x) > BOARD_HALF_W || q.y < BOARD_Y0 || q.y > BOARD_Y0 + BOARD_H)
            return 0.62 + 0.05 * (noise(q.xy * 30.0) - 0.5); // the rail
          if (q.z > 0.0) return 0.07; // the back
          vec2 uv = vec2((q.x + BOARD_HALF_W) / (2.0 * BOARD_HALF_W), 1.0 - (q.y - BOARD_Y0) / BOARD_H);
          float chalk = m == M_BOARD ? textureLod(uBoard, uv, 0.0).r : textureLod(uBoard2, uv, 0.0).r;
          float slate = 0.075 + 0.03 * (fbm(q.xy * 2.5 + (m == M_BOARD ? 9.0 : 41.0)) - 0.5);
          return mix(slate, 0.9, chalk);
        }
        if (m == M_FRAME) {
          vec3 q = nearestBoardLocal(p);
          float a = 0.6 + 0.04 * (noise(q.xz * 60.0) - 0.5);
          if (q.y > 0.849) a = mix(a, 0.85, 0.5 * smoothstep(0.45, 0.75, fbm(q.xz * 40.0))); // dust in the tray
          return a;
        }
        if (m == M_STAND) return 0.3;
        if (m == M_WHEEL) {
          vec3 q = nearestBoardLocal(p);
          return length(vec2(q.y - WHEEL_R, abs(q.z) - 0.27)) < 0.018 ? 0.45 : 0.05; // hub vs rubber
        }
        if (m == M_CHALK) return 0.9 + 0.06 * (noise(p.xz * 400.0) - 0.5);
        if (m == M_ERASER) return 0.42;
        if (m == M_LETTER) return 0.86 + 0.03 * (noise(p.xy * 90.0) - 0.5);
        if (m == M_WIRE) return 0.75;
        if (m == M_WOOD) {
          // oak boards: grain running along each board, two boards to a panel, darker end grain on
          // the edges. Four crates are made of it: the record player's, the candle's (stood on end,
          // with a shelf), the work station's (taller, two shelves) and the one by the easel.
