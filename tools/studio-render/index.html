<!doctype html>
<!--
  Offline renderer for the studio page's warehouse images.

  A small WebGL2 path tracer: the warehouse is a big box with procedural surfaces, lit
  only by rows of fluorescent tubes (plus a glowing loading door at the far end). A school
  blackboard on casters stands mid-hall with a tagline chalked on it (the writing is drawn
  on a 2D canvas and sampled as a texture) and broken chalk scattered on the floor; the
  name hangs from the tubes; to the right is the music corner (a record player on a
  wooden box, a second board the site writes the top artists on, and a candle burning on a
  crate beside that board). Every frame adds one more light path per pixel; after enough
  frames the noise settles into something photographic, then a film look is applied in JS.
  The hall is black and white; the only colour is the candle (its navy glass, and the warm
  light of its flame, which is kept apart from the tubes' light so post can make it flicker).

  Not part of the site. Run `node tools/studio-render/render.mjs` from the repo root to
  regenerate frontend/src/assets/studio-*. It loads this page with query params w, h
  (pixels), spp (samples per pixel) and row (which row of tubes the name hangs from), waits
  for window.studio, and then asks it for stills, loop frames and walk frames from
  whichever camera it wants (see the bottom of the script). Debug params: ?board, ?letters.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>studio render</title>
    <style>
      /* Michroma (OFL) stands in for the Eurostile Extended of the Endless sleeve */
      @font-face { font-family: 'Michroma'; src: url('Michroma-Regular.ttf'); }
    </style>
  </head>
  <body style="margin: 0; background: #111">
    <canvas id="out"></canvas>
    <script type="x-shader/x-vertex" id="vs">#version 300 es
      in vec2 aPos;
      void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
    </script>
    <script type="x-shader/x-fragment" id="fs">#version 300 es
      precision highp float;
      precision highp int;

      uniform sampler2D uPrev; // the sums so far: light from the tubes and the door (rgb), the flame seen directly (a)
      uniform sampler2D uPrevCandle; // ...and light from the candle (rgb)
      uniform sampler2D uBoard; // chalk on the blackboard, drawn in JS (r: 0 = slate, 1 = chalk)
      uniform sampler2D uLabel; // the gold printing round the candle's glass (r: 0 = glass, 1 = gold)
      uniform vec4 uFlame; // the flame's pose: sway in x and z of its tip (m), height scale
      uniform vec2 uRes;
      uniform int uFrame;
      uniform float uTanY;
      uniform vec3 uCamPos, uCamRight, uCamUp, uCamFwd; // the camera, set per render from JS
      uniform sampler2D uBoard2; // the music board's slate: just the haze of old wiping (the site writes on it live)
      uniform float uSpin; // how far the record has turned (rad)
      // the name, hung letter by letter from a row of tubes; laid out in JS (see hangingLetters)
      const int LETTER_N = 11;
      uniform sampler2D uLetters; // signed distance to each letter's outline, in atlas pixels
      uniform float uLetterScale; // metres per atlas pixel
      uniform vec4 uLetterHang[LETTER_N]; // x, y, z where the wire meets the tube; wire length
      uniform vec4 uLetterSize[LETTER_N]; // half-width, height (m); x of the card's centre and y of its top edge, from the tube point
      uniform vec4 uLetterUV[LETTER_N]; // u0, v0, u1, v1 of the letter in the atlas
      uniform mat3 uLetterRot[LETTER_N]; // letter frame → world: twist on the wire, then pendulum tilt
      uniform vec4 uLetterLegs[LETTER_N]; // a bridle for a letter open at the top (the M): x, y of each leg's end; all 0 when the wire ties straight on
      uniform vec3 uLetterMin, uLetterMax; // box around all the letters and their wires
      layout(location = 0) out vec4 outBase;
      layout(location = 1) out vec4 outCandle;

      const float PI = 3.14159265;

      // ---- the building (metres). The overview camera stands near the front wall at eye
      // height, looking down +z. ----
      const float HALF_W = 8.0;
      const float H = 6.4;
      const float FRONT = -3.0;
      const float BACK = 52.0;

      const int ROWS = 16;
      const int COLS = 4;
      const float ROW0 = 2.5;
      const float ROW_STEP = 3.1;
      const float COL0 = -5.4;
      const float COL_STEP = 3.6;
      const float TUBE_HALF_LEN = 1.4;
      const float TUBE_HALF_W = 0.055;
      const float TUBE_Y = 5.6; // underside of the tubes
      const float TUBE_T = 0.06;
      const float TUBE_LE = 24.0;
      const float TUBE_AREA = 4.0 * TUBE_HALF_LEN * TUBE_HALF_W;

      const float STUD_DEPTH = 0.16;
      const float STUD_STEP = 1.22;
      const float STUD_HALF = 0.035;

      const float BEAM_STEP = 6.0;
      const float BEAM_OFF = 4.0;
      const float BEAM_HALF = 0.16;
      const float BEAM_DEPTH = 0.55;

      const float DOOR_HALF_W = 2.8;
      const float DOOR_H = 4.0;
      const float DOOR_LE = 1.6;

      // sealed concrete: a narrow glossy lobe (Phong exponent) around the mirror direction
      const float GLOSS_N = 300.0;
      const float GLOSS_SPREAD = 0.058; // ≈ 1/sqrt(GLOSS_N) radians

      // ---- the blackboard: a school board on a wheeled stand, parked mid-hall ----
      // Everything about it is described in a local frame (board centred on x = 0 at floor
      // level, writing face towards the camera at -z) and turned into the room by a 10° yaw
      // about y, so it sits a little askew instead of squared up to the walls.
      const vec3 BOARD_POS = vec3(0.1, 0.0, 12.0);
      const float BOARD_C = 0.98480775, BOARD_S = 0.17364818; // cos / sin of the yaw
      const float BOARD_HALF_W = 1.0; // writing surface 2 × 1 m
      const float BOARD_Y0 = 0.88;
      const float BOARD_H = 1.0;
      const float RAIL = 0.05; // aluminium rail around the slate
      const float POST_X = 1.10; // uprights either side
      const float WHEEL_R = 0.035;
      const float CHALK_R = 0.006;

      // ---- the music corner, to the right of that board ----
      // A little wooden box standing 50 cm to the right of the board and 50 cm in front of
      // it, turned to face the room at a diagonal, with a record player on top; and behind
      // it, off to the right so the player does not hide it, a second board of the same kind.
      // The site writes the top artists on that one live, over the render, so its slate only
      // carries old wipe marks (uBoard2).
      const vec3 BOARD2_POS = vec3(3.25, 0.0, 12.55);
      const float BOARD2_C = 0.93969262;
      const float BOARD2_S = 0.34202014; // 20°
      const vec3 TABLE_POS = vec3(1.81, 0.0, 10.98);
      const float TABLE_C = 0.8660254;
      const float TABLE_S = 0.5; // 30°

      // ---- the candle, on a crate of its own on the right of the music board ----
      // A Carby Musk candle (Better World Fragrance House): a navy glass tumbler with its name
      // printed in gold, burning. Its crate is stood on end just in front of the board's right
      // leg, squared up with the board (it shares the board's yaw), at (1.30, -0.50) in the
      // board's frame. Its light is warm and kept in a channel of its own (see main).
      const vec3 CANDLE_TABLE_POS = vec3(4.3006, 0.0, 11.6355);
      const float CRATE_HW = 0.17, CRATE_HD = 0.15, CRATE_H = 0.66, SHELF_Y = 0.3; // half width, half depth, height, the shelf's underside
      const vec2 CANDLE_C = vec2(-0.03, -0.02); // where the jar stands on top (x, z in the crate's frame)
      const float JAR_R = 0.041, JAR_H = 0.11, JAR_T = 0.003, JAR_BASE = 0.016; // outer radius, height, wall, solid glass base
      const float WAX_Y = 0.104; // the wax's surface, up from the bottom of the jar: a new candle, so the flame clears the rim
      const float FLAME_Y = 0.107, FLAME_H = 0.026, FLAME_R = 0.0052; // where the flame starts, how tall and wide it is
      const float FLAME_LE = 6000.0; // the flame's glow per metre of it a ray passes through
      const float LABEL_FACING = -1.63; // the angle round the jar (atan(z, x), crate frame) the printing faces: the close-ups
      const vec3 CANDLE_RGB = vec3(1.0, 0.76, 0.42); // warm yellow
      const float CANDLE_SOFT = 0.7; // m: softens the fall-off of its light close to it
      const float CANDLE_REACH = 9.0; // m: beyond this the candle adds nothing that can be seen

      // broken chalk on the floor around it: x, z, yaw (rad), length — in the board frame
      const int CHALK_N = 27;
      const vec4 CHALK[CHALK_N] = vec4[CHALK_N](
        vec4(-0.32, -0.28, 0.35, 0.045), vec4(-0.26, -0.32, 0.61, 0.028),
        vec4(0.18, -0.22, -1.05, 0.052), vec4(0.55, -0.45, 1.40, 0.034),
        vec4(0.62, -0.41, 0.17, 0.018), vec4(-0.75, -0.55, -0.44, 0.040),
        vec4(0.05, -0.70, 0.87, 0.026), vec4(0.95, -0.15, -0.70, 0.048),
        vec4(-1.10, -0.35, 1.22, 0.022), vec4(0.35, -0.95, -0.26, 0.038),
        vec4(-0.50, -1.10, 0.52, 0.030), vec4(1.25, -0.70, -1.31, 0.044),
        vec4(-0.12, -0.08, 0.09, 0.036), vec4(0.80, 0.25, 0.70, 0.030),
        vec4(-1.35, -0.85, -0.87, 0.025), vec4(0.20, -1.35, 1.13, 0.050),
        vec4(-0.62, -0.62, 0.26, 0.075), vec4(0.42, -0.30, -0.35, 0.078),
        vec4(-0.05, -0.42, 1.25, 0.062), vec4(0.72, -1.15, 0.40, 0.056),
        vec4(-0.90, -1.30, -1.10, 0.048), vec4(0.10, -1.70, 0.65, 0.070),
        vec4(-0.40, -1.95, -0.20, 0.044), vec4(0.60, -2.10, 1.05, 0.036),
        vec4(-1.05, -1.75, 0.30, 0.058), vec4(1.05, -1.45, -0.75, 0.030),
        vec4(0.25, -2.35, -1.25, 0.052)
      );

      const int M_NONE = 0, M_FLOOR = 1, M_CEIL = 2, M_LEFT = 3, M_RIGHT = 4, M_BACK = 5,
        M_FRONT = 6, M_STUD = 7, M_BEAM = 8, M_TUBE = 9, M_PIPE = 10, M_PLATE = 11,
        M_BOARD = 12, M_FRAME = 13, M_STAND = 14, M_WHEEL = 15, M_CHALK = 16, M_ERASER = 17,
        M_LETTER = 18, M_WIRE = 19, M_BOARD2 = 20, M_WOOD = 21, M_SLEEVE = 22, M_PLINTH = 23,
        M_PLATTER = 24, M_RECORD = 25, M_METAL = 26, M_RUBBER = 27, M_GLASS = 28, M_WAX = 29,
        M_BOOK = 30, M_MATCHBOX = 31, M_MATCH = 32;

      struct Hit { float t; vec3 n; int m; };

      // Frames turned about y (cos c, sin s of the yaw) with their origin at pos: the boards and the box
      vec3 yawLocal(vec3 p, vec3 pos, float c, float s) { p -= pos; return vec3(c * p.x - s * p.z, p.y, s * p.x + c * p.z); }
      vec3 yawLocalDir(vec3 d, float c, float s) { return vec3(c * d.x - s * d.z, d.y, s * d.x + c * d.z); }
      vec3 yawWorldDir(vec3 d, float c, float s) { return vec3(c * d.x + s * d.z, d.y, -s * d.x + c * d.z); }
      vec3 boardLocal(vec3 p) { return yawLocal(p, BOARD_POS, BOARD_C, BOARD_S); }
      vec3 board2Local(vec3 p) { return yawLocal(p, BOARD2_POS, BOARD2_C, BOARD2_S); }
      vec3 tableLocal(vec3 p) { return yawLocal(p, TABLE_POS, TABLE_C, TABLE_S); }
      vec3 crateLocal(vec3 p) { return yawLocal(p, CANDLE_TABLE_POS, BOARD2_C, BOARD2_S); }
      // the candle's jar: origin under the middle of its base
      vec3 jarLocal(vec3 p) { return crateLocal(p) - vec3(CANDLE_C.x, CRATE_H, CANDLE_C.y); }
      vec3 jarWorld(vec3 q) { q += vec3(CANDLE_C.x, CRATE_H, CANDLE_C.y); return CANDLE_TABLE_POS + yawWorldDir(q, BOARD2_C, BOARD2_S); }
      // a point on one of the boards' shared parts (rail, tray, stand), in that board's frame
      vec3 nearestBoardLocal(vec3 p) { return distance(p.xz, BOARD_POS.xz) < distance(p.xz, BOARD2_POS.xz) ? boardLocal(p) : board2Local(p); }

      // ---- random numbers & noise ----
      uint rngState;
      uint pcg(uint v) {
        uint s = v * 747796405u + 2891336453u;
        uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u;
        return (w >> 22u) ^ w;
      }
      float rnd() { rngState = pcg(rngState); return float(rngState) / 4294967295.0; }

      float hash2(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }
      float noise(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash2(i), hash2(i + vec2(1, 0)), u.x),
                   mix(hash2(i + vec2(0, 1)), hash2(i + vec2(1, 1)), u.x), u.y);
      }
      float fbm(vec2 p) {
        float v = 0.0, a = 0.5;
        for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + 17.1; a *= 0.5; }
        return v;
      }

      // ---- intersection ----
      vec3 safeDir(vec3 d) { return d + vec3(1e-7) * (1.0 - abs(sign(d))); }

      void shell(vec3 o, vec3 d, inout Hit h) {
        vec3 far = mix(vec3(-HALF_W, 0.0, FRONT), vec3(HALF_W, H, BACK), step(0.0, d));
        vec3 t = (far - o) / d;
        float best = t.x; vec3 n = vec3(-sign(d.x), 0, 0); int m = d.x > 0.0 ? M_RIGHT : M_LEFT;
        if (t.y < best) { best = t.y; n = vec3(0, -sign(d.y), 0); m = d.y > 0.0 ? M_CEIL : M_FLOOR; }
        if (t.z < best) { best = t.z; n = vec3(0, 0, -sign(d.z)); m = d.z > 0.0 ? M_BACK : M_FRONT; }
        if (best > 1e-4 && best < h.t) { h.t = best; h.n = n; h.m = m; }
      }

      bool slab(vec3 o, vec3 d, vec3 bmin, vec3 bmax, out float tn, out float tf, out vec3 n) {
        vec3 t0 = (bmin - o) / d, t1 = (bmax - o) / d;
        vec3 lo = min(t0, t1), hi = max(t0, t1);
        tn = max(max(lo.x, lo.y), lo.z);
        tf = min(min(hi.x, hi.y), hi.z);
        n = tn == lo.x ? vec3(-sign(d.x), 0, 0) : tn == lo.y ? vec3(0, -sign(d.y), 0) : vec3(0, 0, -sign(d.z));
        return tn <= tf && tf > 1e-4;
      }

      void box(vec3 o, vec3 d, vec3 bmin, vec3 bmax, int m, inout Hit h) {
        float tn, tf; vec3 n;
        if (!slab(o, d, bmin, bmax, tn, tf, n) || tn < 1e-4 || tn >= h.t) return;
        h.t = tn; h.n = n; h.m = m;
      }

      // Evenly spaced boards along z inside a region (studs, ceiling beams): O(1) per ray
      void repeatedZ(vec3 o, vec3 d, vec3 bmin, vec3 bmax, float stepZ, float offset, float halfT, int m, inout Hit h) {
        float tn, tf; vec3 n;
        if (!slab(o, d, bmin, bmax, tn, tf, n)) return;
        float ts = max(tn, 1e-4);
        if (ts >= h.t) return;
        float z = o.z + d.z * ts;
        float local = mod(z - offset + 0.5 * stepZ, stepZ) - 0.5 * stepZ;
        float centre = z - local;
        if (abs(local) <= halfT) {
          if (tn > 1e-4) { h.t = tn; h.n = n; h.m = m; }
          return;
        }
        float face;
        if (d.z > 0.0) face = local < 0.0 ? centre - halfT : centre + stepZ - halfT;
        else face = local > 0.0 ? centre + halfT : centre - stepZ + halfT;
        float t = (face - o.z) / d.z;
        if (t > 1e-4 && t <= tf && t < h.t) { h.t = t; h.n = vec3(0, 0, -sign(d.z)); h.m = m; }
      }

      void tubes(vec3 o, vec3 d, inout Hit h) {
        float planeY;
        vec3 n;
        if (o.y < TUBE_Y && d.y > 0.0) { planeY = TUBE_Y; n = vec3(0, -1, 0); }
        else if (o.y > TUBE_Y + TUBE_T && d.y < 0.0) { planeY = TUBE_Y + TUBE_T; n = vec3(0, 1, 0); }
        else return;
        float t = (planeY - o.y) / d.y;
        if (t < 1e-4 || t >= h.t) return;
        vec3 p = o + d * t;
        float c = clamp(floor((p.x - COL0) / COL_STEP + 0.5), 0.0, float(COLS - 1));
        float r = clamp(floor((p.z - ROW0) / ROW_STEP + 0.5), 0.0, float(ROWS - 1));
        if (abs(p.x - (COL0 + c * COL_STEP)) > TUBE_HALF_LEN) return;
        if (abs(p.z - (ROW0 + r * ROW_STEP)) > TUBE_HALF_W) return;
        h.t = t; h.n = n; h.m = M_TUBE;
      }

      // Capped cylinder from a to b (after Inigo Quilez): wheels and sticks of chalk.
      void cylinder(vec3 o, vec3 d, vec3 a, vec3 b, float r, int m, inout Hit h) {
        vec3 ca = b - a, oc = o - a;
        float caca = dot(ca, ca), card = dot(ca, d), caoc = dot(ca, oc);
        float qa = caca - card * card;
        if (qa < 1e-9) return; // running along the axis
        float qb = caca * dot(oc, d) - caoc * card;
        float qc = caca * dot(oc, oc) - caoc * caoc - r * r * caca;
        float disc = qb * qb - qa * qc;
        if (disc < 0.0) return;
        disc = sqrt(disc);
        float t = (-qb - disc) / qa;
        float y = caoc + t * card;
        vec3 n;
        if (y > 0.0 && y < caca) n = (oc + t * d - ca * y / caca) / r;
        else {
          t = ((y < 0.0 ? 0.0 : caca) - caoc) / card;
          if (abs(qb + qa * t) >= disc) return;
          n = normalize(ca) * sign(y);
        }
        if (t <= 1e-4 || t >= h.t) return;
        h.t = t; h.n = n; h.m = m;
      }

      // A blackboard (at pos, turned by the yaw with cosine c and sine s) and, if litter is
      // set, the broken chalk dropped around it. Rays are moved into the board's frame first,
      // so the parts can all be axis-aligned boxes; one bounding box keeps the cost away from
      // rays that never come near it. slate is the material of the writing surface, which
      // decides which chalk texture it shows.
      void blackboard(vec3 wo, vec3 wd, vec3 pos, float c, float s, int slate, bool litter, inout Hit h) {
        vec3 o = yawLocal(wo, pos, c, s), d = yawLocalDir(wd, c, s);
        float tn, tf; vec3 n;
        if (!slab(o, d, litter ? vec3(-1.6, 0.0, -2.5) : vec3(-1.2, 0.0, -0.35), litter ? vec3(1.5, 2.0, 0.5) : vec3(1.2, 2.0, 0.35), tn, tf, n) || tn >= h.t) return;
        Hit l; l.t = h.t; l.m = M_NONE; l.n = vec3(0);
        // slate in its rail, the chalk tray along the bottom, and what's been left on it
        box(o, d, vec3(-BOARD_HALF_W - RAIL, BOARD_Y0 - RAIL, -0.015), vec3(BOARD_HALF_W + RAIL, BOARD_Y0 + BOARD_H + RAIL, 0.015), slate, l);
        box(o, d, vec3(-0.9, 0.83, -0.09), vec3(0.9, 0.85, -0.015), M_FRAME, l);
        box(o, d, vec3(-0.9, 0.83, -0.09), vec3(0.9, 0.87, -0.078), M_FRAME, l);
        box(o, d, vec3(0.30, 0.85, -0.08), vec3(0.43, 0.885, -0.03), M_ERASER, l);
        cylinder(o, d, vec3(-0.55, 0.856, -0.055), vec3(-0.48, 0.856, -0.055), CHALK_R, M_CHALK, l);
        cylinder(o, d, vec3(-0.30, 0.856, -0.045), vec3(-0.27, 0.856, -0.05), CHALK_R, M_CHALK, l);
        cylinder(o, d, vec3(0.62, 0.856, -0.06), vec3(0.67, 0.856, -0.035), CHALK_R, M_CHALK, l);
        // the stand: two uprights on feet, a crossbar, a caster at each corner
        for (int s = -1; s <= 1; s += 2) {
          float x = float(s) * POST_X;
          box(o, d, vec3(x - 0.02, 0.10, -0.02), vec3(x + 0.02, 1.98, 0.02), M_STAND, l);
          box(o, d, vec3(x - 0.02, 0.06, -0.32), vec3(x + 0.02, 0.10, 0.32), M_STAND, l);
          float bx0 = float(s) * (BOARD_HALF_W + RAIL), bx1 = float(s) * (POST_X - 0.02);
          box(o, d, vec3(min(bx0, bx1), 1.36, -0.015), vec3(max(bx0, bx1), 1.40, 0.015), M_STAND, l);
          for (int e = -1; e <= 1; e += 2) {
            float z = float(e) * 0.27;
            box(o, d, vec3(x - 0.016, 0.03, z - 0.02), vec3(x + 0.016, 0.06, z + 0.02), M_STAND, l);
            cylinder(o, d, vec3(x - 0.013, WHEEL_R, z), vec3(x + 0.013, WHEEL_R, z), WHEEL_R, M_WHEEL, l);
          }
        }
        box(o, d, vec3(-POST_X, 0.28, -0.02), vec3(POST_X, 0.32, 0.02), M_STAND, l);
        // broken chalk on the floor
        if (litter && slab(o, d, vec3(-1.5, 0.0, -2.45), vec3(1.4, 2.0 * CHALK_R, 0.4), tn, tf, n) && tn < l.t) {
          for (int i = 0; i < CHALK_N; i++) {
            vec4 piece = CHALK[i];
            vec3 arm = vec3(cos(piece.z), 0.0, sin(piece.z)) * (0.5 * piece.w);
            vec3 mid = vec3(piece.x, CHALK_R, piece.y);
            cylinder(o, d, mid - arm, mid + arm, CHALK_R, M_CHALK, l);
          }
        }
        if (l.t < h.t) { h.t = l.t; h.n = yawWorldDir(l.n, c, s); h.m = l.m; }
      }

      // The record player on its box, all in the box's frame: origin in the middle of its
      // footprint on the floor, the open side of the box and the front of the player at -z.
      // The box is a plywood crate on its side with records filed spine-out inside; the
      // player is a plinth on four feet, a platter with a record (turned by uSpin) and a
      // tonearm resting in the grooves.
      const float BOX_HW = 0.26, BOX_HD = 0.21, BOX_H = 0.5, BOX_T = 0.018; // half width, half depth, height, plank
      const float PLINTH_Y0 = 0.52, PLINTH_Y1 = 0.6;
      const vec2 REC_C = vec2(-0.04, 0.0); // centre of the record (x, z)
      const float REC_R = 0.1505, REC_Y = 0.628, LABEL_R = 0.05;
      const vec3 ARM_PIVOT = vec3(0.17, 0.66, 0.11);
      const vec3 ARM_HEAD = vec3(-0.015, 0.646, -0.085);
      const float SLEEVE_LEAN = 0.42; // rad, the last record in the box leans over

      void musicTable(vec3 wo, vec3 wd, inout Hit h) {
        vec3 o = tableLocal(wo), d = yawLocalDir(wd, TABLE_C, TABLE_S);
        float tn, tf; vec3 n;
        if (!slab(o, d, vec3(-0.3, 0.0, -0.25), vec3(0.3, 0.7, 0.25), tn, tf, n) || tn >= h.t) return;
        Hit l; l.t = h.t; l.m = M_NONE; l.n = vec3(0);
        // the crate: top, bottom, sides and back; open to the front
        box(o, d, vec3(-BOX_HW, BOX_H - BOX_T, -BOX_HD), vec3(BOX_HW, BOX_H, BOX_HD), M_WOOD, l);
        box(o, d, vec3(-BOX_HW, 0.0, -BOX_HD), vec3(BOX_HW, BOX_T, BOX_HD), M_WOOD, l);
        box(o, d, vec3(-BOX_HW, BOX_T, -BOX_HD), vec3(-BOX_HW + BOX_T, BOX_H - BOX_T, BOX_HD), M_WOOD, l);
        box(o, d, vec3(BOX_HW - BOX_T, BOX_T, -BOX_HD), vec3(BOX_HW, BOX_H - BOX_T, BOX_HD), M_WOOD, l);
        box(o, d, vec3(-BOX_HW + BOX_T, BOX_T, BOX_HD - BOX_T), vec3(BOX_HW - BOX_T, BOX_H - BOX_T, BOX_HD), M_WOOD, l);
        // records filed inside (one block, the spines drawn in albedo), the last one leaning over
        box(o, d, vec3(-BOX_HW + BOX_T, BOX_T, -BOX_HD + 0.07), vec3(0.05, BOX_T + 0.316, BOX_HD - BOX_T), M_SLEEVE, l);
        {
          vec3 pivot = vec3(0.052, BOX_T, 0.0);
          float cs = cos(SLEEVE_LEAN), sn = sin(SLEEVE_LEAN);
          vec3 ro = o - pivot, rd = d;
          ro.xy = vec2(cs * ro.x - sn * ro.y, sn * ro.x + cs * ro.y); // into the leaning sleeve's frame
          rd.xy = vec2(cs * rd.x - sn * rd.y, sn * rd.x + cs * rd.y);
          Hit s; s.t = l.t; s.m = M_NONE; s.n = vec3(0);
          box(ro, rd, vec3(0.0, 0.0, -BOX_HD + 0.075), vec3(0.004, 0.316, BOX_HD - BOX_T - 0.005), M_SLEEVE, s);
          if (s.t < l.t) { l.t = s.t; l.m = s.m; l.n = vec3(cs * s.n.x + sn * s.n.y, -sn * s.n.x + cs * s.n.y, s.n.z); }
        }
        // the player
        for (int i = 0; i < 4; i++) {
          vec2 f = vec2(i < 2 ? -0.19 : 0.19, i % 2 == 0 ? -0.14 : 0.14);
          cylinder(o, d, vec3(f.x, BOX_H, f.y), vec3(f.x, PLINTH_Y0, f.y), 0.024, M_RUBBER, l);
        }
        box(o, d, vec3(-0.225, PLINTH_Y0, -0.175), vec3(0.225, PLINTH_Y1, 0.175), M_PLINTH, l);
        cylinder(o, d, vec3(REC_C.x, PLINTH_Y1, REC_C.y), vec3(REC_C.x, 0.625, REC_C.y), 0.148, M_PLATTER, l);
        cylinder(o, d, vec3(REC_C.x, 0.624, REC_C.y), vec3(REC_C.x, REC_Y, REC_C.y), REC_R, M_RECORD, l);
        cylinder(o, d, vec3(REC_C.x, REC_Y - 0.001, REC_C.y), vec3(REC_C.x, REC_Y + 0.013, REC_C.y), 0.0035, M_METAL, l);
        // tonearm: its base, the tube, the counterweight behind the pivot, the headshell and
        // the cartridge down in the grooves, and an empty arm rest
        vec3 along = normalize(ARM_HEAD - ARM_PIVOT);
        cylinder(o, d, vec3(ARM_PIVOT.x, PLINTH_Y1, ARM_PIVOT.z), vec3(ARM_PIVOT.x, ARM_PIVOT.y + 0.006, ARM_PIVOT.z), 0.026, M_METAL, l);
        cylinder(o, d, ARM_PIVOT, ARM_HEAD, 0.0045, M_METAL, l);
        cylinder(o, d, ARM_PIVOT - along * 0.03, ARM_PIVOT - along * 0.068, 0.018, M_METAL, l);
        cylinder(o, d, ARM_HEAD - along * 0.004, ARM_HEAD + along * 0.03, 0.009, M_METAL, l);
        vec3 stylus = ARM_HEAD + along * 0.018;
        cylinder(o, d, vec3(stylus.x, REC_Y + 0.002, stylus.z), vec3(stylus.x, ARM_HEAD.y, stylus.z), 0.007, M_PLINTH, l);
        cylinder(o, d, vec3(0.2, PLINTH_Y1, -0.07), vec3(0.2, 0.642, -0.07), 0.005, M_METAL, l);
        // start button and speed selector at the front left
        cylinder(o, d, vec3(-0.19, PLINTH_Y1, -0.145), vec3(-0.19, PLINTH_Y1 + 0.007, -0.145), 0.014, M_METAL, l);
        cylinder(o, d, vec3(-0.15, PLINTH_Y1, -0.15), vec3(-0.15, PLINTH_Y1 + 0.005, -0.15), 0.008, M_METAL, l);
        if (l.t < h.t) { h.t = l.t; h.n = yawWorldDir(l.n, TABLE_C, TABLE_S); h.m = l.m; }
      }

      // the top of the record outside its label: vinyl, which gets a glossy reflection
      bool vinyl(vec3 p, vec3 n) {
        if (n.y < 0.5) return false;
        vec3 q = tableLocal(p);
        return q.y > REC_Y - 5e-4 && length(q.xz - REC_C) > LABEL_R;
      }

      // The candle's tumbler, in the jar's frame: a glass cylinder open at the top with wax
      // inside up to WAX_Y. The navy glass is treated as opaque (too dark to see into), so only
      // what shows from outside is modelled: the outer wall, the rim, and through the opening
      // the inside of the wall above the wax, and the wax.
      void jar(vec3 o, vec3 d, inout Hit h) {
        float a = dot(d.xz, d.xz);
        float ri = JAR_R - JAR_T;
        if (a > 1e-12) {
          float b = dot(o.xz, d.xz);
          float disc = b * b - a * (dot(o.xz, o.xz) - JAR_R * JAR_R);
          if (disc < 0.0) return; // nowhere near it
          float t = (-b - sqrt(disc)) / a; // the outer wall, from outside
          float y = o.y + d.y * t;
          if (t > 1e-4 && t < h.t && y > 0.0 && y < JAR_H) { h.t = t; h.n = vec3((o.xz + d.xz * t) / JAR_R, 0.0).xzy; h.m = M_GLASS; }
          disc = b * b - a * (dot(o.xz, o.xz) - ri * ri);
          if (disc > 0.0) {
            t = (-b + sqrt(disc)) / a; // the inner wall, from inside (anything else would have met the outer wall first)
            y = o.y + d.y * t;
            if (t > 1e-4 && t < h.t && y > WAX_Y && y < JAR_H) { h.t = t; h.n = -vec3((o.xz + d.xz * t) / ri, 0.0).xzy; h.m = M_GLASS; }
          }
        }
        if (d.y < 0.0) {
          float t = (JAR_H - o.y) / d.y; // the rim
          vec2 q = o.xz + d.xz * t;
          float r2 = dot(q, q);
          if (t > 1e-4 && t < h.t && r2 < JAR_R * JAR_R && r2 > ri * ri) { h.t = t; h.n = vec3(0, 1, 0); h.m = M_GLASS; }
          t = (WAX_Y - o.y) / d.y; // the wax
          q = o.xz + d.xz * t;
          if (t > 1e-4 && t < h.t && dot(q, q) < ri * ri) { h.t = t; h.n = vec3(0, 1, 0); h.m = M_WAX; }
        }
      }

      // The crate the candle stands on, in its frame (origin in the middle of its footprint,
      // open side at -z): a plywood crate like the record player's, stood on end, with a shelf
      // and a few books lying in the bottom; on top the jar, a box of matches and a spent match.
      void candleTable(vec3 wo, vec3 wd, inout Hit h) {
        vec3 o = crateLocal(wo), d = yawLocalDir(wd, BOARD2_C, BOARD2_S);
        float tn, tf; vec3 n;
        if (!slab(o, d, vec3(-CRATE_HW - 0.01, 0.0, -CRATE_HD - 0.01), vec3(CRATE_HW + 0.01, CRATE_H + JAR_H + 0.04, CRATE_HD + 0.01), tn, tf, n) || tn >= h.t) return;
        Hit l; l.t = h.t; l.m = M_NONE; l.n = vec3(0);
        box(o, d, vec3(-CRATE_HW, CRATE_H - BOX_T, -CRATE_HD), vec3(CRATE_HW, CRATE_H, CRATE_HD), M_WOOD, l);
        box(o, d, vec3(-CRATE_HW, 0.0, -CRATE_HD), vec3(CRATE_HW, BOX_T, CRATE_HD), M_WOOD, l);
        box(o, d, vec3(-CRATE_HW, BOX_T, -CRATE_HD), vec3(-CRATE_HW + BOX_T, CRATE_H - BOX_T, CRATE_HD), M_WOOD, l);
        box(o, d, vec3(CRATE_HW - BOX_T, BOX_T, -CRATE_HD), vec3(CRATE_HW, CRATE_H - BOX_T, CRATE_HD), M_WOOD, l);
        box(o, d, vec3(-CRATE_HW + BOX_T, BOX_T, CRATE_HD - BOX_T), vec3(CRATE_HW - BOX_T, CRATE_H - BOX_T, CRATE_HD), M_WOOD, l);
        box(o, d, vec3(-CRATE_HW + BOX_T, SHELF_Y, -CRATE_HD + 0.01), vec3(CRATE_HW - BOX_T, SHELF_Y + BOX_T, CRATE_HD - BOX_T), M_WOOD, l);
        // books lying flat on the bottom, spines out, not quite squared up
        box(o, d, vec3(-0.135, BOX_T, -0.125), vec3(0.12, BOX_T + 0.034, 0.11), M_BOOK, l);
        box(o, d, vec3(-0.125, BOX_T + 0.034, -0.118), vec3(0.105, BOX_T + 0.058, 0.1), M_BOOK, l);
        box(o, d, vec3(-0.14, BOX_T + 0.058, -0.13), vec3(0.128, BOX_T + 0.079, 0.115), M_BOOK, l);
        // on top: the jar, a box of matches (turned a little) and a spent match
        {
          vec3 jo = o - vec3(CANDLE_C.x, CRATE_H, CANDLE_C.y);
          Hit j; j.t = l.t; j.m = M_NONE; j.n = vec3(0);
          jar(jo, d, j);
          cylinder(jo, d, vec3(0.0, WAX_Y - 0.002, 0.0), vec3(0.0006, FLAME_Y + 0.002, 0.0003), 0.0009, M_RUBBER, j); // the wick, charred black
          if (j.t < l.t) l = j;
        }
        {
          vec3 pivot = vec3(0.095, CRATE_H, 0.06);
          float cs = cos(0.42), sn = sin(0.42);
          vec3 ro = o - pivot, rd = d;
          ro.xz = vec2(cs * ro.x - sn * ro.z, sn * ro.x + cs * ro.z);
          rd.xz = vec2(cs * rd.x - sn * rd.z, sn * rd.x + cs * rd.z);
          Hit s; s.t = l.t; s.m = M_NONE; s.n = vec3(0);
          box(ro, rd, vec3(-0.027, 0.0, -0.018), vec3(0.027, 0.014, 0.018), M_MATCHBOX, s);
          if (s.t < l.t) { l.t = s.t; l.m = s.m; l.n = vec3(cs * s.n.x + sn * s.n.z, s.n.y, -sn * s.n.x + cs * s.n.z); }
        }
        cylinder(o, d, vec3(0.03, CRATE_H + 0.0012, -0.075), vec3(0.074, CRATE_H + 0.0012, -0.09), 0.0012, M_MATCH, l);
        if (l.t < h.t) { h.t = l.t; h.n = yawWorldDir(l.n, BOARD2_C, BOARD2_S); h.m = l.m; }
      }

      // The flame, seen directly: not a surface but a glowing teardrop the ray passes through,
      // summed along the part of the ray in front of tMax (whatever the ray hits). Widest a third
      // of the way up, pointed at the tip, dim at the root where a real flame burns blue; its tip
      // sways and it stretches with uFlame.
      float flameGlow(vec3 wo, vec3 wd, float tMax) {
        vec3 o = jarLocal(wo) - vec3(0.0, FLAME_Y, 0.0), d = yawLocalDir(wd, BOARD2_C, BOARD2_S);
        float height = FLAME_H * uFlame.z;
        float reach = FLAME_R + max(abs(uFlame.x), abs(uFlame.y));
        float tn, tf; vec3 n;
        if (!slab(o, d, vec3(-reach, 0.0, -reach), vec3(reach, height, reach), tn, tf, n)) return 0.0;
        tn = max(tn, 0.0);
        tf = min(tf, tMax);
        if (tf <= tn) return 0.0;
        const int STEPS = 14;
        float dt = (tf - tn) / float(STEPS);
        float sum = 0.0;
        for (int i = 0; i < STEPS; i++) {
          vec3 p = o + d * (tn + (float(i) + 0.5) * dt);
          float s = p.y / height;
          vec2 axis = uFlame.xy * s * s;
          float radius = FLAME_R * sqrt(max(s, 0.0)) * pow(max(1.0 - s, 0.0), 0.8) / 0.42;
          float q = length(p.xz - axis) / max(radius, 1e-5);
          float core = pow(clamp(1.0 - q, 0.0, 1.0), 0.7);
          sum += core * smoothstep(0.0, 0.2, s) * (0.55 + 0.45 * (1.0 - s));
        }
        return sum * dt * FLAME_LE;
      }

      // The name: letters cut from thick card, each hung by a wire from a tube. A letter is
      // its glyph extruded LETTER_T deep — the atlas holds the signed distance to the
      // outline, so the extrusion is sphere-traced inside the letter's box and the sides
      // get normals from the field's gradient. Each letter's frame has its origin where the
      // wire meets the tube and carries the letter's own rotation (a twist on the wire and
      // a small pendulum tilt), so wire and letter swing together. The wire ties onto the
      // first ink under the letter's balance point — the top of an o, the shoulder of an h,
      // through the dot of the i to its stem — so the card sits offset from the wire
      // (uLetterSize.zw); a letter open at the top there (the M) hangs from a bridle
      // instead: two legs from the end of the wire to its peaks.
      const float LETTER_T = 0.07;
      const float WIRE_R = 0.008;

      void letters(vec3 o, vec3 d, inout Hit h) {
        float tn, tf; vec3 n;
        if (!slab(o, d, uLetterMin, uLetterMax, tn, tf, n) || tn >= h.t) return;
        vec2 texel = 1.0 / vec2(textureSize(uLetters, 0));
        for (int i = 0; i < LETTER_N; i++) {
          vec4 hang = uLetterHang[i];
          vec4 size = uLetterSize[i];
          vec4 r = uLetterUV[i];
          mat3 rot = uLetterRot[i];
          vec3 lo = (o - hang.xyz) * rot; // v * M is transpose(M) * v: world → letter frame
          vec3 ld = d * rot;
          Hit l; l.t = h.t; l.m = M_NONE; l.n = vec3(0);
          vec4 legs = uLetterLegs[i];
          vec3 tie = vec3(0.0, -hang.w, 0.0);
          cylinder(lo, ld, tie - vec3(0.0, legs.y == 0.0 ? 0.02 : 0.0, 0.0), vec3(0.0), WIRE_R, M_WIRE, l); // the end sits inside the board
          if (legs.y != 0.0) {
            cylinder(lo, ld, tie, vec3(legs.xy, 0.0), WIRE_R, M_WIRE, l);
            cylinder(lo, ld, tie, vec3(legs.zw, 0.0), WIRE_R, M_WIRE, l);
          }
          float hw = size.x, hh = size.y, cx = size.z, top = size.w;
          if (slab(lo, ld, vec3(cx - hw, top - hh, -0.5 * LETTER_T), vec3(cx + hw, top, 0.5 * LETTER_T), tn, tf, n) && tn < l.t) {
            float t = max(tn, 1e-4);
            for (int k = 0; k < 48; k++) {
              vec3 p = lo + ld * t;
              vec2 uv = mix(r.xy, r.zw, vec2(0.5 + 0.5 * (p.x - cx) / hw, (top - p.y) / hh));
              float dxy = textureLod(uLetters, uv, 0.0).r * uLetterScale;
              float dz = abs(p.z) - 0.5 * LETTER_T;
              float dist = max(dxy, dz);
              if (dist < 3e-4) {
                if (t < l.t) {
                  if (dz >= dxy) l.n = vec3(0.0, 0.0, sign(p.z));
                  else {
                    float gx = textureLod(uLetters, uv + vec2(texel.x, 0.0), 0.0).r - textureLod(uLetters, uv - vec2(texel.x, 0.0), 0.0).r;
                    float gy = textureLod(uLetters, uv + vec2(0.0, texel.y), 0.0).r - textureLod(uLetters, uv - vec2(0.0, texel.y), 0.0).r;
                    l.n = normalize(vec3(gx, -gy, 0.0));
                  }
                  l.t = t; l.m = M_LETTER;
                }
                break;
              }
              t += max(dist, 2e-4);
              if (t > tf) break;
            }
          }
          if (l.t < h.t) { h.t = l.t; h.n = rot * l.n; h.m = l.m; }
        }
      }

      const float PIPE_Z0 = 9.3, PIPE_Z1 = 21.6, PIPE_Z2 = 33.1;

      Hit trace(vec3 o, vec3 d) {
        Hit h; h.t = 1e9; h.m = M_NONE; h.n = vec3(0);
        shell(o, d, h);
        // bare stud wall on the right, with plates and two rows of blocking
        repeatedZ(o, d, vec3(HALF_W - STUD_DEPTH, 0.0, FRONT), vec3(HALF_W, H, BACK), STUD_STEP, 0.0, STUD_HALF, M_STUD, h);
        box(o, d, vec3(HALF_W - STUD_DEPTH, 2.05, FRONT), vec3(HALF_W, 2.18, BACK), M_PLATE, h);
        box(o, d, vec3(HALF_W - STUD_DEPTH, 4.15, FRONT), vec3(HALF_W, 4.28, BACK), M_PLATE, h);
        box(o, d, vec3(HALF_W - STUD_DEPTH, 0.0, FRONT), vec3(HALF_W, 0.09, BACK), M_PLATE, h);
        box(o, d, vec3(HALF_W - STUD_DEPTH, H - 0.12, FRONT), vec3(HALF_W, H, BACK), M_PLATE, h);
        // deep beams across the ceiling
        repeatedZ(o, d, vec3(-HALF_W, H - BEAM_DEPTH, FRONT), vec3(HALF_W, H, BACK), BEAM_STEP, BEAM_OFF, BEAM_HALF, M_BEAM, h);
        // conduit pipes running up the left wall
        box(o, d, vec3(-HALF_W, 0.0, PIPE_Z0 - 0.045), vec3(-HALF_W + 0.09, H, PIPE_Z0 + 0.045), M_PIPE, h);
        box(o, d, vec3(-HALF_W, 0.0, PIPE_Z1 - 0.045), vec3(-HALF_W + 0.09, H, PIPE_Z1 + 0.045), M_PIPE, h);
        box(o, d, vec3(-HALF_W, 0.0, PIPE_Z2 - 0.045), vec3(-HALF_W + 0.09, H, PIPE_Z2 + 0.045), M_PIPE, h);
        tubes(o, d, h);
        blackboard(o, d, BOARD_POS, BOARD_C, BOARD_S, M_BOARD, true, h);
        blackboard(o, d, BOARD2_POS, BOARD2_C, BOARD2_S, M_BOARD2, false, h);
        musicTable(o, d, h);
        candleTable(o, d, h);
        letters(o, d, h);
        return h;
      }

      bool occluded(vec3 o, vec3 d, float maxT) {
        Hit h = trace(o, d);
        return h.m != M_TUBE && h.t < maxT - 1e-3;
      }

      // ---- surfaces ----
      float edgeLine(float v, float width) { return 1.0 - smoothstep(0.0, width, abs(v)); }

      float blob(vec2 q, vec2 c, float s) { vec2 v = q - c; return exp(-dot(v, v) / s); }

      // chalk dust trodden into the floor in front of the board (board-frame xz)
      float chalkDust(vec2 q) {
        float dust = blob(q, vec2(-0.30, -0.30), 0.05) + blob(q, vec2(0.20, -0.22), 0.04)
          + 0.7 * blob(q, vec2(0.58, -0.45), 0.03) + 0.8 * blob(q, vec2(-0.05, -0.12), 0.06)
          + 0.5 * blob(q, vec2(0.90, -0.60), 0.08) + 0.5 * blob(q, vec2(-0.85, -0.55), 0.06)
          + 0.6 * blob(q, vec2(0.15, -1.05), 0.07) + 0.5 * blob(q, vec2(-0.45, -1.60), 0.05)
          + 0.4 * blob(q, vec2(0.40, -2.00), 0.06);
        float grain = smoothstep(0.4, 0.78, fbm(q * 16.0 + 3.0));
        return min(dust, 1.0) * grain * 0.8;
      }

      float albedo(int m, vec3 p) {
        if (m == M_FLOOR) {
          float a = 0.5;
          a += 0.12 * (fbm(p.xz * 0.18) - 0.5);
          a -= 0.13 * smoothstep(0.52, 0.72, fbm(p.xz * 0.7 + 31.0));
          a -= 0.07 * smoothstep(0.6, 0.8, fbm(p.xz * 3.1 + 7.0));
          a += 0.05 * (noise(p.xz * 45.0) - 0.5);
          vec2 cell = abs(mod(p.xz + vec2(0.0, 3.0), vec2(3.75, 6.0)) - vec2(1.875, 3.0));
          float joint = max(edgeLine(cell.x - 1.875, 0.012), edgeLine(cell.y - 3.0, 0.012));
          a *= 1.0 - 0.45 * joint;
          vec3 q = boardLocal(p);
          if (abs(q.x) < 1.6 && q.z > -2.6 && q.z < 0.6) a = mix(a, 0.9, chalkDust(q.xz));
          return a;
        }
        if (m == M_BOARD || m == M_BOARD2) {
          vec3 q = m == M_BOARD ? boardLocal(p) : board2Local(p);
          if (abs(q.x) > BOARD_HALF_W || q.y < BOARD_Y0 || q.y > BOARD_Y0 + BOARD_H)
            return 0.62 + 0.05 * (noise(q.xy * 30.0) - 0.5); // the rail
          if (q.z > 0.0) return 0.07; // the back
          vec2 uv = vec2((q.x + BOARD_HALF_W) / (2.0 * BOARD_HALF_W), 1.0 - (q.y - BOARD_Y0) / BOARD_H);
          float chalk = m == M_BOARD ? textureLod(uBoard, uv, 0.0).r : textureLod(uBoard2, uv, 0.0).r;
          float slate = 0.075 + 0.03 * (fbm(q.xy * 2.5 + (m == M_BOARD ? 9.0 : 41.0)) - 0.5);
          return mix(slate, 0.9, chalk);
        }
        if (m == M_FRAME) {
          vec3 q = nearestBoardLocal(p);
          float a = 0.6 + 0.04 * (noise(q.xz * 60.0) - 0.5);
          if (q.y > 0.849) a = mix(a, 0.85, 0.5 * smoothstep(0.45, 0.75, fbm(q.xz * 40.0))); // dust in the tray
          return a;
        }
        if (m == M_STAND) return 0.3;
        if (m == M_WHEEL) {
          vec3 q = nearestBoardLocal(p);
          return length(vec2(q.y - WHEEL_R, abs(q.z) - 0.27)) < 0.018 ? 0.45 : 0.05; // hub vs rubber
        }
        if (m == M_CHALK) return 0.9 + 0.06 * (noise(p.xz * 400.0) - 0.5);
        if (m == M_ERASER) return 0.42;
        if (m == M_LETTER) return 0.86 + 0.03 * (noise(p.xy * 90.0) - 0.5);
        if (m == M_WIRE) return 0.75;
        if (m == M_WOOD) {
          // pine boards: grain running along each board, two boards to a panel, darker end grain on
          // the edges. Two crates are made of it: the record player's and the candle's (stood on
          // end, with a shelf).
          bool candle = distance(p.xz, CANDLE_TABLE_POS.xz) < distance(p.xz, TABLE_POS.xz);
          vec3 q = candle ? crateLocal(p) : tableLocal(p);
          vec3 size = candle ? vec3(CRATE_HW, CRATE_H, CRATE_HD) : vec3(BOX_HW, BOX_H, BOX_HD); // half width, height, half depth
          bool shelf = candle && q.y > SHELF_Y - 1e-3 && q.y < SHELF_Y + BOX_T + 1e-3 && abs(q.x) < size.x - BOX_T + 1e-3;
          bool lying = shelf || q.y > size.y - BOX_T - 1e-3 || q.y < BOX_T + 1e-3; // top or bottom
          bool side = !lying && abs(q.x) > size.x - BOX_T - 1e-3;
          vec2 g = (lying ? q.xz : side ? q.zy : q.xy) + (candle ? 13.0 : 0.0); // along the board, across it
          float a = 0.47 + 0.17 * (fbm(vec2(g.x * 2.5, g.y * 38.0 + fbm(g * 6.0) * 2.0)) - 0.5);
          a += 0.07 * (noise(vec2(g.x * 5.0, g.y * 160.0)) - 0.5);
          a *= 1.0 - 0.45 * edgeLine((lying ? q.z : q.y - 0.5 * size.y), 0.0025); // the joint between the two boards
          float inset = min(min(size.x - abs(q.x), size.z - abs(q.z)), min(q.y, size.y - q.y));
          if (shelf) inset = min(size.z - abs(q.z), min(q.y - SHELF_Y, SHELF_Y + BOX_T - q.y));
          a *= 1.0 - 0.3 * (1.0 - smoothstep(0.0, 0.004, inset));
          return a;
        }
        if (m == M_BOOK) {
          // three hardbacks lying flat, spines out: dark cloth, a paler one, a mid one, with the
          // page edges showing pale between the boards at the ends
          vec3 q = crateLocal(p);
          float y = q.y - BOX_T;
          float lo = y < 0.034 ? 0.0 : y < 0.058 ? 0.034 : 0.058, hi = y < 0.034 ? 0.034 : y < 0.058 ? 0.058 : 0.079;
          float cloth = y < 0.034 ? 0.12 : y < 0.058 ? 0.55 : 0.3;
          bool pageEdge = abs(q.x) > 0.1 && min(y - lo, hi - y) > 0.003;
          return (pageEdge ? 0.8 : cloth) + 0.03 * (noise(q.xz * 300.0 + y * 90.0) - 0.5);
        }
        if (m == M_MATCHBOX) {
          vec3 q = crateLocal(p);
          return q.y > CRATE_H + 0.0135 ? 0.72 + 0.04 * (noise(q.xz * 500.0) - 0.5) : 0.16; // printed paper top, brown striking sides
        }
        if (m == M_MATCH) {
          vec3 q = crateLocal(p);
          return length(q.xz - vec2(0.074, -0.09)) < 0.006 ? 0.04 : 0.62; // burnt head
        }
        if (m == M_WAX) return 0.86;
        if (m == M_SLEEVE) {
          // spines of different records, some thicker than others
          vec3 q = tableLocal(p);
          float u = (q.x + 1.0) * 170.0 + 0.8 * sin(q.x * 41.0) + 0.5 * sin(q.x * 97.0);
          float id = floor(u);
          float a = 0.22 + 0.42 * hash2(vec2(id, 7.0));
          a *= 1.0 - 0.35 * (1.0 - smoothstep(0.0, 0.08, min(fract(u), 1.0 - fract(u)))); // the gap between sleeves
          a -= 0.06 * smoothstep(0.3, 0.9, fbm(q.zy * 30.0 + id));
          return clamp(a, 0.04, 0.8);
        }
        if (m == M_PLINTH) return 0.08 + 0.02 * (noise(p.xz * 80.0) - 0.5);
        if (m == M_PLATTER) {
          // aluminium, with a ring of strobe dots round the rim that turn with it
          vec3 q = tableLocal(p);
          vec2 v = q.xz - REC_C;
          if (length(v) < 0.146) return 0.55;
          float a = atan(v.y, v.x) + uSpin;
          return q.y > 0.607 && q.y < 0.618 ? mix(0.22, 0.7, step(0.5, fract(a * 36.0 / PI))) : 0.6;
        }
        if (m == M_RECORD) {
          vec3 q = tableLocal(p);
          if (q.y < REC_Y - 5e-4) return 0.05; // the edge
          vec2 v = q.xz - REC_C;
          float r = length(v);
          // turning clockwise seen from above: the pattern that is at angle a now started at a + uSpin
          float a = atan(v.y, v.x) + uSpin;
          if (r < LABEL_R) {
            // a paper label printed off-centre, so the turning shows even from across the hall
            vec2 u = vec2(cos(a), sin(a)) * r;
            float lab = u.x > 0.0 && r < 0.042 ? 0.36 : 0.8;
            lab -= 0.45 * edgeLine(r - 0.045, 0.0012);
            lab -= 0.5 * step(abs(u.y - 0.012), 0.004) * step(abs(u.x + 0.02), 0.014);
            lab -= 0.35 * step(abs(u.y + 0.014), 0.0025) * step(abs(u.x + 0.018), 0.012);
            lab -= 0.35 * step(r, 0.0045);
            return lab;
          }
          float g = 0.035 + 0.012 * (noise(vec2(r * 2600.0, 0.5)) - 0.5);
          g += 0.035 * (edgeLine(r - 0.086, 0.0011) + edgeLine(r - 0.109, 0.0011) + edgeLine(r - 0.131, 0.0011)); // gaps between tracks
          return r > 0.147 ? 0.05 : g;
        }
        if (m == M_METAL) return 0.62;
        if (m == M_RUBBER) return 0.05;
        if (m == M_LEFT) {
          vec2 q = vec2(p.z, p.y);
          float a = 0.84;
          a -= 0.2 * smoothstep(0.58, 0.78, fbm(q * vec2(0.45, 0.7) + 3.0));
          a -= 0.4 * smoothstep(0.7, 0.86, fbm(q * 2.6 + 11.0));
          a -= 0.14 * (1.0 - smoothstep(0.0, 0.9, p.y));
          a += 0.035 * (noise(q * 35.0) - 0.5);
          // painted-over doorways
          for (int i = 0; i < 3; i++) {
            float z0 = 5.0 + float(i) * 15.0;
            vec2 dq = vec2(abs(p.z - (z0 + 1.1)) - 1.1, p.y - 2.5);
            float outline = max(edgeLine(dq.x, 0.035) * step(p.y, 2.5), edgeLine(dq.y, 0.035) * step(dq.x, 0.0));
            a *= 1.0 - 0.35 * outline;
            if (dq.x < 0.0 && dq.y < 0.0) a += 0.04;
          }
          return clamp(a, 0.05, 0.92);
        }
        if (m == M_RIGHT) {
          float a = 0.46 + 0.08 * (fbm(vec2(p.z, p.y) * 0.9) - 0.5);
          a *= 1.0 - 0.4 * edgeLine(mod(p.z + 1.22, 2.44) - 1.22, 0.01);
          return a;
        }
        if (m == M_STUD || m == M_PLATE) return 0.8 + 0.06 * (noise(vec2(p.z * 3.0, p.y * 0.6)) - 0.5);
        if (m == M_CEIL) return 0.06;
        if (m == M_BEAM) return 0.08;
        if (m == M_PIPE) return 0.62;
        if (m == M_BACK) {
          float a = 0.34 + 0.06 * (fbm(p.xy * 0.8) - 0.5);
          vec2 dq = vec2(abs(p.x) - DOOR_HALF_W, p.y - DOOR_H);
          if (dq.x < 0.25 && dq.y < 0.25) a = 0.14; // steel frame around the door
          return a;
        }
        return 0.5;
      }

      // A surface's colour. Everything in the hall is grey; the candle's jar is navy glass with its
      // printing in gold, and its wax is cream.
      vec3 surface(int m, vec3 p, vec3 n) {
        if (m == M_WAX) return vec3(0.87, 0.84, 0.77);
        if (m != M_GLASS) return vec3(albedo(m, p));
        vec3 q = jarLocal(p);
        if (n.y > 0.5) return vec3(0.12, 0.16, 0.3); // the rim
        if (dot(n.xz, q.xz) < 0.0) return vec3(0.03, 0.05, 0.13); // the inside of the wall, above the wax
        if (q.y < JAR_BASE) return vec3(0.1, 0.12, 0.18); // the thick clear base
        vec2 uv = vec2(fract((atan(q.z, q.x) - LABEL_FACING) / (2.0 * PI) + 0.5), 1.0 - q.y / JAR_H);
        float gold = textureLod(uLabel, uv, 0.0).r;
        return mix(vec3(0.018, 0.032, 0.095), vec3(0.8, 0.6, 0.28), gold);
      }

      // Candlelight coming through the glass: the wall above the wax glows with the flame behind
      // it, and below that the wax lets some through near the top. The gold ink blocks it.
      vec3 jarGlow(vec3 p, vec3 n) {
        vec3 q = jarLocal(p);
        if (n.y > 0.5 || dot(n.xz, q.xz) < 0.0) return vec3(0.0); // rim and inside are lit by the flame directly
        vec3 blue = vec3(0.22, 0.4, 1.0);
        if (q.y > WAX_Y) return 0.014 * blue;
        if (q.y < JAR_BASE) return 0.001 * CANDLE_RGB;
        vec2 uv = vec2(fract((atan(q.z, q.x) - LABEL_FACING) / (2.0 * PI) + 0.5), 1.0 - q.y / JAR_H);
        return 0.006 * exp(-(WAX_Y - q.y) / 0.02) * (1.0 - textureLod(uLabel, uv, 0.0).r) * blue;
      }

      float emission(int m, vec3 p) {
        if (m == M_TUBE) return TUBE_LE;
        if (m == M_BACK && abs(p.x) < DOOR_HALF_W && p.y < DOOR_H) {
          float slats = 0.8 + 0.2 * smoothstep(0.3, 0.5, abs(fract(p.x / 0.18) - 0.5) * 2.0);
          return DOOR_LE * slats * (0.85 + 0.15 * p.y / DOOR_H);
        }
        return 0.0;
      }

      // ---- lighting ----
      vec3 tubeCentre(int r, int c) { return vec3(COL0 + float(c) * COL_STEP, TUBE_Y, ROW0 + float(r) * ROW_STEP); }

      float tubeWeight(vec3 p, vec3 n, vec3 lc) {
        vec3 q = vec3(clamp(p.x, lc.x - TUBE_HALF_LEN, lc.x + TUBE_HALF_LEN), TUBE_Y, lc.z);
        vec3 v = q - p;
        float d2 = dot(v, v) + 0.2;
        float inv = inversesqrt(d2);
        return (max(0.0, v.y * inv) + 0.02) * (max(0.0, dot(n, v) * inv) + 0.02) / d2;
      }

      // Next-event estimation: pick one tube (nearer, better-facing tubes more often) and
      // test a shadow ray to a random point on its glowing underside.
      float directLight(vec3 p, vec3 n) {
        float total = 0.0;
        for (int r = 0; r < ROWS; r++) for (int c = 0; c < COLS; c++) total += tubeWeight(p, n, tubeCentre(r, c));
        float pick = rnd() * total;
        float w = 0.0;
        vec3 lc = tubeCentre(ROWS - 1, COLS - 1);
        bool found = false;
        for (int r = 0; r < ROWS && !found; r++) for (int c = 0; c < COLS && !found; c++) {
          vec3 cc = tubeCentre(r, c);
          w = tubeWeight(p, n, cc);
          pick -= w;
          if (pick <= 0.0) { lc = cc; found = true; }
        }
        if (!found) w = tubeWeight(p, n, lc);
        vec3 s = vec3(lc.x + (rnd() * 2.0 - 1.0) * TUBE_HALF_LEN, TUBE_Y, lc.z + (rnd() * 2.0 - 1.0) * TUBE_HALF_W);
        vec3 v = s - p;
        float dist2 = dot(v, v);
        float dist = sqrt(dist2);
        vec3 dir = v / dist;
        float cosS = dot(n, dir);
        float cosL = dir.y;
        if (cosS <= 0.0 || cosL <= 0.0) return 0.0;
        if (occluded(p + n * 2e-3, dir, dist)) return 0.0;
        return TUBE_LE * cosS * cosL * TUBE_AREA / (dist2 * (w / total)) / PI;
      }

      // How likely the glossy lobe around mirror direction r is to land on a tube: a
      // Gaussian in the distance from where r crosses the tubes' plane to the tube.
      float glossyWeight(vec3 p, vec3 r, vec3 lc) {
        float t = (TUBE_Y - p.y) / r.y;
        vec3 hp = p + r * t;
        float dx = max(0.0, abs(hp.x - lc.x) - TUBE_HALF_LEN);
        float dz = abs(hp.z - lc.z) - TUBE_HALF_W;
        float sigma = GLOSS_SPREAD * t + 0.02;
        return exp(-(dx * dx + max(0.0, dz) * max(0.0, dz)) / (2.0 * sigma * sigma)) + 1e-4;
      }

      // The tubes seen in the floor's glossy reflection, sampled directly so the
      // reflection converges instead of being a scatter of fireflies.
      float glossyLight(vec3 p, vec3 n, vec3 r) {
        if (r.y <= 0.0) return 0.0;
        float total = 0.0;
        for (int i = 0; i < ROWS; i++) for (int c = 0; c < COLS; c++) total += glossyWeight(p, r, tubeCentre(i, c));
        float pick = rnd() * total;
        float w = 0.0;
        vec3 lc = tubeCentre(ROWS - 1, COLS - 1);
        bool found = false;
        for (int i = 0; i < ROWS && !found; i++) for (int c = 0; c < COLS && !found; c++) {
          vec3 cc = tubeCentre(i, c);
          w = glossyWeight(p, r, cc);
          pick -= w;
          if (pick <= 0.0) { lc = cc; found = true; }
        }
        if (!found) w = glossyWeight(p, r, lc);
        vec3 s = vec3(lc.x + (rnd() * 2.0 - 1.0) * TUBE_HALF_LEN, TUBE_Y, lc.z + (rnd() * 2.0 - 1.0) * TUBE_HALF_W);
        vec3 v = s - p;
        float dist2 = dot(v, v);
        float dist = sqrt(dist2);
        vec3 dir = v / dist;
        float cosS = dot(n, dir);
        float cosL = dir.y;
        if (cosS <= 0.0 || cosL <= 0.0) return 0.0;
        float lobe = pow(max(0.0, dot(r, dir)), GLOSS_N);
        if (lobe < 1e-5) return 0.0;
        if (occluded(p + n * 2e-3, dir, dist)) return 0.0;
        float f = (GLOSS_N + 2.0) / (2.0 * PI) * lobe;
        return TUBE_LE * f * cosS * cosL * TUBE_AREA / (dist2 * (w / total));
      }

      // The candle as a light: a point in the bright middle of its flame, at rest (the flicker is
      // applied in post, so the light doesn't move in the loops). A candle wouldn't show at all
      // against these tubes, so it is far stronger than a real one (set in post), and its fall-off
      // is softened close to it so the board beside it isn't burnt out.
      vec3 flamePoint() {
        return jarWorld(vec3((rnd() * 2.0 - 1.0) * 0.002, FLAME_Y + FLAME_H * (0.2 + 0.45 * rnd()), (rnd() * 2.0 - 1.0) * 0.002));
      }

      float candleLight(vec3 p, vec3 n) {
        vec3 v = flamePoint() - p;
        float dist2 = dot(v, v);
        if (dist2 > CANDLE_REACH * CANDLE_REACH) return 0.0;
        float dist = sqrt(dist2);
        vec3 dir = v / dist;
        float cosS = dot(n, dir);
        if (cosS <= 0.0) return 0.0;
        if (occluded(p + n * 2e-3, dir, dist)) return 0.0;
        float fade = 1.0 - smoothstep(0.6 * CANDLE_REACH, CANDLE_REACH, dist);
        return cosS * fade / ((dist2 + CANDLE_SOFT * CANDLE_SOFT) * PI);
      }

      // ...and the flame seen in the floor's glossy reflection
      float candleGlossy(vec3 p, vec3 n, vec3 r) {
        vec3 v = flamePoint() - p;
        float dist2 = dot(v, v);
        if (dist2 > CANDLE_REACH * CANDLE_REACH) return 0.0;
        float dist = sqrt(dist2);
        vec3 dir = v / dist;
        float cosS = dot(n, dir);
        float lobe = pow(max(0.0, dot(r, dir)), GLOSS_N);
        if (cosS <= 0.0 || lobe < 1e-5) return 0.0;
        if (occluded(p + n * 2e-3, dir, dist)) return 0.0;
        // the candle's boost is for what it lights; its reflection only needs to be a faint smudge
        return 0.06 * (GLOSS_N + 2.0) / (2.0 * PI) * lobe * cosS / (dist2 + CANDLE_SOFT * CANDLE_SOFT);
      }

      vec3 phongSample(vec3 r) {
        float r1 = rnd(), r2 = rnd();
        float cosT = pow(r2, 1.0 / (GLOSS_N + 1.0));
        float sinT = sqrt(max(0.0, 1.0 - cosT * cosT));
        float phi = 2.0 * PI * r1;
        vec3 t = abs(r.y) < 0.9 ? normalize(cross(r, vec3(0, 1, 0))) : normalize(cross(r, vec3(1, 0, 0)));
        vec3 b = cross(r, t);
        return normalize(t * cos(phi) * sinT + b * sin(phi) * sinT + r * cosT);
      }

      vec3 cosineSample(vec3 n) {
        float r1 = rnd(), r2 = rnd();
        float phi = 2.0 * PI * r1, r = sqrt(r2);
        vec3 t = abs(n.y) < 0.9 ? normalize(cross(n, vec3(0, 1, 0))) : normalize(cross(n, vec3(1, 0, 0)));
        vec3 b = cross(n, t);
        return normalize(t * cos(phi) * r + b * sin(phi) * r + n * sqrt(1.0 - r2));
      }

      void main() {
        rngState = pcg(uint(gl_FragCoord.x) * 1973u + uint(gl_FragCoord.y) * 9277u + uint(uFrame) * 26699u) | 1u;
        vec2 uv = (gl_FragCoord.xy + vec2(rnd(), rnd())) / uRes * 2.0 - 1.0;
        vec3 o = uCamPos;
        vec3 d = safeDir(normalize(uCamRight * (uv.x * uTanY * uRes.x / uRes.y) + uCamUp * (uv.y * uTanY) + uCamFwd));

        // Two kinds of light are summed apart: the tubes' and the door's, and the candle's (its
        // colour included, but not its strength or flicker, which post decides). The flame itself,
        // seen straight on, is a third sum.
        vec3 radiance = vec3(0.0);
        vec3 candle = vec3(0.0);
        float flame = 0.0;
        vec3 throughput = vec3(1.0);
        bool countEmitters = true;
        for (int bounce = 0; bounce < 4; bounce++) {
          Hit h = trace(o, d);
          if (bounce == 0) flame += flameGlow(o, d, h.t);
          if (h.m == M_NONE) break;
          vec3 p = o + d * h.t;

          float e = emission(h.m, p);
          if (h.m == M_TUBE) { if (countEmitters) radiance += throughput * e; break; }
          if (e > 0.0) { radiance += throughput * e; break; }

          vec3 a = surface(h.m, p, h.n);
          vec3 n = h.n;
          if (h.m == M_GLASS) candle += throughput * jarGlow(p, n);

          // sealed concrete, vinyl and glass: a faint, slightly blurry mirror, strongest at grazing angles
          bool record = h.m == M_RECORD && vinyl(p, n);
          bool glass = h.m == M_GLASS;
          if (h.m == M_FLOOR || record || glass) {
            float grazing = pow(1.0 - max(0.0, -dot(d, n)), 5.0);
            float fresnel = glass ? 0.04 + 0.6 * grazing : (record ? 0.05 : 0.025) + (record ? 0.7 : 0.5) * grazing;
            if (rnd() < fresnel) {
              vec3 r = reflect(d, n);
              // a dark record shows every overbright sample as a white speck, so its highlights are capped
              float mirrored = glossyLight(p, n, r);
              radiance += throughput * (record ? min(mirrored, 3.0) : mirrored);
              if (h.m == M_FLOOR && bounce < 2) candle += throughput * CANDLE_RGB * candleGlossy(p, n, r);
              d = safeDir(phongSample(r));
              if (dot(d, n) < 0.0) d = reflect(d, n);
              o = p + n * 2e-3;
              countEmitters = false;
              continue;
            }
          }

          radiance += throughput * a * directLight(p, n);
          // the candle's light only for the first two bounces: past that it is too faint to matter
          if (bounce < 2) candle += throughput * a * CANDLE_RGB * candleLight(p, n);
          throughput *= a;
          d = safeDir(cosineSample(n));
          o = p + n * 2e-3;
          countEmitters = false;
        }

        vec2 pixel = gl_FragCoord.xy / uRes;
        outBase = texture(uPrev, pixel) + vec4(radiance, flame);
        outCandle = texture(uPrevCandle, pixel) + vec4(candle, 0.0);
      }
    </script>
    <script>
      const params = new URLSearchParams(location.search)
      const W = Number(params.get('w') ?? 960)
      const H = Number(params.get('h') ?? 600)
      const SPP = Number(params.get('spp') ?? 64)

      function compile(gl, type, source) {
        const shader = gl.createShader(type)
        gl.shaderSource(shader, source)
        gl.compileShader(shader)
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader))
        return shader
      }

      function boxBlur(src, w, h, r) {
        const tmp = new Float32Array(src.length)
        const out = new Float32Array(src.length)
        const inv = 1 / (2 * r + 1)
        for (let y = 0; y < h; y++) {
          let acc = 0
          const row = y * w
          for (let x = -r; x <= r; x++) acc += src[row + Math.min(w - 1, Math.max(0, x))]
          for (let x = 0; x < w; x++) {
            tmp[row + x] = acc * inv
            acc += src[row + Math.min(w - 1, x + r + 1)] - src[row + Math.max(0, x - r)]
          }
        }
        for (let x = 0; x < w; x++) {
          let acc = 0
          for (let y = -r; y <= r; y++) acc += tmp[Math.min(h - 1, Math.max(0, y)) * w + x]
          for (let y = 0; y < h; y++) {
            out[y * w + x] = acc * inv
            acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]
          }
        }
        return out
      }

      function blur(src, w, h, r) {
        return boxBlur(boxBlur(boxBlur(src, w, h, r), w, h, r), w, h, r)
      }

      // Cheap value noise for roughing up the chalk texture.
      function valueNoise(x, y) {
        const hash = (i, j) => {
          const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453
          return s - Math.floor(s)
        }
        const xi = Math.floor(x), yi = Math.floor(y)
        const xf = x - xi, yf = y - yi
        const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf)
        const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1)
        return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v
      }

      // The writing on a blackboard, as a texture the shader lays over the slate: the tagline
      // in a handwriting font with an underline, a few stray marks, and the streaky haze a
      // dry duster leaves behind. Red channel: 0 = bare slate, 1 = solid chalk. Without
      // writing (the music board, which the site writes on) it is just a different haze.
      function boardTexture({ writing = true } = {}) {
        const w = 1024, h = 512
        const layer = () => {
          const c = document.createElement('canvas')
          c.width = w
          c.height = h
          const ctx = c.getContext('2d')
          ctx.fillStyle = '#000'
          ctx.fillRect(0, 0, w, h)
          return ctx
        }
        const font = '"Ink Free", "Segoe Print", "Segoe Script", "Comic Sans MS", cursive'

        // haze: soft smears left by wiping the board, mostly where the writing goes
        const haze = layer()
        haze.filter = 'blur(14px)'
        const smears = [
          [0.5, 0.5, 0.62, 0.2, -0.03, 0.18],
          [0.3, 0.63, 0.4, 0.15, 0.06, 0.13],
          [0.72, 0.36, 0.34, 0.13, -0.1, 0.11],
          [0.55, 0.8, 0.5, 0.11, 0.02, 0.15],
          [0.18, 0.3, 0.22, 0.17, 0.2, 0.09],
          [0.84, 0.72, 0.2, 0.11, -0.3, 0.1],
          [0.42, 0.22, 0.3, 0.1, 0.05, 0.08],
        ]
        const wiped = writing ? smears : smears.map(([cx, cy, sw, sh, angle, alpha]) => [1 - cx, 0.1 + 0.85 * cy, 0.9 * sw, 0.8 * sh, -angle, 0.45 * alpha])
        for (const [cx, cy, sw, sh, angle, alpha] of wiped) {
          haze.save()
          haze.translate(cx * w, cy * h)
          haze.rotate(angle)
          haze.fillStyle = `rgba(255,255,255,${alpha})`
          haze.beginPath()
          haze.ellipse(0, 0, sw * w * 0.5, sh * h * 0.5, 0, 0, Math.PI * 2)
          haze.fill()
          haze.restore()
        }

        // chalk: two lines, an underline that trails off, a couple of stray strokes
        const chalk = layer()
        if (writing) {
          const lines = ['A theoretical', 'physics student']
          chalk.font = `100px ${font}`
          const size = Math.floor(Math.min(...lines.map((line) => (100 * 0.8 * w) / chalk.measureText(line).width)))
          chalk.font = `${size}px ${font}`
          chalk.textAlign = 'center'
          chalk.textBaseline = 'middle'
          chalk.lineJoin = 'round'
          chalk.lineCap = 'round'
          chalk.fillStyle = 'rgba(255,255,255,0.96)'
          chalk.strokeStyle = 'rgba(255,255,255,0.9)'
          chalk.filter = 'blur(0.8px)'
          chalk.save()
          chalk.translate(0.49 * w, 0.37 * h)
          chalk.rotate(-0.03)
          chalk.lineWidth = size * 0.035
          chalk.strokeText(lines[0], 0, 0)
          chalk.fillText(lines[0], 0, 0)
          chalk.strokeText(lines[1], 0.01 * w, size * 1.15)
          chalk.fillText(lines[1], 0.01 * w, size * 1.15)
          chalk.lineWidth = size * 0.05
          chalk.beginPath()
          chalk.moveTo(-0.35 * w, size * 1.71)
          chalk.quadraticCurveTo(-0.05 * w, size * 1.89, 0.31 * w, size * 1.75)
          chalk.stroke()
          chalk.restore()
          chalk.lineWidth = 5
          chalk.strokeStyle = 'rgba(255,255,255,0.75)'
          chalk.beginPath()
          chalk.moveTo(0.86 * w, 0.9 * h)
          chalk.lineTo(0.9 * w, 0.87 * h)
          chalk.moveTo(0.905 * w, 0.915 * h)
          chalk.lineTo(0.93 * w, 0.9 * h)
          chalk.moveTo(0.07 * w, 0.12 * h)
          chalk.quadraticCurveTo(0.1 * w, 0.08 * h, 0.13 * w, 0.11 * h)
          chalk.stroke()
        }

        // rough both up: chalk never covers evenly, and the haze streaks along the wipe
        const out = layer()
        const hp = haze.getImageData(0, 0, w, h).data
        const cp = chalk.getImageData(0, 0, w, h).data
        const img = out.getImageData(0, 0, w, h)
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4
            let v = 0
            if (hp[i] > 0) {
              const streak = valueNoise(x * 0.012, y * 0.14)
              const fine = valueNoise(x * 0.5 + 7, y * 0.5)
              v += (hp[i] / 255) * (0.3 + 0.7 * streak) * (0.7 + 0.3 * fine)
            }
            if (cp[i] > 0) {
              const fine = valueNoise(x * 0.45, y * 0.45 + 3)
              const coarse = valueNoise(x * 0.06 + 11, y * 0.06)
              v += (cp[i] / 255) * (0.4 + 0.42 * fine + 0.18 * coarse)
            }
            img.data[i] = img.data[i + 1] = img.data[i + 2] = Math.round(Math.min(1, v) * 255)
            img.data[i + 3] = 255
          }
        }
        out.putImageData(img, 0, 0)
        return out.canvas
      }

      // The gold printing on the candle's glass, unrolled: u runs once round the jar (the middle of
      // the texture faces LABEL_FACING), v from its rim down to its foot. Laid out from the Carby
      // Musk tumbler: the name in a serif about half way up, the house's seven-ring mark under it,
      // and the house's name in small capitals. Red channel: 1 = gold.
      function labelTexture() {
        const w = 1024, h = 420 // 25.8 cm round × 11 cm tall: about 39 px to the cm both ways
        const c = document.createElement('canvas')
        c.width = w
        c.height = h
        const ctx = c.getContext('2d')
        ctx.fillStyle = '#000'
        ctx.fillRect(0, 0, w, h)
        ctx.fillStyle = ctx.strokeStyle = '#fff'
        ctx.textAlign = 'center'
        ctx.textBaseline = 'alphabetic'
        const cm = h / 11
        const fromFoot = (y) => h - y * cm // cm above the foot → px from the top
        const fit = (text, font, width) => {
          ctx.font = `100px ${font}`
          return (100 * width) / ctx.measureText(text).width
        }
        const serif = 'Georgia, "Times New Roman", serif'
        ctx.font = `${fit('Carby', serif, 1.9 * cm)}px ${serif}`
        ctx.fillText('Carby', w / 2, fromFoot(4.7))
        ctx.fillText('Musk', w / 2, fromFoot(4.0))
        // seven rings: one in the middle, six round it
        const ring = 0.1 * cm
        ctx.lineWidth = 0.02 * cm
        for (let i = 0; i < 7; i++) {
          const a = (i * Math.PI) / 3
          const [x, y] = i === 6 ? [0, 0] : [2 * ring * Math.cos(a), 2 * ring * Math.sin(a)]
          ctx.beginPath()
          ctx.arc(w / 2 + x, fromFoot(3.2) + y, ring, 0, 2 * Math.PI)
          ctx.stroke()
        }
        const sans = 'Arial, Helvetica, sans-serif'
        ctx.font = `${fit('BETTER WORLD', sans, 2.1 * cm) * 0.9}px ${sans}`
        ctx.fillText('BETTER WORLD', w / 2, fromFoot(2.5))
        ctx.fillText('FRAGRANCE HOUSE', w / 2, fromFoot(2.2))
        return c
      }

      // Felzenszwalb & Huttenlocher's exact Euclidean distance transform, in place on a grid
      // of squared distances (0 on the shape, EDT_INF off it): one 1D pass per axis.
      const EDT_INF = 1e20
      function edt(grid, width, height) {
        const n = Math.max(width, height)
        const f = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1)
        for (let x = 0; x < width; x++) edt1d(grid, x, width, height, f, v, z)
        for (let y = 0; y < height; y++) edt1d(grid, y * width, 1, width, f, v, z)
      }
      function edt1d(grid, offset, stride, length, f, v, z) {
        v[0] = 0
        z[0] = -EDT_INF
        z[1] = EDT_INF
        f[0] = grid[offset]
        for (let q = 1, k = 0, s = 0; q < length; q++) {
          f[q] = grid[offset + q * stride]
          const q2 = q * q
          do {
            const r = v[k]
            s = (f[q] - f[r] + q2 - r * r) / (q - r) / 2
          } while (s <= z[k] && --k > -1)
          k++
          v[k] = q
          z[k] = s
          z[k + 1] = EDT_INF
        }
        for (let q = 0, k = 0; q < length; q++) {
          while (z[k + 1] < q) k++
          const r = v[k]
          const qr = q - r
          grid[offset + q * stride] = f[r] + qr * qr
        }
      }

      // Reads a glyph's ink back out of the atlas to decide where its wire ties on. Hung from
      // the column through its centre of mass a letter hangs level, and the wire meets the
      // first ink down that column — the top of an o, the shoulder of an h (the i's dot is a
      // separate piece, so the wire passes through it to the stem). A letter open at the top
      // in the middle (the M) would put that tie deep in its notch, so it gets a bridle
      // instead: two legs from the end of the wire to the highest ink either side of the
      // column. Pixels are those of the glyph's rect in the atlas; rows count down from its top.
      function inkAnalysis(ctx, x0, y0, w, h) {
        const data = ctx.getImageData(x0, y0, w, h).data
        const piece = new Int32Array(w * h) // which connected piece of ink each pixel belongs to
        const sizes = [0]
        let sumX = 0, count = 0
        for (let i = 0; i < w * h; i++) {
          if (data[i * 4] <= 127) continue
          sumX += i % w
          count++
          if (piece[i]) continue
          const id = sizes.push(0) - 1
          const stack = [i]
          piece[i] = id
          while (stack.length) {
            const j = stack.pop()
            sizes[id]++
            for (const n of [j - w, j + w, j % w > 0 ? j - 1 : -1, j % w < w - 1 ? j + 1 : -1]) {
              if (n >= 0 && n < w * h && !piece[n] && data[n * 4] > 127) {
                piece[n] = id
                stack.push(n)
              }
            }
          }
        }
        const main = sizes.indexOf(Math.max(...sizes))
        const topOf = (x) => {
          // first row of the main piece down column x
          if (x >= 0 && x < w) for (let y = 0; y < h; y++) if (piece[y * w + x] === main) return y
          return Infinity
        }
        let top = Infinity, bottom = 0
        for (let i = 0; i < w * h; i++) if (piece[i] === main) { top = Math.min(top, Math.floor(i / w)); bottom = Math.floor(i / w) }
        const centre = Math.round(sumX / count)
        let col = centre
        for (let s = 1; topOf(col) === Infinity && s < w; s++) col = topOf(centre + s) < Infinity ? centre + s : centre - s
        let tieRow = topOf(col), legs = null
        if (tieRow - top > 0.4 * (bottom - top)) {
          const peak = (from, to, step) => {
            // the highest ink between two columns, at its point nearest the tie column
            let best = { x: from, y: Infinity }
            for (let x = from; x !== to; x += step) {
              const y = topOf(x)
              if (y < best.y) best = { x, y }
            }
            return best
          }
          legs = [peak(col - 1, -1, -1), peak(col + 1, w, 1)]
          tieRow = Math.min(legs[0].y, legs[1].y) - 0.42 * (legs[1].x - legs[0].x) // the ring, above the letter
        }
        return { col, tieRow, legs }
      }

      // The name hung from the tubes: one glyph per cell of an atlas that ends up holding
      // the signed distance to each outline (the shader extrudes and ray-marches it), plus
      // where and how each letter hangs (metres). Each word hangs from its own tube, the
      // two either side of the middle of the hall, pushed together as far as the gap between
      // the tubes allows. Every letter is tied on where its ink actually is (see inkAnalysis)
      // and gets its own twist on the wire, a small pendulum tilt and a little slack, so they
      // hang loosely rather than in a line; pose(t) then moves each of them a little for the
      // frames of the looping video. Michroma only comes in one weight, so the outline is
      // stroked to push it towards the sleeve's bold.
      function hangingLetters() {
        const fs = document.getElementById('fs').textContent
        const glsl = (name) => Number(fs.match(new RegExp(`const (?:float|int) ${name} = (-?[\\d.]+)`))[1])
        const TUBE_Y = glsl('TUBE_Y'), TUBE_HALF_LEN = glsl('TUBE_HALF_LEN'), COLS = glsl('COLS')
        const COL0 = glsl('COL0'), COL_STEP = glsl('COL_STEP'), ROW0 = glsl('ROW0'), ROW_STEP = glsl('ROW_STEP')

        const CAP_H = 0.45 // height of a capital
        const WIRE = 0.4 // from the tube down to the tallest letters
        // which row of tubes: the first inside the landscape frame; one further back for the
        // portrait frame, which is too narrow for the name at that row
        const ROW = ROW0 + Number(params.get('row') ?? 2) * ROW_STEP
        const inset = (COL_STEP - 2 * TUBE_HALF_LEN) / 2 + 0.08 // a wire this far from the hall's centre line is on a tube
        // per letter: twist about the wire, pendulum tilt back/forth and side to side (degrees), extra wire (m)
        const twist = [12, -8, 15, -11, 6, -14, 9, 13, -10, 4, -7]
        const swing = [3, -2.5, 4, -3.5, 1.5, -4, 2.5, 3.5, -3, 1, -2]
        const lean = [2, -1.5, 2.5, -2, 1, -2.5, 1.5, 2, -1.5, 0.5, -1]
        const slack = [0.02, -0.03, 0.04, -0.01, 0.03, -0.04, 0.01, -0.02, 0.03, -0.03, 0.02]
        // ...and how each one moves in the looping video: a slow turn on the wire (one cycle
        // per loop) and the pendulum swing of the wire itself (three, i.e. a 2 s period, about
        // right for wires this long), each letter with its own phases and vigour so they are
        // never in step. Whole cycles per LOOP make the loop seamless.
        const LOOP = 6 // seconds
        const phase = [[0.3, 1.1, 2.4], [2.1, 4.0, 0.2], [4.4, 2.5, 3.9], [1.2, 5.8, 1.0], [5.5, 0.4, 5.3], [3.3, 3.6, 2.0], [0.9, 1.9, 4.7], [2.8, 5.1, 0.6], [4.9, 2.2, 3.4], [1.7, 0.8, 5.9], [3.9, 4.5, 1.5]] // twist, swing, lean (rad)
        const vigour = [1, 0.8, 1.2, 0.9, 1.1, 0.7, 1.3, 0.9, 1, 1.2, 0.8]

        const px = 300, tracking = 0.06 * px, cell = 512, cols = 4
        const words = 'Malachi Topp'.split(' ')
        const count = words.join('').length
        if (count !== glsl('LETTER_N')) throw new Error(`LETTER_N in the shader must be ${count}`)
        const atlas = document.createElement('canvas')
        atlas.width = cell * cols
        atlas.height = cell * Math.ceil(count / cols)
        const ctx = atlas.getContext('2d')
        ctx.fillStyle = '#000'
        ctx.fillRect(0, 0, atlas.width, atlas.height)
        ctx.font = `${px}px Michroma`
        ctx.textAlign = 'left'
        ctx.textBaseline = 'alphabetic'
        ctx.fillStyle = ctx.strokeStyle = '#fff'
        ctx.lineJoin = 'round'
        ctx.lineWidth = px * 0.05
        const pad = ctx.lineWidth / 2 + 1 // the stroke sits outside the measured ink
        const scale = CAP_H / ctx.measureText('M').actualBoundingBoxAscent

        // draw each glyph into its cell — its rect there is the measured ink plus the pad all
        // round — and read back where its wire should tie on
        let k = 0
        const glyphs = words.map((word) => {
          let pen = 0
          return [...word].map((ch) => {
            const m = ctx.measureText(ch)
            const halfW = (m.actualBoundingBoxRight + m.actualBoundingBoxLeft) / 2 + pad
            const ascent = m.actualBoundingBoxAscent + pad, descent = m.actualBoundingBoxDescent + pad
            const w = Math.ceil(2 * halfW) + 1, h = Math.ceil(ascent + descent) + 1
            const boxL = Math.round((k % cols) * cell + cell / 2 - halfW)
            const boxT = Math.round(Math.floor(k / cols) * cell + cell / 2 - (ascent + descent) / 2)
            ctx.strokeText(ch, boxL + pad + m.actualBoundingBoxLeft, boxT + ascent)
            ctx.fillText(ch, boxL + pad + m.actualBoundingBoxLeft, boxT + ascent)
            const ink = inkAnalysis(ctx, boxL, boxT, w, h)
            // the tie column in the word's own coordinates: the glyph's origin sits pad + left in from its rect
            const glyph = { ch, k: k++, boxL, boxT, w, h, ascent, ...ink, tiePx: pen + ink.col - pad - m.actualBoundingBoxLeft }
            pen += m.width + tracking
            return glyph
          })
        })
        const [first, second] = glyphs
        const starts = [-inset - first[first.length - 1].tiePx * scale, inset - second[0].tiePx * scale]
        const baseline = TUBE_Y - WIRE - CAP_H

        const rad = (deg) => (deg * Math.PI) / 180
        const rotX = (a) => [[1, 0, 0], [0, Math.cos(a), -Math.sin(a)], [0, Math.sin(a), Math.cos(a)]]
        const rotY = (a) => [[Math.cos(a), 0, Math.sin(a)], [0, 1, 0], [-Math.sin(a), 0, Math.cos(a)]]
        const rotZ = (a) => [[Math.cos(a), -Math.sin(a), 0], [Math.sin(a), Math.cos(a), 0], [0, 0, 1]]
        const mul = (A, B) => A.map((row) => B[0].map((_, j) => row.reduce((sum, a, k) => sum + a * B[k][j], 0)))
        const columnMajor = (M) => [0, 1, 2].flatMap((j) => [M[0][j], M[1][j], M[2][j]])

        // The pose at time t (seconds into the loop; 0 is the still): where each letter hangs
        // and how it is turned. Each angle wobbles about its resting value by a sine that
        // starts at zero, so frame 0 of the video is exactly the still.
        const pose = (t = 0) => {
          const wobble = (rest, amp, cycles, ph) => rest + amp * (Math.sin((2 * Math.PI * cycles * t) / LOOP + ph) - Math.sin(ph))
          const hang = [], size = [], uv = [], rot = [], legs = [], layout = []
          const min = [Infinity, Infinity, ROW - 0.35], max = [-Infinity, TUBE_Y + 0.01, ROW + 0.35]
          glyphs.forEach((word, w) => {
            for (const g of word) {
              const x = starts[w] + g.tiePx * scale
              if (![...Array(COLS).keys()].some((c) => Math.abs(x - (COL0 + c * COL_STEP)) <= TUBE_HALF_LEN))
                throw new Error(`"${g.ch}" would hang at x = ${x.toFixed(2)}, between tubes`)
              // the wire runs from the tube down to the glyph's tie row (the rect's row 0 is at
              // baseline + ascent); the card is then placed around that point
              const wire = TUBE_Y - (baseline + (g.ascent - g.tieRow) * scale) + slack[g.k]
              const hw = (g.w / 2) * scale, hh = g.h * scale
              const cx = (g.w / 2 - g.col) * scale, top = g.tieRow * scale - wire
              hang.push(x, TUBE_Y, ROW, wire)
              size.push(hw, hh, cx, top)
              uv.push(g.boxL / atlas.width, g.boxT / atlas.height, (g.boxL + g.w) / atlas.width, (g.boxT + g.h) / atlas.height)
              const bury = 0.015 / scale // px: the legs' ends sit inside the board
              legs.push(...(g.legs ? g.legs.flatMap((leg) => [(leg.x - g.col) * scale, top - (leg.y + bury) * scale]) : [0, 0, 0, 0]))
              // twist about the wire first, then the pendulum tilt of wire and letter together
              const [ph1, ph2, ph3] = phase[g.k], v = vigour[g.k]
              const turn = wobble(twist[g.k], 5 * v, 1, ph1), pitch = wobble(swing[g.k], 2 * v, 3, ph2), roll = wobble(lean[g.k], 1.2 * v, 3, ph3)
              rot.push(...columnMajor(mul(mul(rotX(rad(pitch)), rotZ(rad(roll))), rotY(rad(turn)))))
              // the box is padded to hold the letter wherever the loop takes it
              min[0] = Math.min(min[0], x + cx - hw - 0.25)
              max[0] = Math.max(max[0], x + cx + hw + 0.25)
              min[1] = Math.min(min[1], TUBE_Y + top - hh - 0.15)
              layout.push({ ch: g.ch, x: +x.toFixed(3), wire: +wire.toFixed(3), tie: g.legs ? 'bridle' : `row ${g.tieRow} of ${g.h}`, angles: [turn, pitch, roll].map((a) => +a.toFixed(1)) })
            }
          })
          return { hang, size, uv, rot, legs, min, max, layout }
        }

        // signed distance to the outlines (atlas px, positive outside), from the
        // anti-aliased mask: an exact distance transform of the outside and of the inside
        const aw = atlas.width, ah = atlas.height
        const mask = ctx.getImageData(0, 0, aw, ah).data
        const outer = new Float64Array(aw * ah), inner = new Float64Array(aw * ah)
        for (let i = 0; i < aw * ah; i++) {
          const a = mask[i * 4] / 255
          outer[i] = a === 1 ? 0 : a === 0 ? EDT_INF : Math.max(0, 0.5 - a) ** 2
          inner[i] = a === 1 ? EDT_INF : a === 0 ? 0 : Math.max(0, a - 0.5) ** 2
        }
        edt(outer, aw, ah)
        edt(inner, aw, ah)
        const sdf = new Float32Array(aw * ah)
        for (let i = 0; i < aw * ah; i++) sdf[i] = Math.sqrt(outer[i]) - Math.sqrt(inner[i])
        return { sdf, width: aw, height: ah, scale, loop: LOOP, pose }
      }

      // ---- cameras ----
      const sub = (a, b) => a.map((v, i) => v - b[i])
      const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2]
      const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]
      const normalize = (a) => a.map((v) => v / Math.hypot(...a))

      // A camera as the shader uses it, from where it stands, a point it looks at and its
      // vertical field of view: each pixel's ray runs along fwd + x·right + y·up, with y from
      // -tanY to tanY across the frame and x the same times the aspect ratio. No roll.
      function lookAt({ pos, target, fov }) {
        const fwd = normalize(sub(target, pos))
        const right = normalize(cross([0, 1, 0], fwd))
        return { pos, right, up: cross(fwd, right), fwd, tanY: Math.tan((fov * Math.PI) / 360) }
      }

      // The rectangle of GL pixels (y up), padded by a margin, that a world-space box (its 8
      // corners, as from boxCorners) covers in the frame; null if none of it is in view. The
      // part of the box in front of the camera is what gets projected: its corners there, plus
      // where its edges cross the near plane.
      function screenRect(cam, corners) {
        const NEAR = 0.05
        const depth = corners.map((p) => dot(sub(p, cam.pos), cam.fwd))
        const points = corners.filter((_, i) => depth[i] >= NEAR)
        for (let i = 0; i < 8; i++) {
          for (const j of [i | 1, i | 2, i | 4]) {
