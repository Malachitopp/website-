            if (j !== i && (depth[i] < NEAR) !== (depth[j] < NEAR)) {
              const k = (NEAR - depth[i]) / (depth[j] - depth[i])
              points.push(corners[i].map((v, a) => v + (corners[j][a] - v) * k))
            }
          }
        }
        let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity
        for (const p of points) {
          const v = sub(p, cam.pos)
          const z = Math.max(NEAR, dot(v, cam.fwd))
          const sx = ((dot(v, cam.right) / (z * cam.tanY * (W / H))) * 0.5 + 0.5) * W
          const sy = ((dot(v, cam.up) / (z * cam.tanY)) * 0.5 + 0.5) * H
          x0 = Math.min(x0, sx)
          x1 = Math.max(x1, sx)
          y0 = Math.min(y0, sy)
          y1 = Math.max(y1, sy)
        }
        if (!points.length) return null
        const margin = Math.max(8, Math.round((40 * W) / 2400))
        const x = Math.max(0, Math.floor(x0) - margin), y = Math.max(0, Math.floor(y0) - margin)
        const w = Math.min(W, Math.ceil(x1) + margin) - x, h = Math.min(H, Math.ceil(y1) + margin) - y
        return w > 0 && h > 0 ? { x, y, w, h } : null
      }

      const boxCorners = (min, max) => [0, 1, 2, 3, 4, 5, 6, 7].map((i) => [i & 1 ? max[0] : min[0], i & 2 ? max[1] : min[1], i & 4 ? max[2] : min[2]])

      // ---- rendering ----
      // Everything is set up once; render.mjs then drives the page through window.studio:
      // stills, loop frames and walk frames from whatever camera it asks for.
      async function setup() {
        if ((await document.fonts.load('300px Michroma')).length === 0) throw new Error('Michroma did not load')
        const fs = document.getElementById('fs').textContent
        // scene constants the JS needs, read out of the shader so the two can't drift
        const num = (name) => Number(fs.match(new RegExp(`\\b${name} = (-?[\\d.]+)`))[1])
        const vec = (name) => fs.match(new RegExp(`\\b${name} = vec[23]\\(([^)]*)\\)`))[1].split(',').map(Number)
        const CANDLE_RGB = vec('CANDLE_RGB')

        const canvas = document.getElementById('out')
        const gl = canvas.getContext('webgl2', { antialias: false })
        if (!gl.getExtension('EXT_color_buffer_float')) throw new Error('no float render targets')
        const info = gl.getExtension('WEBGL_debug_renderer_info')
        const gpu = info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : 'unknown'

        const program = gl.createProgram()
        gl.attachShader(program, compile(gl, gl.VERTEX_SHADER, document.getElementById('vs').textContent))
        gl.attachShader(program, compile(gl, gl.FRAGMENT_SHADER, fs))
        gl.linkProgram(program)
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program))
        gl.useProgram(program)
        const uniform = (name) => gl.getUniformLocation(program, name)

        const quad = gl.createBuffer()
        gl.bindBuffer(gl.ARRAY_BUFFER, quad)
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW)
        const aPos = gl.getAttribLocation(program, 'aPos')
        gl.enableVertexAttribArray(aPos)
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0)

        // two ping-pong targets, each with two float textures: the tubes' light and the flame (0),
        // and the candle's light (1)
        gl.clearColor(0, 0, 0, 0)
        const targets = [0, 1].map(() => {
          const fb = gl.createFramebuffer()
          gl.bindFramebuffer(gl.FRAMEBUFFER, fb)
          const tex = [0, 1].map((k) => {
            const t = gl.createTexture()
            gl.bindTexture(gl.TEXTURE_2D, t)
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, W, H, 0, gl.RGBA, gl.FLOAT, null)
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST)
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST)
            gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + k, gl.TEXTURE_2D, t, 0)
            return t
          })
          gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1])
          if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error('float render target incomplete')
          gl.clear(gl.COLOR_BUFFER_BIT)
          return { tex, fb }
        })

        const texture = (unit, name, source) => {
          const tex = gl.createTexture()
          gl.activeTexture(gl.TEXTURE0 + unit)
          gl.bindTexture(gl.TEXTURE_2D, tex)
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source)
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR)
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR)
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
          gl.uniform1i(uniform(name), unit)
        }
        texture(1, 'uBoard', boardTexture())
        texture(3, 'uBoard2', boardTexture({ writing: false }))
        texture(5, 'uLabel', labelTexture())

        const letters = hangingLetters()
        const lettersTex = gl.createTexture()
        gl.activeTexture(gl.TEXTURE2)
        gl.bindTexture(gl.TEXTURE_2D, lettersTex)
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, letters.width, letters.height, 0, gl.RED, gl.FLOAT, letters.sdf)
        // a float field only filters smoothly with the extension; nearest still works, just steppier sides
        const sdfFilter = gl.getExtension('OES_texture_float_linear') ? gl.LINEAR : gl.NEAREST
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, sdfFilter)
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, sdfFilter)
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
        gl.uniform1i(uniform('uLetters'), 2)
        gl.uniform1f(uniform('uLetterScale'), letters.scale)
        gl.activeTexture(gl.TEXTURE0)

        gl.viewport(0, 0, W, H)
        gl.uniform2f(uniform('uRes'), W, H)
        gl.uniform1i(uniform('uPrev'), 0)
        gl.uniform1i(uniform('uPrevCandle'), 4)
        const uFrame = uniform('uFrame')

        // The record turns 3 times per loop (30 rpm, near enough to 33⅓) so the loop is seamless.
        const SPIN_REVS = 3
        // The candle breathes: its light's strength over time is 1 plus a few sines, each a whole
        // number of cycles per loop so the loops stay seamless ([amplitude, cycles per loop,
        // phase]). Post scales the candle's light by it; the flame stretches with it and its tip
        // wanders. The site reads the same numbers to flicker the light it adds to its own
        // things (the prints, the album cover).
        const FLICKER = [[0.045, 2, 0.4], [0.03, 5, 2.1], [0.024, 11, 4.4], [0.018, 17, 1.3], [0.012, 29, 5.2]]
        const flicker = (t) => 1 + FLICKER.reduce((sum, [amp, cycles, phase]) => sum + amp * Math.sin((2 * Math.PI * cycles * t) / letters.loop + phase), 0)
        const wave = (t, cycles, phase) => Math.sin((2 * Math.PI * cycles * t) / letters.loop + phase)
        // Everything that moves, at t seconds: the letters' pose (see hangingLetters), the
        // record's angle and the flame. Returns the letters' box, which already covers their whole swing.
        const setTime = (t) => {
          gl.uniform4f(uniform('uFlame'), 0.0011 * wave(t, 3, 1.0) + 0.0005 * wave(t, 7, 2.5), 0.0008 * wave(t, 4, 0.3), 1 + 0.8 * (flicker(t) - 1), 0)
          const p = letters.pose(((t % letters.loop) + letters.loop) % letters.loop)
          gl.uniform4fv(uniform('uLetterHang'), p.hang)
          gl.uniform4fv(uniform('uLetterSize'), p.size)
          gl.uniform4fv(uniform('uLetterUV'), p.uv)
          gl.uniformMatrix3fv(uniform('uLetterRot'), false, p.rot)
          gl.uniform4fv(uniform('uLetterLegs'), p.legs)
          gl.uniform3fv(uniform('uLetterMin'), p.min)
          gl.uniform3fv(uniform('uLetterMax'), p.max)
          gl.uniform1f(uniform('uSpin'), (2 * Math.PI * SPIN_REVS * t) / letters.loop)
          return p
        }
        const setCamera = (cam) => {
          gl.uniform3fv(uniform('uCamPos'), cam.pos)
          gl.uniform3fv(uniform('uCamRight'), cam.right)
          gl.uniform3fv(uniform('uCamUp'), cam.up)
          gl.uniform3fv(uniform('uCamFwd'), cam.fwd)
          gl.uniform1f(uniform('uTanY'), cam.tanY)
        }

        // Points in the scene the site pins its live overlays to, and the box the record's
        // moving parts sit in (for the loops' patches), in world metres.
        const yawWorld = (pos, c, s, [x, y, z]) => [pos[0] + c * x + s * z, y, pos[2] - s * x + c * z]
        const board2 = (p) => yawWorld(vec('BOARD2_POS'), num('BOARD2_C'), num('BOARD2_S'), p)
        const table = (p) => yawWorld(vec('TABLE_POS'), num('TABLE_C'), num('TABLE_S'), p)
        const crate = (p) => yawWorld(vec('CANDLE_TABLE_POS'), num('BOARD2_C'), num('BOARD2_S'), p)
        const candleC = vec('CANDLE_C'), crateH = num('CRATE_H'), flameY = num('FLAME_Y'), flameH = num('FLAME_H')
        const halfW = num('BOARD_HALF_W'), y0 = num('BOARD_Y0'), y1 = y0 + num('BOARD_H')
        const [recX, recZ] = vec('REC_C'), recY = num('REC_Y')
        // A 12" sleeve standing on the floor, leaning back against the box's right side (+x in
        // the box's frame), a little towards the front. Nothing is rendered there: the site draws
        // the cover of what's playing onto it.
        const sleeve = 0.314, lean = (14 * Math.PI) / 180, sleeveZ = -0.02, sideX = num('BOX_HW') + 0.004
        const sleeveTopY = sleeve * Math.cos(lean), sleeveFootX = sideX + sleeve * Math.sin(lean)
        const round = (p) => p.map((v) => +v.toFixed(4))
        const anchors = {
          // the music board's writing surface, as seen from the front: top left, top right, bottom right, bottom left
          musicBoard: [[-halfW, y1, -0.016], [halfW, y1, -0.016], [halfW, y0, -0.016], [-halfW, y0, -0.016]].map((p) => round(board2(p))),
          // the middle of the record's top
          record: round(table([recX, recY, recZ])),
          // the sleeve's front, seen from the front: top left, top right, bottom right, bottom left
          albumCover: [
            [sideX, sleeveTopY, sleeveZ - sleeve / 2],
            [sideX, sleeveTopY, sleeveZ + sleeve / 2],
            [sleeveFootX, 0, sleeveZ + sleeve / 2],
            [sleeveFootX, 0, sleeveZ - sleeve / 2],
          ].map((p) => round(table(p))),
          // the patch of floor its shadow falls on, from the box's side out past its foot, same order
          albumShadow: [
            [sideX, 0, sleeveZ - sleeve / 2 - 0.04],
            [sideX, 0, sleeveZ + sleeve / 2 + 0.04],
            [sleeveFootX + 0.12, 0, sleeveZ + sleeve / 2 + 0.04],
            [sleeveFootX + 0.12, 0, sleeveZ - sleeve / 2 - 0.04],
          ].map((p) => round(table(p))),
          // the middle of the candle's flame, where its light comes from
          candle: round(crate([candleC[0], crateH + flameY + 0.4 * flameH, candleC[1]])),
          // the corners of everything in the music corner: the box and player, the board on its stand, and the candle on its crate
          musicCorner: [
            ...boxCorners([-0.3, 0, -0.25], [0.3, 0.68, 0.25]).map(table),
            ...boxCorners([-1.15, 0, -0.33], [1.15, 1.98, 0.33]).map(board2),
            ...boxCorners([-0.18, 0, -0.16], [0.18, crateH + num('JAR_H') + 0.03, 0.16]).map(crate),
          ].map(round),
        }
        // the candle's patch in the loops: the top of its crate, the jar and the flame, wherever it sways
        const candleBox = (() => {
          const pts = boxCorners([-0.17, crateH - 0.02, -0.15], [0.17, crateH + flameY + 1.3 * flameH, 0.15]).map(crate)
          return boxCorners([0, 1, 2].map((i) => Math.min(...pts.map((p) => p[i]))), [0, 1, 2].map((i) => Math.max(...pts.map((p) => p[i]))))
        })()
        const recordBox = (() => {
          const pts = boxCorners([recX - 0.16, 0.59, recZ - 0.16], [recX + 0.16, recY + 0.015, recZ + 0.16]).map(table)
          return boxCorners([0, 1, 2].map((i) => Math.min(...pts.map((p) => p[i]))), [0, 1, 2].map((i) => Math.max(...pts.map((p) => p[i]))))
        })()

        // Draw in horizontal bands so no single GPU command runs long enough to trip the
        // Windows driver watchdog (about 2 s, after which Chrome loses the context). How many
        // pixels a band can take depends on the view — close up, most rays hit the detailed
        // things — so the band size follows how long the last band took. Accumulates spp light
        // paths per pixel over a rectangle of the frame (GL coordinates, y up) and returns the
        // target holding the sums; the rest of both targets is left alone, which is what lets
        // a loop frame redo just patches.
        let current = 0
        let bandPixels = 100000
        const accumulate = async (x0, y0, w, h, spp) => {
          gl.enable(gl.SCISSOR_TEST)
          gl.scissor(x0, y0, w, h)
          for (const target of targets) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb)
            gl.clear(gl.COLOR_BUFFER_BIT)
          }
          for (let frame = 0; frame < spp; frame++) {
            const src = targets[current]
            const dst = targets[1 - current]
            gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb)
            gl.activeTexture(gl.TEXTURE4)
            gl.bindTexture(gl.TEXTURE_2D, src.tex[1])
            gl.activeTexture(gl.TEXTURE0)
            gl.bindTexture(gl.TEXTURE_2D, src.tex[0])
            gl.uniform1i(uFrame, frame)
            for (let b0 = y0; b0 < y0 + h; ) {
              const rows = Math.max(1, Math.min(y0 + h - b0, Math.floor(bandPixels / w)))
              gl.scissor(x0, b0, w, rows)
              const began = performance.now()
              gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4)
              gl.finish()
              const ms = performance.now() - began
              if (ms > 200) bandPixels = Math.max(4000, bandPixels / 2)
              else if (ms < 50) bandPixels = Math.min(4000000, bandPixels * 1.2)
              b0 += rows
            }
            current = 1 - current
            if (frame % 8 === 0) await new Promise((r) => setTimeout(r, 0))
          }
          gl.disable(gl.SCISSOR_TEST)
          return targets[current]
        }
        // reads a rectangle of both sums (GL coordinates) out of the target accumulate returned
        const readSums = (target, x, y, w, h) => {
          const sums = [0, 1].map((k) => {
            const data = new Float32Array(w * h * 4)
            gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb)
            gl.readBuffer(gl.COLOR_ATTACHMENT0 + k)
            gl.readPixels(x, y, w, h, gl.RGBA, gl.FLOAT, data)
            return data
          })
          const error = gl.getError()
          if (error) throw new Error(`GL error ${error}`)
          return sums
        }
        const renderFull = async (spp) => readSums(await accumulate(0, 0, W, H, spp), 0, 0, W, H)

        // ---- film look ----
        // How strong the candle is and what colour its flame looks. Everything the candle adds is
        // decided here rather than in the shader, so it can be tuned (studio.grade) without
        // rendering again, and so it can flicker frame by frame over the same samples.
        const grade = {
          candle: 22, // the candle's light
          flame: 1.0, // the flame seen straight on
          flameRGB: [1.0, 0.7, 0.32],
          halo: 0.5, // the glow round the flame
          debugCandleOnly: false, // leave out the tubes' light, to see just the candle's
        }

        // Flip to top-down rows, average the samples and mix the lights: the tubes' light as it
        // is, the candle's scaled by its strength at time t; the flame on its own.
        const mix = ([base, candle], spp, t) => {
          const rgb = new Float32Array(W * H * 3), flame = new Float32Array(W * H)
          const k = (grade.candle * flicker(t)) / spp, f = (grade.flame * flicker(t)) / spp
          const b = grade.debugCandleOnly ? 0 : 1 / spp
          for (let y = 0; y < H; y++) {
            for (let x = 0; x < W; x++) {
              const s = (y * W + x) * 4, i = (H - 1 - y) * W + x
              rgb[i * 3] = base[s] * b + candle[s] * k
              rgb[i * 3 + 1] = base[s + 1] * b + candle[s + 1] * k
              rgb[i * 3 + 2] = base[s + 2] * b + candle[s + 2] * k
              flame[i] = base[s + 3] * f
            }
          }
          return { rgb, flame }
        }

        // the exposure that puts the median pixel in the mid-tones, whatever the light levels
        // (judged on the tubes' light alone, so the candle's strength never moves it)
        const autoExposure = ([base]) => {
          const lum = new Float32Array(Math.ceil((W * H) / 7))
          for (let i = 0, j = 0; i < W * H; i += 7, j++) lum[j] = 0.2126 * base[i * 4] + 0.7152 * base[i * 4 + 1] + 0.0722 * base[i * 4 + 2]
          const median = lum.sort()[Math.floor(lum.length * 0.5)] / SPP
          return median > 0 ? 0.34 / median : 1
        }

        // Everything after exposure — firefly clamp, bloom, tone curve, vignette, grain — the
        // same for every still and every video frame (the grain's seed included, so the grain
        // sits still instead of crawling, which also keeps the videos small). Each colour channel
        // gets the same curve, so a grey pixel comes out exactly as the black-and-white look had it.
        const filmLook = ({ rgb, flame }, exposure) => {
          const n = W * H
          for (let i = 0; i < 3 * n; i++) rgb[i] *= exposure
          const lum = (i) => 0.2126 * rgb[i * 3] + 0.7152 * rgb[i * 3 + 1] + 0.0722 * rgb[i * 3 + 2]

          // Fireflies: a lone pixel far brighter than everything around it is noise, not
          // detail (real highlights like the tubes are big blobs), so pull it down.
          const luma = new Float32Array(n)
          for (let i = 0; i < n; i++) luma[i] = lum(i)
          for (let y = 1; y < H - 1; y++) {
            for (let x = 1; x < W - 1; x++) {
              const i = y * W + x
              let around = 0
              for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                  if (dx || dy) around = Math.max(around, luma[i + dy * W + dx])
                }
              }
              if (luma[i] > 2 * around + 0.05) {
                const k = around / luma[i]
                rgb[i * 3] *= k
                rgb[i * 3 + 1] *= k
                rgb[i * 3 + 2] *= k
              }
            }
          }
          // The flame goes in after that: it's a few pixels across and far brighter than what's
          // round it, which is just what the clamp would take for a firefly.
          for (let i = 0; i < n; i++) {
            if (flame[i] === 0) continue
            for (let c = 0; c < 3; c++) rgb[i * 3 + c] += flame[i] * exposure * grade.flameRGB[c]
          }

          const scale = W / 2400
          const channel = (c) => {
            const out = new Float32Array(n)
            for (let i = 0; i < n; i++) out[i] = rgb[i * 3 + c]
            return out
          }
          const bloom = [0, 1, 2].map((c) => {
            const bright = channel(c)
            for (let i = 0; i < n; i++) bright[i] = Math.min(Math.max(bright[i] - 1.2, 0), 12)
            return [blur(bright, W, H, Math.max(1, Math.round(5 * scale))), blur(bright, W, H, Math.max(2, Math.round(32 * scale)))]
          })
          // a candle flame in a photo wears a soft halo much wider than itself
          const glow = new Float32Array(n)
          for (let i = 0; i < n; i++) glow[i] = Math.min(flame[i] * exposure, 40)
          const halo = blur(glow, W, H, Math.max(2, Math.round(18 * scale)))

          const out = document.createElement('canvas')
          out.width = W
          out.height = H
          const ctx = out.getContext('2d')
          const image = ctx.createImageData(W, H)
          let seed = 12345
          const random = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff)
          for (let y = 0; y < H; y++) {
            for (let x = 0; x < W; x++) {
              const i = y * W + x
              const dx = (x / W) * 2 - 1
              const dy = (y / H) * 2 - 1
              const vignette = 1 - 0.3 * Math.min(1, (dx * dx + dy * dy) / 2)
              const grain = (random() + random() - 1) * 0.03
              const p = i * 4
              for (let c = 0; c < 3; c++) {
                let v = rgb[i * 3 + c] + 0.35 * bloom[c][0][i] + 0.12 * bloom[c][1][i] + grade.halo * halo[i] * grade.flameRGB[c] * CANDLE_RGB[c]
                v = (v * (2.51 * v + 0.03)) / (v * (2.43 * v + 0.59) + 0.14) // ACES-style tone curve
                v = Math.min(Math.max(v, 0), 1)
                v = v + 0.45 * (v * v * (3 - 2 * v) - v) // more contrast: inky ceiling, chalky walls
                v = Math.pow(v, 1 / 2.2)
                v *= vignette
                v += grain
                image.data[p + c] = Math.round(Math.min(Math.max(v, 0), 1) * 255)
              }
              image.data[p + 3] = 255
            }
          }
          ctx.putImageData(image, 0, 0)
          return out
        }

        // The last still, which loop frames are built on: its camera, moment, samples and exposure.
        let still = null

        return {
          // what render.mjs needs to know besides the pictures; the candle's numbers are for the
          // site, which lights its own things by the same candle
          info: () => ({
            gpu,
            loopSeconds: letters.loop,
            anchors,
            candle: {
              flicker: FLICKER,
              strength: grade.candle,
              soft: num('CANDLE_SOFT'),
              rgb: CANDLE_RGB,
              // the jar's rim (height, radius) and the heights its light comes from (see flamePoint), so the site can tell how much of the flame clears the rim
              jar: {
                rim: +(crateH + num('JAR_H')).toFixed(4),
                radius: num('JAR_R'),
                light: [0.2, 0.65].map((k) => +(crateH + flameY + k * flameH).toFixed(4)),
              },
            },
          }),

          // debug: change the grade (see grade above) for the stills and frames that follow
          grade(changes) {
            Object.assign(grade, changes)
            return grade
          },

          // debug: the last still again, with the grade as it is now
          regrade() {
            const { raw, time, exposure } = still
            return { jpeg: filmLook(mix(raw, SPP, time), exposure).toDataURL('image/jpeg', 0.9) }
          },

          // A still from camera ({ pos, target, fov }) at time t (seconds), at the page's spp,
          // with the given exposure or, if none, the automatic one. Also works out which
          // patches of the frame move in its loop: the letters and the record, where visible.
          async still({ camera, time = 0, exposure }) {
            const cam = lookAt(camera)
            setCamera(cam)
            const pose = setTime(time)
            const started = performance.now()
            const raw = await renderFull(SPP)
            const renderMs = Math.round(performance.now() - started)
            const auto = autoExposure(raw)
            const used = exposure ?? auto
            const patches = [boxCorners(pose.min, pose.max), recordBox, candleBox].map((corners) => screenRect(cam, corners)).filter(Boolean)
            still = { cam, time, raw, exposure: used, patches }
            return { camera: cam, exposure: used, autoExposure: auto, patches, renderMs, jpeg: filmLook(mix(raw, SPP, time), used).toDataURL('image/jpeg', 0.84) }
          },

          // Frame i of n of the still's seamless loop: only the patches that move are rendered
          // again, at that moment of the loop, and dropped into the still's samples before the
          // same film look — so everything outside them is the still's samples (same seeds, same
          // post) and their edges never show. The candle's light flickers over the whole frame,
          // which post does by scaling it.
          async loopFrame(i, n) {
            const { cam, time, raw, exposure, patches } = still
            const t = time + (letters.loop * i) / n
            setCamera(cam)
            setTime(t)
            for (const c of patches) {
              const sums = readSums(await accumulate(c.x, c.y, c.w, c.h, SPP), c.x, c.y, c.w, c.h)
              for (let k = 0; k < 2; k++) {
                for (let r = 0; r < c.h; r++) raw[k].set(sums[k].subarray(r * c.w * 4, (r + 1) * c.w * 4), ((c.y + r) * W + c.x) * 4)
              }
            }
            return filmLook(mix(raw, SPP, t), exposure).toDataURL('image/png')
          },

          // One whole frame of a walk: camera, time and exposure as for a still, at spp samples.
          async frame({ camera, time, spp = SPP, exposure }) {
            setCamera(lookAt(camera))
            setTime(time)
            return filmLook(mix(await renderFull(spp), spp, time), exposure).toDataURL('image/png')
          },

          // debug: the letters' distance field, mid-grey along the outlines, and where each letter ties on
          letters() {
            const c = document.createElement('canvas')
            c.width = letters.width
            c.height = letters.height
            const cx = c.getContext('2d')
            const img = cx.createImageData(letters.width, letters.height)
            for (let i = 0; i < letters.sdf.length; i++) {
              const byte = Math.round(Math.min(Math.max(0.5 - letters.sdf[i] / 64, 0), 1) * 255)
              img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = byte
              img.data[i * 4 + 3] = 255
            }
            cx.putImageData(img, 0, 0)
            return { layout: letters.pose(0).layout, jpeg: c.toDataURL('image/jpeg', 0.92) }
          },

          // debug: the chalk textures of the two boards
          board(writing = true) {
            return { jpeg: boardTexture({ writing }).toDataURL('image/jpeg', 0.92) }
          },
        }
      }

      window.studio = setup()
    </script>
  </body>
</html>
