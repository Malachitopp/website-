        z[1] = EDT_INF
        f[0] = grid[offset]
        for (let q = 1, k = 0, s = 0; q < length; q++) {
          f[q] = grid[offset + q * stride]
          const q2 = q * q
          do {
            const r = v[k]
            s = (f[q] - f[r] + q2 - r * r) / (q - r) / 2
          } while (s <= z[k] && --k > -1)
          k++
          v[k] = q
          z[k] = s
          z[k + 1] = EDT_INF
        }
        for (let q = 0, k = 0; q < length; q++) {
          while (z[k + 1] < q) k++
          const r = v[k]
          const qr = q - r
          grid[offset + q * stride] = f[r] + qr * qr
        }
      }

      // Reads a glyph's ink back out of the atlas to decide where its wire ties on. Hung from
      // the column through its centre of mass a letter hangs level, and the wire meets the
      // first ink down that column — the top of an o, the shoulder of an h (the i's dot is a
      // separate piece, so the wire passes through it to the stem). A letter open at the top
      // in the middle (the M) would put that tie deep in its notch, so it gets a bridle
      // instead: two legs from the end of the wire to the highest ink either side of the
      // column. Pixels are those of the glyph's rect in the atlas; rows count down from its top.
      function inkAnalysis(ctx, x0, y0, w, h) {
        const data = ctx.getImageData(x0, y0, w, h).data
        const piece = new Int32Array(w * h) // which connected piece of ink each pixel belongs to
        const sizes = [0]
        let sumX = 0, count = 0
        for (let i = 0; i < w * h; i++) {
          if (data[i * 4] <= 127) continue
          sumX += i % w
          count++
          if (piece[i]) continue
          const id = sizes.push(0) - 1
          const stack = [i]
          piece[i] = id
          while (stack.length) {
            const j = stack.pop()
            sizes[id]++
            for (const n of [j - w, j + w, j % w > 0 ? j - 1 : -1, j % w < w - 1 ? j + 1 : -1]) {
              if (n >= 0 && n < w * h && !piece[n] && data[n * 4] > 127) {
                piece[n] = id
                stack.push(n)
              }
            }
          }
        }
        const main = sizes.indexOf(Math.max(...sizes))
        const topOf = (x) => {
          // first row of the main piece down column x
          if (x >= 0 && x < w) for (let y = 0; y < h; y++) if (piece[y * w + x] === main) return y
          return Infinity
        }
        let top = Infinity, bottom = 0
        for (let i = 0; i < w * h; i++) if (piece[i] === main) { top = Math.min(top, Math.floor(i / w)); bottom = Math.floor(i / w) }
        const centre = Math.round(sumX / count)
        let col = centre
        for (let s = 1; topOf(col) === Infinity && s < w; s++) col = topOf(centre + s) < Infinity ? centre + s : centre - s
        let tieRow = topOf(col), legs = null
        if (tieRow - top > 0.4 * (bottom - top)) {
          const peak = (from, to, step) => {
            // the highest ink between two columns, at its point nearest the tie column
            let best = { x: from, y: Infinity }
            for (let x = from; x !== to; x += step) {
              const y = topOf(x)
              if (y < best.y) best = { x, y }
            }
            return best
          }
          legs = [peak(col - 1, -1, -1), peak(col + 1, w, 1)]
          tieRow = Math.min(legs[0].y, legs[1].y) - 0.42 * (legs[1].x - legs[0].x) // the ring, above the letter
        }
        return { col, tieRow, legs }
      }

      // The name hung from the tubes: one glyph per cell of an atlas that ends up holding
      // the signed distance to each outline (the shader extrudes and ray-marches it), plus
      // where and how each letter hangs (metres). Each word hangs from its own tube, the
      // two either side of the middle of the hall, pushed together as far as the gap between
      // the tubes allows. Every letter is tied on where its ink actually is (see inkAnalysis)
      // and gets its own twist on the wire, a small pendulum tilt and a little slack, so they
      // hang loosely rather than in a line; pose(t) then moves each of them a little for the
      // frames of the looping video. Michroma only comes in one weight, so the outline is
      // stroked to push it towards the sleeve's bold.
      function hangingLetters() {
        const fs = document.getElementById('fs').textContent
        const glsl = (name) => Number(fs.match(new RegExp(`const (?:float|int) ${name} = (-?[\\d.]+)`))[1])
        const TUBE_Y = glsl('TUBE_Y'), TUBE_HALF_LEN = glsl('TUBE_HALF_LEN'), COLS = glsl('COLS')
        const COL0 = glsl('COL0'), COL_STEP = glsl('COL_STEP'), ROW0 = glsl('ROW0'), ROW_STEP = glsl('ROW_STEP')

        const CAP_H = 0.45 // height of a capital
        const WIRE = 0.4 // from the tube down to the tallest letters
        // which row of tubes: the first inside the landscape frame; one further back for the
        // portrait frame, which is too narrow for the name at that row
        const ROW = ROW0 + Number(params.get('row') ?? 2) * ROW_STEP
        const inset = (COL_STEP - 2 * TUBE_HALF_LEN) / 2 + 0.08 // a wire this far from the hall's centre line is on a tube
        // per letter: twist about the wire, pendulum tilt back/forth and side to side (degrees), extra wire (m)
        const twist = [12, -8, 15, -11, 6, -14, 9, 13, -10, 4, -7]
        const swing = [3, -2.5, 4, -3.5, 1.5, -4, 2.5, 3.5, -3, 1, -2]
        const lean = [2, -1.5, 2.5, -2, 1, -2.5, 1.5, 2, -1.5, 0.5, -1]
        const slack = [0.02, -0.03, 0.04, -0.01, 0.03, -0.04, 0.01, -0.02, 0.03, -0.03, 0.02]
        // ...and how each one moves in the looping video: a slow turn on the wire (one cycle
        // per loop) and the pendulum swing of the wire itself (three, i.e. a 2 s period, about
        // right for wires this long), each letter with its own phases and vigour so they are
        // never in step. Whole cycles per LOOP make the loop seamless.
        const LOOP = 6 // seconds
        const phase = [[0.3, 1.1, 2.4], [2.1, 4.0, 0.2], [4.4, 2.5, 3.9], [1.2, 5.8, 1.0], [5.5, 0.4, 5.3], [3.3, 3.6, 2.0], [0.9, 1.9, 4.7], [2.8, 5.1, 0.6], [4.9, 2.2, 3.4], [1.7, 0.8, 5.9], [3.9, 4.5, 1.5]] // twist, swing, lean (rad)
        const vigour = [1, 0.8, 1.2, 0.9, 1.1, 0.7, 1.3, 0.9, 1, 1.2, 0.8]

        const px = 300, tracking = 0.06 * px, cell = 512, cols = 4
        const words = 'Malachi Topp'.split(' ')
        const count = words.join('').length
        if (count !== glsl('LETTER_N')) throw new Error(`LETTER_N in the shader must be ${count}`)
        const atlas = document.createElement('canvas')
        atlas.width = cell * cols
        atlas.height = cell * Math.ceil(count / cols)
        const ctx = atlas.getContext('2d')
        ctx.fillStyle = '#000'
        ctx.fillRect(0, 0, atlas.width, atlas.height)
        ctx.font = `${px}px Michroma`
        ctx.textAlign = 'left'
        ctx.textBaseline = 'alphabetic'
        ctx.fillStyle = ctx.strokeStyle = '#fff'
        ctx.lineJoin = 'round'
        ctx.lineWidth = px * 0.05
        const pad = ctx.lineWidth / 2 + 1 // the stroke sits outside the measured ink
        const scale = CAP_H / ctx.measureText('M').actualBoundingBoxAscent

        // draw each glyph into its cell — its rect there is the measured ink plus the pad all
        // round — and read back where its wire should tie on
        let k = 0
        const glyphs = words.map((word) => {
          let pen = 0
          return [...word].map((ch) => {
            const m = ctx.measureText(ch)
            const halfW = (m.actualBoundingBoxRight + m.actualBoundingBoxLeft) / 2 + pad
            const ascent = m.actualBoundingBoxAscent + pad, descent = m.actualBoundingBoxDescent + pad
            const w = Math.ceil(2 * halfW) + 1, h = Math.ceil(ascent + descent) + 1
            const boxL = Math.round((k % cols) * cell + cell / 2 - halfW)
            const boxT = Math.round(Math.floor(k / cols) * cell + cell / 2 - (ascent + descent) / 2)
            ctx.strokeText(ch, boxL + pad + m.actualBoundingBoxLeft, boxT + ascent)
            ctx.fillText(ch, boxL + pad + m.actualBoundingBoxLeft, boxT + ascent)
            const ink = inkAnalysis(ctx, boxL, boxT, w, h)
            // the tie column in the word's own coordinates: the glyph's origin sits pad + left in from its rect
            const glyph = { ch, k: k++, boxL, boxT, w, h, ascent, ...ink, tiePx: pen + ink.col - pad - m.actualBoundingBoxLeft }
            pen += m.width + tracking
            return glyph
          })
        })
        const [first, second] = glyphs
        const starts = [-inset - first[first.length - 1].tiePx * scale, inset - second[0].tiePx * scale]
        const baseline = TUBE_Y - WIRE - CAP_H

        const rad = (deg) => (deg * Math.PI) / 180
        const rotX = (a) => [[1, 0, 0], [0, Math.cos(a), -Math.sin(a)], [0, Math.sin(a), Math.cos(a)]]
        const rotY = (a) => [[Math.cos(a), 0, Math.sin(a)], [0, 1, 0], [-Math.sin(a), 0, Math.cos(a)]]
        const rotZ = (a) => [[Math.cos(a), -Math.sin(a), 0], [Math.sin(a), Math.cos(a), 0], [0, 0, 1]]
        const mul = (A, B) => A.map((row) => B[0].map((_, j) => row.reduce((sum, a, k) => sum + a * B[k][j], 0)))
        const columnMajor = (M) => [0, 1, 2].flatMap((j) => [M[0][j], M[1][j], M[2][j]])

        // The pose at time t (seconds into the loop; 0 is the still): where each letter hangs
        // and how it is turned. Each angle wobbles about its resting value by a sine that
        // starts at zero, so frame 0 of the video is exactly the still.
        const pose = (t = 0) => {
          const wobble = (rest, amp, cycles, ph) => rest + amp * (Math.sin((2 * Math.PI * cycles * t) / LOOP + ph) - Math.sin(ph))
          const hang = [], size = [], uv = [], rot = [], legs = [], layout = []
          const min = [Infinity, Infinity, ROW - 0.35], max = [-Infinity, TUBE_Y + 0.01, ROW + 0.35]
          glyphs.forEach((word, w) => {
            for (const g of word) {
              const x = starts[w] + g.tiePx * scale
              if (![...Array(COLS).keys()].some((c) => Math.abs(x - (COL0 + c * COL_STEP)) <= TUBE_HALF_LEN))
                throw new Error(`"${g.ch}" would hang at x = ${x.toFixed(2)}, between tubes`)
              // the wire runs from the tube down to the glyph's tie row (the rect's row 0 is at
              // baseline + ascent); the card is then placed around that point
              const wire = TUBE_Y - (baseline + (g.ascent - g.tieRow) * scale) + slack[g.k]
              const hw = (g.w / 2) * scale, hh = g.h * scale
              const cx = (g.w / 2 - g.col) * scale, top = g.tieRow * scale - wire
              hang.push(x, TUBE_Y, ROW, wire)
              size.push(hw, hh, cx, top)
              uv.push(g.boxL / atlas.width, g.boxT / atlas.height, (g.boxL + g.w) / atlas.width, (g.boxT + g.h) / atlas.height)
              const bury = 0.015 / scale // px: the legs' ends sit inside the board
              legs.push(...(g.legs ? g.legs.flatMap((leg) => [(leg.x - g.col) * scale, top - (leg.y + bury) * scale]) : [0, 0, 0, 0]))
              // twist about the wire first, then the pendulum tilt of wire and letter together
              const [ph1, ph2, ph3] = phase[g.k], v = vigour[g.k]
              const turn = wobble(twist[g.k], 5 * v, 1, ph1), pitch = wobble(swing[g.k], 2 * v, 3, ph2), roll = wobble(lean[g.k], 1.2 * v, 3, ph3)
              rot.push(...columnMajor(mul(mul(rotX(rad(pitch)), rotZ(rad(roll))), rotY(rad(turn)))))
              // the box is padded to hold the letter wherever the loop takes it
              min[0] = Math.min(min[0], x + cx - hw - 0.25)
              max[0] = Math.max(max[0], x + cx + hw + 0.25)
              min[1] = Math.min(min[1], TUBE_Y + top - hh - 0.15)
              layout.push({ ch: g.ch, x: +x.toFixed(3), wire: +wire.toFixed(3), tie: g.legs ? 'bridle' : `row ${g.tieRow} of ${g.h}`, angles: [turn, pitch, roll].map((a) => +a.toFixed(1)) })
            }
          })
          return { hang, size, uv, rot, legs, min, max, layout }
        }

        // signed distance to the outlines (atlas px, positive outside), from the
        // anti-aliased mask: an exact distance transform of the outside and of the inside
        const aw = atlas.width, ah = atlas.height
        const mask = ctx.getImageData(0, 0, aw, ah).data
        const outer = new Float64Array(aw * ah), inner = new Float64Array(aw * ah)
        for (let i = 0; i < aw * ah; i++) {
          const a = mask[i * 4] / 255
          outer[i] = a === 1 ? 0 : a === 0 ? EDT_INF : Math.max(0, 0.5 - a) ** 2
          inner[i] = a === 1 ? EDT_INF : a === 0 ? 0 : Math.max(0, a - 0.5) ** 2
        }
        edt(outer, aw, ah)
        edt(inner, aw, ah)
        const sdf = new Float32Array(aw * ah)
        for (let i = 0; i < aw * ah; i++) sdf[i] = Math.sqrt(outer[i]) - Math.sqrt(inner[i])
        return { sdf, width: aw, height: ah, scale, loop: LOOP, pose }
      }

      // ---- cameras ----
      const sub = (a, b) => a.map((v, i) => v - b[i])
      const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2]
      const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]
      const normalize = (a) => a.map((v) => v / Math.hypot(...a))

      // A camera as the shader uses it, from where it stands, a point it looks at and its
      // vertical field of view: each pixel's ray runs along fwd + x·right + y·up, with y from
      // -tanY to tanY across the frame and x the same times the aspect ratio. No roll.
      function lookAt({ pos, target, fov }) {
        const fwd = normalize(sub(target, pos))
        const right = normalize(cross([0, 1, 0], fwd))
        return { pos, right, up: cross(fwd, right), fwd, tanY: Math.tan((fov * Math.PI) / 360) }
      }

      // The rectangle of GL pixels (y up), padded by a margin, that a world-space box (its 8
      // corners, as from boxCorners) covers in the frame; null if none of it is in view. The
      // part of the box in front of the camera is what gets projected: its corners there, plus
      // where its edges cross the near plane.
      function screenRect(cam, corners) {
        const NEAR = 0.05
        const depth = corners.map((p) => dot(sub(p, cam.pos), cam.fwd))
        const points = corners.filter((_, i) => depth[i] >= NEAR)
        for (let i = 0; i < 8; i++) {
          for (const j of [i | 1, i | 2, i | 4]) {
            if (j !== i && (depth[i] < NEAR) !== (depth[j] < NEAR)) {
              const k = (NEAR - depth[i]) / (depth[j] - depth[i])
              points.push(corners[i].map((v, a) => v + (corners[j][a] - v) * k))
            }
          }
        }
        let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity
        for (const p of points) {
          const v = sub(p, cam.pos)
          const z = Math.max(NEAR, dot(v, cam.fwd))
          const sx = ((dot(v, cam.right) / (z * cam.tanY * (W / H))) * 0.5 + 0.5) * W
          const sy = ((dot(v, cam.up) / (z * cam.tanY)) * 0.5 + 0.5) * H
          x0 = Math.min(x0, sx)
          x1 = Math.max(x1, sx)
          y0 = Math.min(y0, sy)
          y1 = Math.max(y1, sy)
        }
        if (!points.length) return null
        const margin = Math.max(8, Math.round((40 * W) / 2400))
        const x = Math.max(0, Math.floor(x0) - margin), y = Math.max(0, Math.floor(y0) - margin)
        const w = Math.min(W, Math.ceil(x1) + margin) - x, h = Math.min(H, Math.ceil(y1) + margin) - y
        return w > 0 && h > 0 ? { x, y, w, h } : null
      }

      const boxCorners = (min, max) => [0, 1, 2, 3, 4, 5, 6, 7].map((i) => [i & 1 ? max[0] : min[0], i & 2 ? max[1] : min[1], i & 4 ? max[2] : min[2]])

      // ---- rendering ----
      // Everything is set up once; render.mjs then drives the page through window.studio:
      // stills, loop frames and walk frames from whatever camera it asks for.
      async function setup() {
        if ((await document.fonts.load('300px Michroma')).length === 0) throw new Error('Michroma did not load')
        const fs = document.getElementById('fs').textContent
        // scene constants the JS needs, read out of the shader so the two can't drift
        const num = (name) => Number(fs.match(new RegExp(`\\b${name} = (-?[\\d.]+)`))[1])
        const vec = (name) => fs.match(new RegExp(`\\b${name} = vec[23]\\(([^)]*)\\)`))[1].split(',').map(Number)
        // a const array of vectors (CANVAS_POS and the like), as a list of number arrays
        const list = (name) => {
          const body = fs.match(new RegExp(`\\b${name}\\[[^\\]]*\\] = vec[234]\\[[^\\]]*\\]\\(([\\s\\S]*?)\\);`))[1]
          return [...body.matchAll(/vec[234]\(([^)]*)\)/g)].map((m) => m[1].split(',').map(Number))
        }
        const CANDLE_RGB = vec('CANDLE_RGB')

        const canvas = document.getElementById('out')
        const gl = canvas.getContext('webgl2', { antialias: false })
        if (!gl.getExtension('EXT_color_buffer_float')) throw new Error('no float render targets')
        const info = gl.getExtension('WEBGL_debug_renderer_info')
        const gpu = info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : 'unknown'

        const program = gl.createProgram()
        gl.attachShader(program, compile(gl, gl.VERTEX_SHADER, document.getElementById('vs').textContent))
        gl.attachShader(program, compile(gl, gl.FRAGMENT_SHADER, fs))
        gl.linkProgram(program)
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program))
        gl.useProgram(program)
        const uniform = (name) => gl.getUniformLocation(program, name)

        const quad = gl.createBuffer()
        gl.bindBuffer(gl.ARRAY_BUFFER, quad)
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW)
        const aPos = gl.getAttribLocation(program, 'aPos')
        gl.enableVertexAttribArray(aPos)
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0)

        // two ping-pong targets, each with three float textures: the tubes' light (0), and each
        // candle's light with its flame (1, 2)
        gl.clearColor(0, 0, 0, 0)
        const targets = [0, 1].map(() => {
          const fb = gl.createFramebuffer()
          gl.bindFramebuffer(gl.FRAMEBUFFER, fb)
          const tex = [0, 1, 2].map((k) => {
            const t = gl.createTexture()
            gl.bindTexture(gl.TEXTURE_2D, t)
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, W, H, 0, gl.RGBA, gl.FLOAT, null)
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST)
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST)
            gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + k, gl.TEXTURE_2D, t, 0)
            return t
          })
          gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1, gl.COLOR_ATTACHMENT2])
          if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error('float render target incomplete')
          gl.clear(gl.COLOR_BUFFER_BIT)
          return { tex, fb }
        })

        const texture = (unit, name, source) => {
          const tex = gl.createTexture()
          gl.activeTexture(gl.TEXTURE0 + unit)
          gl.bindTexture(gl.TEXTURE_2D, tex)
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source)
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR)
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR)
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
          gl.uniform1i(uniform(name), unit)
        }
        texture(1, 'uBoard', boardTexture())
        texture(3, 'uBoard2', boardTexture({ writing: false }))
        texture(5, 'uLabel', labelTexture())
        texture(6, 'uScreen', screenTexture())
        texture(7, 'uPaper', paperTexture())

        const letters = hangingLetters()
        const lettersTex = gl.createTexture()
        gl.activeTexture(gl.TEXTURE2)
        gl.bindTexture(gl.TEXTURE_2D, lettersTex)
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, letters.width, letters.height, 0, gl.RED, gl.FLOAT, letters.sdf)
        // a float field only filters smoothly with the extension; nearest still works, just steppier sides
        const sdfFilter = gl.getExtension('OES_texture_float_linear') ? gl.LINEAR : gl.NEAREST
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, sdfFilter)
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, sdfFilter)
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE)
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE)
        gl.uniform1i(uniform('uLetters'), 2)
        gl.uniform1f(uniform('uLetterScale'), letters.scale)
        gl.activeTexture(gl.TEXTURE0)

        gl.viewport(0, 0, W, H)
        gl.uniform2f(uniform('uRes'), W, H)
        gl.uniform1i(uniform('uPrev'), 0)
        gl.uniform1i(uniform('uPrevCandle'), 4)
        gl.uniform1i(uniform('uPrevCandle2'), 8)
        const uFrame = uniform('uFrame')

        // The record turns 3 times per loop (30 rpm, near enough to 33⅓) so the loop is seamless.
        const SPIN_REVS = 3
        // The candles breathe: each one's light over time is 1 plus a few sines, each a whole
        // number of cycles per loop so the loops stay seamless ([amplitude, cycles per loop,
        // phase]); the second candle has the same sines at other phases, so the two never flicker
        // in step. Post scales each candle's light by its own; a flame stretches with it and its
        // tip wanders. The site reads the first candle's numbers to flicker the light it adds to
        // its own things (the prints, the album cover).
        const FLICKER = [[0.045, 2, 0.4], [0.03, 5, 2.1], [0.024, 11, 4.4], [0.018, 17, 1.3], [0.012, 29, 5.2]]
        const FLICKERS = [FLICKER, FLICKER.map(([amp, cycles, phase]) => [amp, cycles, (phase + 2.7) % (2 * Math.PI)])]
        const flicker = (t, i = 0) => 1 + FLICKERS[i].reduce((sum, [amp, cycles, phase]) => sum + amp * Math.sin((2 * Math.PI * cycles * t) / letters.loop + phase), 0)
        const wave = (t, cycles, phase) => Math.sin((2 * Math.PI * cycles * t) / letters.loop + phase)
        // Everything that moves, at t seconds: the letters' pose (see hangingLetters), the
        // record's angle, the flames, and the dog's ribs (two slow breaths per loop, as a dog
        // asleep breathes). Returns the letters' box, which already covers their whole swing.
        const setTime = (t) => {
          gl.uniform4fv(uniform('uFlame'), [
            0.0011 * wave(t, 3, 1.0) + 0.0005 * wave(t, 7, 2.5), 0.0008 * wave(t, 4, 0.3), 1 + 0.8 * (flicker(t, 0) - 1), 0,
            0.001 * wave(t, 4, 2.2) + 0.0005 * wave(t, 9, 0.7), 0.0009 * wave(t, 3, 3.9), 1 + 0.8 * (flicker(t, 1) - 1), 0,
          ])
          gl.uniform1f(uniform('uBreath'), 1 + 0.045 * wave(t, 2, 0))
          const p = letters.pose(((t % letters.loop) + letters.loop) % letters.loop)
          gl.uniform4fv(uniform('uLetterHang'), p.hang)
          gl.uniform4fv(uniform('uLetterSize'), p.size)
          gl.uniform4fv(uniform('uLetterUV'), p.uv)
          gl.uniformMatrix3fv(uniform('uLetterRot'), false, p.rot)
          gl.uniform4fv(uniform('uLetterLegs'), p.legs)
          gl.uniform3fv(uniform('uLetterMin'), p.min)
          gl.uniform3fv(uniform('uLetterMax'), p.max)
          gl.uniform1f(uniform('uSpin'), (2 * Math.PI * SPIN_REVS * t) / letters.loop)
          return p
        }
        const setCamera = (cam) => {
          gl.uniform3fv(uniform('uCamPos'), cam.pos)
          gl.uniform3fv(uniform('uCamRight'), cam.right)
          gl.uniform3fv(uniform('uCamUp'), cam.up)
          gl.uniform3fv(uniform('uCamFwd'), cam.fwd)
          gl.uniform1f(uniform('uTanY'), cam.tanY)
        }

        // Points in the scene the site pins its live overlays to, and the box the record's
        // moving parts sit in (for the loops' patches), in world metres.
        const yawWorld = (pos, c, s, [x, y, z]) => [pos[0] + c * x + s * z, y, pos[2] - s * x + c * z]
        const board2 = (p) => yawWorld(vec('BOARD2_POS'), num('BOARD2_C'), num('BOARD2_S'), p)
        const table = (p) => yawWorld(vec('TABLE_POS'), num('TABLE_C'), num('TABLE_S'), p)
        const crate = (p) => yawWorld(vec('CANDLE_TABLE_POS'), num('BOARD2_C'), num('BOARD2_S'), p)
        const sofa = (p) => yawWorld(vec('SOFA_POS'), num('SOFA_C'), num('SOFA_S'), p)
        const desk = (p) => yawWorld(vec('DESK_POS'), num('DESK_C'), num('DESK_S'), p)
        const candleC = vec('CANDLE_C'), crateH = num('CRATE_H'), flameY = num('FLAME_Y'), flameH = num('FLAME_H')
        const deskJar = vec('DESK_JAR'), deskH = num('DESK_H'), jarH = num('JAR_H')
        const headC = vec('HEAD_C')
        // the laptop's lid, from the crate's frame: a point x across the lid, v up it from the hinge
        const lapC = vec('LAP_C'), lapT = num('LAP_T'), hingeZ = num('HINGE_Z'), lidC = num('LID_C'), lidS = num('LID_S')
        const lapHW = num('LAP_HW'), lidH = num('LID_H'), bezelX = num('BEZEL_X'), bezelLo = num('BEZEL_LO'), bezelHi = num('BEZEL_HI')
        const lid = (x, v) => desk([lapC[0] + x, deskH + lapT + lidC * v, lapC[1] + hingeZ + lidS * v])
        // where each candle's flame is: the jars' frames in the world (see jarOrigin in the shader)
        const jars = [crate([candleC[0], crateH, candleC[1]]), desk([deskJar[0], deskH, deskJar[1]])]
        // The art corner. The easel's canvas is the one the site hangs my paintings on: it stands
        // on the ledge and leans back with the mast, so a point v up its face and u across it is at
        // (u, base + v·cos(lean), z + v·sin(lean)) in the corner's frame — the same maths as
        // canvasLocal in the shader, the other way round.
        const art = (p) => yawWorld(vec('ART_POS'), num('ART_C'), num('ART_S'), p)
        const artBox = vec('ART_BOX'), leanC = num('EASEL_LEAN_C'), leanS = num('EASEL_LEAN_S')
        const canvas0 = list('CANVAS_POS')[0], form0 = list('CANVAS_FORM')[0]
        const canvasFace = (u, v) => art([canvas0[0] + u * 0.5 * form0[1], canvas0[1] + v * form0[2] * leanC, canvas0[2] + v * form0[2] * leanS])
        const halfW = num('BOARD_HALF_W'), y0 = num('BOARD_Y0'), y1 = y0 + num('BOARD_H')
        const [recX, recZ] = vec('REC_C'), recY = num('REC_Y')
        // A 12" sleeve standing on the floor, leaning back against the box's right side (+x in
        // the box's frame), a little towards the front. Nothing is rendered there: the site draws
        // the cover of what's playing onto it.
        const sleeve = 0.314, lean = (14 * Math.PI) / 180, sleeveZ = -0.02, sideX = num('BOX_HW') + 0.004
        const sleeveTopY = sleeve * Math.cos(lean), sleeveFootX = sideX + sleeve * Math.sin(lean)
        const round = (p) => p.map((v) => +v.toFixed(4))
        const anchors = {
          // the music board's writing surface, as seen from the front: top left, top right, bottom right, bottom left
          musicBoard: [[-halfW, y1, -0.016], [halfW, y1, -0.016], [halfW, y0, -0.016], [-halfW, y0, -0.016]].map((p) => round(board2(p))),
          // the middle of the record's top
          record: round(table([recX, recY, recZ])),
          // the sleeve's front, seen from the front: top left, top right, bottom right, bottom left
          albumCover: [
            [sideX, sleeveTopY, sleeveZ - sleeve / 2],
            [sideX, sleeveTopY, sleeveZ + sleeve / 2],
            [sleeveFootX, 0, sleeveZ + sleeve / 2],
            [sleeveFootX, 0, sleeveZ - sleeve / 2],
          ].map((p) => round(table(p))),
          // the patch of floor its shadow falls on, from the box's side out past its foot, same order
          albumShadow: [
            [sideX, 0, sleeveZ - sleeve / 2 - 0.04],
            [sideX, 0, sleeveZ + sleeve / 2 + 0.04],
            [sleeveFootX + 0.12, 0, sleeveZ + sleeve / 2 + 0.04],
            [sleeveFootX + 0.12, 0, sleeveZ - sleeve / 2 - 0.04],
          ].map((p) => round(table(p))),
          // the corners of everything in the music corner: the box and player, the board on its stand, and the candle on its crate
          musicCorner: [
            ...boxCorners([-0.3, 0, -0.25], [0.3, 0.68, 0.25]).map(table),
            ...boxCorners([-1.15, 0, -0.33], [1.15, 1.98, 0.33]).map(board2),
            ...boxCorners([-0.18, 0, -0.16], [0.18, crateH + jarH + 0.03, 0.16]).map(crate),
          ].map(round),
          // the corners of the box round the sofa and the dog (nothing on the site uses them yet: for a hotspot one day)
          sofa: boxCorners([-0.84, 0, -0.47], [0.84, 0.92, 0.48]).map(sofa).map(round),
          // the top of the dog's head, where his Zs would rise from
          dogHead: round(sofa([headC[0], headC[1] + 0.07, headC[2]])),
          // the laptop's screen (inside the bezel), seen from the front: top left, top right, bottom right, bottom left
          laptopScreen: [
            lid(-lapHW + bezelX, lidH - bezelHi),
            lid(lapHW - bezelX, lidH - bezelHi),
            lid(lapHW - bezelX, bezelLo),
            lid(-lapHW + bezelX, bezelLo),
          ].map(round),
          // the corners of the box round the work station: the crate with the laptop and candle on it, and the papers round its feet
          workstation: boxCorners([-0.6, 0, -0.8], [0.68, deskH + 0.24, 0.24]).map(desk).map(round),
          // the blank canvas on the easel, seen from the front: top left, top right, bottom right,
          // bottom left, like the boards. The site hangs my paintings on it.
          easelCanvas: [canvasFace(-1, 1), canvasFace(1, 1), canvasFace(1, 0), canvasFace(-1, 0)].map(round),
          // the corners of the box round the art corner: the easel, the canvases stacked just behind
          // it, the crate with the brushes and paint, and the palette. Not the two canvases further
          // back by the sofa, nor the one lying in front of it — the hotspot would reach across the
          // sofa, which is something else you press.
          artCorner: boxCorners([-0.62, 0, -0.82], [0.7, 1.8, 1.15]).map(art).map(round),
        }
        // the dog's patch in the loops: his ribs and what blends into them (the smin reaches 8 cm), wherever his
        // breathing takes them — not his head, paws or tail, which don't move (a box round all of him reached into
        // the edge of the laptop close-up, where only the sofa's arm shows, and cost that loop twenty minutes)
        const dogBox = (() => {
          const pts = boxCorners([-0.05, 0.41, -0.3], [0.45, 0.83, 0.1]).map(sofa)
          return boxCorners([0, 1, 2].map((i) => Math.min(...pts.map((p) => p[i]))), [0, 1, 2].map((i) => Math.max(...pts.map((p) => p[i]))))
        })()
        // each candle's patch in the loops: just its flame, wherever it sways and stretches — nothing else
        // about a candle moves between frames (its light's position is fixed and its flicker is done in
        // post), and up close the jar's whole box made the laptop loop's patch twenty times the size
        const candleBoxes = jars.map((jar, i) => {
          const yaw = i === 0 ? [num('BOARD2_C'), num('BOARD2_S')] : [num('DESK_C'), num('DESK_S')]
          // (yawWorld takes y as it is, so the jar's height goes into the corners, not the origin)
          const pts = boxCorners([-0.012, jar[1] + flameY - 0.005, -0.012], [0.012, jar[1] + flameY + 1.3 * flameH, 0.012]).map((p) => yawWorld(jar, yaw[0], yaw[1], p))
          return boxCorners([0, 1, 2].map((i) => Math.min(...pts.map((p) => p[i]))), [0, 1, 2].map((i) => Math.max(...pts.map((p) => p[i]))))
        })
        const recordBox = (() => {
          const pts = boxCorners([recX - 0.16, 0.59, recZ - 0.16], [recX + 0.16, recY + 0.015, recZ + 0.16]).map(table)
          return boxCorners([0, 1, 2].map((i) => Math.min(...pts.map((p) => p[i]))), [0, 1, 2].map((i) => Math.max(...pts.map((p) => p[i]))))
        })()

        // Draw in horizontal bands so no single GPU command runs long enough to trip the
        // Windows driver watchdog (about 2 s, after which Chrome loses the context). How many
        // pixels a band can take depends on the view — close up, most rays hit the detailed
        // things — so the band size follows how long the last band took. Accumulates spp light
        // paths per pixel over a rectangle of the frame (GL coordinates, y up) and returns the
        // target holding the sums; the rest of both targets is left alone, which is what lets
        // a loop frame redo just patches.
        let current = 0
        let bandPixels = 100000
        const accumulate = async (x0, y0, w, h, spp) => {
          gl.enable(gl.SCISSOR_TEST)
          gl.scissor(x0, y0, w, h)
          for (const target of targets) {
            gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb)
            gl.clear(gl.COLOR_BUFFER_BIT)
          }
          for (let frame = 0; frame < spp; frame++) {
            const src = targets[current]
            const dst = targets[1 - current]
            gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb)
            gl.activeTexture(gl.TEXTURE8)
            gl.bindTexture(gl.TEXTURE_2D, src.tex[2])
            gl.activeTexture(gl.TEXTURE4)
            gl.bindTexture(gl.TEXTURE_2D, src.tex[1])
            gl.activeTexture(gl.TEXTURE0)
            gl.bindTexture(gl.TEXTURE_2D, src.tex[0])
            gl.uniform1i(uFrame, frame)
            for (let b0 = y0; b0 < y0 + h; ) {
              const rows = Math.max(1, Math.min(y0 + h - b0, Math.floor(bandPixels / w)))
              gl.scissor(x0, b0, w, rows)
              const began = performance.now()
              gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4)
              gl.finish()
              const ms = performance.now() - began
              if (ms > 200) bandPixels = Math.max(4000, bandPixels / 2)
              else if (ms < 50) bandPixels = Math.min(4000000, bandPixels * 1.2)
              b0 += rows
            }
            current = 1 - current
            if (frame % 8 === 0) await new Promise((r) => setTimeout(r, 0))
          }
          gl.disable(gl.SCISSOR_TEST)
          return targets[current]
        }
        // reads a rectangle of all three sums (GL coordinates) out of the target accumulate returned
        const readSums = (target, x, y, w, h) => {
          const sums = [0, 1, 2].map((k) => {
            const data = new Float32Array(w * h * 4)
            gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb)
            gl.readBuffer(gl.COLOR_ATTACHMENT0 + k)
            gl.readPixels(x, y, w, h, gl.RGBA, gl.FLOAT, data)
            return data
          })
          const error = gl.getError()
          if (error) throw new Error(`GL error ${error}`)
          return sums
        }
        const renderFull = async (spp) => readSums(await accumulate(0, 0, W, H, spp), 0, 0, W, H)

        // ---- film look ----
        // How strong the candle is and what colour its flame looks. Everything the candle adds is
        // decided here rather than in the shader, so it can be tuned (studio.grade) without
        // rendering again, and so it can flicker frame by frame over the same samples.
        const grade = {
          candle: 22, // the music candle's light
          candle2: 12, // the work station's candle's light: the same candle, but a metre from the tagline board's chalk, which its full strength glared out
          flame: 1.0, // the flames seen straight on
          flameRGB: [1.0, 0.7, 0.32],
          halo: 0.5, // the glow round the flame
          debugCandleOnly: false, // leave out the tubes' light, to see just the candle's
        }

        // Flip to top-down rows, average the samples and mix the lights: the tubes' light as it
        // is, each candle's scaled by its strength at time t; the flames on their own.
        const mix = ([base, candle, candle2], spp, t) => {
          const rgb = new Float32Array(W * H * 3), flame = new Float32Array(W * H)
          const k = (grade.candle * flicker(t, 0)) / spp, f = (grade.flame * flicker(t, 0)) / spp
          const k2 = (grade.candle2 * flicker(t, 1)) / spp, f2 = (grade.flame * flicker(t, 1)) / spp
          const b = grade.debugCandleOnly ? 0 : 1 / spp
          let bad = 0
          for (let y = 0; y < H; y++) {
            for (let x = 0; x < W; x++) {
              const s = (y * W + x) * 4, i = (H - 1 - y) * W + x
              rgb[i * 3] = base[s] * b + candle[s] * k + candle2[s] * k2
              rgb[i * 3 + 1] = base[s + 1] * b + candle[s + 1] * k + candle2[s + 1] * k2
              rgb[i * 3 + 2] = base[s + 2] * b + candle[s + 2] * k + candle2[s + 2] * k2
              flame[i] = candle[s + 3] * f + candle2[s + 3] * f2
              // a pixel that isn't a number would blacken everything right of and below it in the blurs
              for (let c = 0; c < 3; c++) if (!Number.isFinite(rgb[i * 3 + c])) { rgb[i * 3 + c] = 0; bad++ }
              if (!Number.isFinite(flame[i])) { flame[i] = 0; bad++ }
            }
          }
          if (bad) console.warn(`${bad} non-finite values in the sums, zeroed`)
          return { rgb, flame }
        }

        // the exposure that puts the median pixel in the mid-tones, whatever the light levels
        // (judged on the tubes' light alone, so the candle's strength never moves it)
        const autoExposure = ([base]) => {
          const lum = new Float32Array(Math.ceil((W * H) / 7))
          for (let i = 0, j = 0; i < W * H; i += 7, j++) lum[j] = 0.2126 * base[i * 4] + 0.7152 * base[i * 4 + 1] + 0.0722 * base[i * 4 + 2]
          const median = lum.sort()[Math.floor(lum.length * 0.5)] / SPP
          return median > 0 ? 0.34 / median : 1
        }

        // Everything after exposure — firefly clamp, bloom, tone curve, vignette, grain — the
        // same for every still and every video frame (the grain's seed included, so the grain
        // sits still instead of crawling, which also keeps the videos small). Each colour channel
        // gets the same curve, so a grey pixel comes out exactly as the black-and-white look had it.
        const filmLook = ({ rgb, flame }, exposure) => {
          const n = W * H
          for (let i = 0; i < 3 * n; i++) rgb[i] *= exposure
          const lum = (i) => 0.2126 * rgb[i * 3] + 0.7152 * rgb[i * 3 + 1] + 0.0722 * rgb[i * 3 + 2]

          // Fireflies: a lone pixel far brighter than everything around it is noise, not
          // detail (real highlights like the tubes are big blobs), so pull it down.
          const luma = new Float32Array(n)
          for (let i = 0; i < n; i++) luma[i] = lum(i)
          for (let y = 1; y < H - 1; y++) {
            for (let x = 1; x < W - 1; x++) {
              const i = y * W + x
              let around = 0
              for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                  if (dx || dy) around = Math.max(around, luma[i + dy * W + dx])
                }
              }
              if (luma[i] > 2 * around + 0.05) {
                const k = around / luma[i]
                rgb[i * 3] *= k
                rgb[i * 3 + 1] *= k
                rgb[i * 3 + 2] *= k
              }
            }
          }
          // The flame goes in after that: it's a few pixels across and far brighter than what's
          // round it, which is just what the clamp would take for a firefly.
          for (let i = 0; i < n; i++) {
            if (flame[i] === 0) continue
            for (let c = 0; c < 3; c++) rgb[i * 3 + c] += flame[i] * exposure * grade.flameRGB[c]
          }

          const scale = W / 2400
          const channel = (c) => {
            const out = new Float32Array(n)
            for (let i = 0; i < n; i++) out[i] = rgb[i * 3 + c]
            return out
          }
          const bloom = [0, 1, 2].map((c) => {
            const bright = channel(c)
            for (let i = 0; i < n; i++) bright[i] = Math.min(Math.max(bright[i] - 1.2, 0), 12)
            return [blur(bright, W, H, Math.max(1, Math.round(5 * scale))), blur(bright, W, H, Math.max(2, Math.round(32 * scale)))]
          })
          // a candle flame in a photo wears a soft halo much wider than itself
          const glow = new Float32Array(n)
          for (let i = 0; i < n; i++) glow[i] = Math.min(flame[i] * exposure, 40)
          const halo = blur(glow, W, H, Math.max(2, Math.round(18 * scale)))

          const out = document.createElement('canvas')
          out.width = W
          out.height = H
          const ctx = out.getContext('2d')
          const image = ctx.createImageData(W, H)
          let seed = 12345
          const random = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff)
          for (let y = 0; y < H; y++) {
            for (let x = 0; x < W; x++) {
              const i = y * W + x
              const dx = (x / W) * 2 - 1
              const dy = (y / H) * 2 - 1
              const vignette = 1 - 0.3 * Math.min(1, (dx * dx + dy * dy) / 2)
              const grain = (random() + random() - 1) * 0.03
              const p = i * 4
              for (let c = 0; c < 3; c++) {
                let v = rgb[i * 3 + c] + 0.35 * bloom[c][0][i] + 0.12 * bloom[c][1][i] + grade.halo * halo[i] * grade.flameRGB[c] * CANDLE_RGB[c]
                v = (v * (2.51 * v + 0.03)) / (v * (2.43 * v + 0.59) + 0.14) // ACES-style tone curve
                v = Math.min(Math.max(v, 0), 1)
                v = v + 0.45 * (v * v * (3 - 2 * v) - v) // more contrast: inky ceiling, chalky walls
                v = Math.pow(v, 1 / 2.2)
                v *= vignette
                v += grain
                image.data[p + c] = Math.round(Math.min(Math.max(v, 0), 1) * 255)
              }
              image.data[p + 3] = 255
            }
          }
          ctx.putImageData(image, 0, 0)
          return out
        }

        // The last still, which loop frames are built on: its camera, moment, samples and exposure.
        let still = null

        return {
          // what render.mjs needs to know besides the pictures; the candles' numbers are for the
          // site, which lights its own things by the same candles
          info: () => ({
            gpu,
            loopSeconds: letters.loop,
            anchors,
            candle: {
              flicker: FLICKER, // the first candle's, the one by the music board: the site's overlays are lit mostly by it
              strength: grade.candle,
              soft: num('CANDLE_SOFT'),
              reach: num('CANDLE_REACH'),
              rgb: CANDLE_RGB,
              radius: num('JAR_R'), // of a jar
              // each candle: the middle of its flame (where its light comes from), the height of its jar's rim, and the heights its
              // light comes from (see flamePoint), so the site can tell how much of the flame clears the rim from a point
              jars: jars.map((jar, i) => ({
                flame: round([jar[0], jar[1] + flameY + 0.4 * flameH, jar[2]]),
                strength: i === 0 ? grade.candle : grade.candle2,
                rim: +(jar[1] + jarH).toFixed(4),
                light: [0.2, 0.65].map((k) => +(jar[1] + flameY + k * flameH).toFixed(4)),
              })),
            },
          }),

          // debug: change the grade (see grade above) for the stills and frames that follow
          grade(changes) {
            Object.assign(grade, changes)
            return grade
          },

          // debug: the last still again, with the grade as it is now
          regrade() {
            const { raw, time, exposure } = still
            return { jpeg: filmLook(mix(raw, SPP, time), exposure).toDataURL('image/jpeg', 0.9) }
          },

          // A still from camera ({ pos, target, fov }) at time t (seconds), at the page's spp,
          // with the given exposure or, if none, the automatic one. Also works out which
          // patches of the frame move in its loop: the letters, the record, the flame and the
          // dog's chest, where visible.
          async still({ camera, time = 0, exposure }) {
            const cam = lookAt(camera)
            setCamera(cam)
            const pose = setTime(time)
            const started = performance.now()
            const raw = await renderFull(SPP)
            const renderMs = Math.round(performance.now() - started)
            const auto = autoExposure(raw)
            const used = exposure ?? auto
            const patches = [boxCorners(pose.min, pose.max), recordBox, ...candleBoxes, dogBox].map((corners) => screenRect(cam, corners)).filter(Boolean)
            still = { cam, time, raw, exposure: used, patches }
            return { camera: cam, exposure: used, autoExposure: auto, patches, renderMs, jpeg: filmLook(mix(raw, SPP, time), used).toDataURL('image/jpeg', 0.84) }
          },

          // Frame i of n of the still's seamless loop: only the patches that move are rendered
          // again, at that moment of the loop, and dropped into the still's samples before the
          // same film look — so everything outside them is the still's samples (same seeds, same
          // post) and their edges never show. The candle's light flickers over the whole frame,
          // which post does by scaling it.
          async loopFrame(i, n) {
            const { cam, time, raw, exposure, patches } = still
            const t = time + (letters.loop * i) / n
            setCamera(cam)
            setTime(t)
            for (const c of patches) {
              const sums = readSums(await accumulate(c.x, c.y, c.w, c.h, SPP), c.x, c.y, c.w, c.h)
              for (let k = 0; k < 3; k++) {
                for (let r = 0; r < c.h; r++) raw[k].set(sums[k].subarray(r * c.w * 4, (r + 1) * c.w * 4), ((c.y + r) * W + c.x) * 4)
              }
            }
            return filmLook(mix(raw, SPP, t), exposure).toDataURL('image/png')
          },

          // One whole frame of a walk: camera, time and exposure as for a still, at spp samples.
          async frame({ camera, time, spp = SPP, exposure }) {
            setCamera(lookAt(camera))
            setTime(time)
            return filmLook(mix(await renderFull(spp), spp, time), exposure).toDataURL('image/png')
          },

          // debug: the letters' distance field, mid-grey along the outlines, and where each letter ties on
          letters() {
            const c = document.createElement('canvas')
            c.width = letters.width
            c.height = letters.height
            const cx = c.getContext('2d')
            const img = cx.createImageData(letters.width, letters.height)
            for (let i = 0; i < letters.sdf.length; i++) {
              const byte = Math.round(Math.min(Math.max(0.5 - letters.sdf[i] / 64, 0), 1) * 255)
              img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = byte
              img.data[i * 4 + 3] = 255
            }
            cx.putImageData(img, 0, 0)
            return { layout: letters.pose(0).layout, jpeg: c.toDataURL('image/jpeg', 0.92) }
          },

          // debug: the chalk textures of the two boards
          board(writing = true) {
            return { jpeg: boardTexture({ writing }).toDataURL('image/jpeg', 0.92) }
          },

          // debug: the laptop's screen and the sheets of paper
          screen() {
            return { jpeg: screenTexture().toDataURL('image/jpeg', 0.92) }
          },
          paper() {
            return { jpeg: paperTexture().toDataURL('image/jpeg', 0.92) }
          },
        }
      }

      window.studio = setup()
    </script>
  </body>
</html>
