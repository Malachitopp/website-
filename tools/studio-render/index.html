          vec2 artBoxXZ = ART_POS.xz + vec2(ART_C * ART_BOX.x + ART_S * ART_BOX.z, -ART_S * ART_BOX.x + ART_C * ART_BOX.z);
          float d0 = distance(p.xz, TABLE_POS.xz), d1 = distance(p.xz, CANDLE_TABLE_POS.xz);
          float d2 = distance(p.xz, DESK_POS.xz), d3 = distance(p.xz, artBoxXZ);
          int which = 0;
          float best = d0;
          if (d1 < best) { which = 1; best = d1; }
          if (d2 < best) { which = 2; best = d2; }
          if (d3 < best) { which = 3; best = d3; }
          vec3 q = which == 3 ? artLocal(p) - ART_BOX : which == 2 ? deskLocal(p) : which == 1 ? crateLocal(p) : tableLocal(p);
          vec3 size = which == 3 ? vec3(ART_BOX_HW, ART_BOX_H, ART_BOX_HD) : which == 2 ? vec3(DESK_HW, DESK_H, DESK_HD) : which == 1 ? vec3(CRATE_HW, CRATE_H, CRATE_HD) : vec3(BOX_HW, BOX_H, BOX_HD); // half width, height, half depth
          float shelfY = which == 1 ? SHELF_Y : which == 3 ? ART_BOX_SHELF : which == 2 ? (q.y < 0.5 * (DESK_S1 + DESK_S2) ? DESK_S1 : DESK_S2) : -1.0;
          bool shelf = shelfY > 0.0 && q.y > shelfY - 1e-3 && q.y < shelfY + BOX_T + 1e-3 && abs(q.x) < size.x - BOX_T + 1e-3;
          bool lying = shelf || q.y > size.y - BOX_T - 1e-3 || q.y < BOX_T + 1e-3; // top or bottom
          bool side = !lying && abs(q.x) > size.x - BOX_T - 1e-3;
          vec2 g = (lying ? q.xz : side ? q.zy : q.xy) + (which == 1 ? 13.0 : which == 2 ? 29.0 : which == 3 ? 47.0 : 0.0); // along the board, across it
          float a = 0.47 + 0.17 * (fbm(vec2(g.x * 2.5, g.y * 38.0 + fbm(g * 6.0) * 2.0)) - 0.5);
          a += 0.07 * (noise(vec2(g.x * 5.0, g.y * 160.0)) - 0.5);
          a *= 1.0 - 0.45 * edgeLine((lying ? q.z : q.y - 0.5 * size.y), 0.0025); // the joint between the two boards
          float inset = min(min(size.x - abs(q.x), size.z - abs(q.z)), min(q.y, size.y - q.y));
          if (shelf) inset = min(size.z - abs(q.z), min(q.y - shelfY, shelfY + BOX_T - q.y));
          a *= 1.0 - 0.3 * (1.0 - smoothstep(0.0, 0.004, inset));
          return a;
        }
        if (m == M_DBOOK) {
          // the work station's books: rows standing spine-out (each a different cloth, a paler label
          // on the spine, the pages showing along the top), ones lying flat (pages at the ends and the
          // back), and the one leaning over
          vec3 q = deskLocal(p);
          for (int i = 0; i < DBOOK_N; i++) {
            vec3 lo = DBOOK[2 * i], hi = DBOOK[2 * i + 1];
            if (any(lessThan(q, lo - 1e-3)) || any(greaterThan(q, hi + 1e-3))) continue;
            if (i < DBOOK_STANDING) {
              if (q.y > hi.y - 1e-3) return 0.78 + 0.05 * (noise(vec2(q.x * 900.0, q.z * 60.0)) - 0.5); // the pages
              float u = q.x * 36.0 + 0.6 * sin(q.x * 71.0) + 0.4 * sin(q.x * 157.0); // one book every 3 cm or so, not evenly
              float id = floor(u), f = fract(u);
              float a = 0.12 + 0.5 * hash2(vec2(id, 3.0 + float(i)));
              a *= 1.0 - 0.4 * (1.0 - smoothstep(0.0, 0.08, min(f, 1.0 - f))); // the gap between two books
              float band = lo.y + (hi.y - lo.y) * (0.25 + 0.45 * hash2(vec2(id, 9.0))); // a label on the spine
              if (q.z < lo.z + 1e-3 && abs(q.y - band) < 0.009) a = mix(a, 0.8, 0.6);
              return a + 0.02 * (noise(q.yz * 400.0) - 0.5);
            }
            bool pages = q.x < lo.x + 1e-3 || q.x > hi.x - 1e-3 || q.z > hi.z - 1e-3;
            if (pages) return 0.8 + 0.05 * (noise(vec2(q.y * 1500.0, (q.x + q.z) * 40.0)) - 0.5);
            return 0.15 + 0.5 * hash2(vec2(float(i), 5.0)) + 0.02 * (noise(q.xz * 300.0) - 0.5);
          }
          vec3 r = q - DBOOK_LEAN; // the leaning one
          r.xy = vec2(LEAN_C * r.x - LEAN_S * r.y, LEAN_S * r.x + LEAN_C * r.y);
          if (r.y > 0.229) return 0.78 + 0.05 * (noise(vec2(r.x * 900.0, r.z * 60.0)) - 0.5);
          float a = 0.34;
          if (r.z < -0.119 && abs(r.y - 0.15) < 0.009) a = 0.62;
          return a + 0.02 * (noise(r.yz * 400.0) - 0.5);
        }
        if (m == M_LAPTOP) {
          // brushed aluminium; the base's top has the keyboard sunk into it (black keys in a dark
          // well) and the trackpad in front; the lid's face round the screen is black
          vec3 q = lapLocal(deskLocal(p));
          vec3 l = lidLocal(q);
          if (l.y > 0.003 && l.z < 0.0015) return 0.02; // the bezel: very dark plastic (at 0.05 the candle 25 cm away lit it tan, and the lid's top vanished against the floor)
          float a = 0.5 + 0.025 * (noise(vec2(q.x * 60.0, (q.y + q.z) * 900.0)) - 0.5);
          if (q.y > LAP_T - 1e-3 && q.z < HINGE_Z - 0.006) {
            vec2 k = q.xz - vec2(0.0, 0.043); // the keyboard's middle
            if (abs(k.x) < 0.142 && abs(k.y) < 0.052) {
              vec2 cell = vec2(0.0189, 0.0173);
              vec2 f = abs(mod(k + 0.5 * cell, cell) - 0.5 * cell); // from the middle of the nearest key
              bool cap = f.x < 0.5 * cell.x - 0.0011 && f.y < 0.5 * cell.y - 0.0011;
              return cap ? 0.1 + 0.03 * (noise(k * 700.0) - 0.5) : 0.28;
            }
            if (abs(q.x) < 0.065 && q.z > -0.098 && q.z < -0.023)
              return 0.5 - 0.2 * max(edgeLine(abs(q.x) - 0.065, 0.0008), edgeLine(min(q.z + 0.098, -0.023 - q.z), 0.0008)); // the trackpad, edged
          }
          return a;
        }
        if (m == M_SCREEN) return 0.012; // dark matt glass: its picture is light of its own (see screenLight)
        if (m == M_PAPER) {
          vec3 q = deskLocal(p);
          for (int i = 0; i < PAPER_N; i++) {
            vec4 s = PAPER[i];
            if (abs(q.y - paperTop(i)) > 1e-4) continue;
            float cs = cos(s.z), sn = sin(s.z);
            vec2 r = q.xz - s.xy;
            r = vec2(cs * r.x - sn * r.y, sn * r.x + cs * r.y);
            if (abs(r.x) > PAPER_HW || abs(r.y) > PAPER_HL) continue;
            vec2 uv = 0.5 * (vec2(0.5 * (r.x / PAPER_HW + 1.0), 0.5 * (1.0 - r.y / PAPER_HL)) + vec2(mod(s.w, 2.0), floor(s.w / 2.0)));
            float ink = textureLod(uPaper, uv, 0.0).r;
            return 0.84 * (1.0 - 0.72 * ink) + 0.03 * (noise(r * 700.0) - 0.5);
          }
          return 0.84;
        }
        if (m == M_PENCIL) {
          vec3 q = deskLocal(p);
          float along = (q.x + 0.145) / -0.09; // 0 at the point (its right end), 1 at the other end
          return along < 0.035 ? 0.04 : along < 0.16 ? 0.72 : 0.6 + 0.08 * step(0.5, fract(atan(q.y - DESK_H - 0.0035, q.z + 0.115 + 0.667 * (q.x + 0.145)) * 0.955)); // lead, sharpened wood, the faceted body
        }
        if (m == M_EASEL) {
          // the easel's battens: grain running up each one (the mast's parts are axis-aligned in
          // the mast's frame, the feet and rear leg near enough), worn paler along the edges
          vec3 q = easelLocal(artLocal(p));
          float a = 0.54 + 0.15 * (fbm(vec2(q.y * 2.4, (q.x + q.z) * 46.0)) - 0.5);
          a += 0.05 * (noise(vec2(q.y * 6.0, (q.x + q.z) * 190.0)) - 0.5);
          return a * (1.0 - 0.12 * smoothstep(0.45, 0.8, fbm(q.xy * 9.0 + 21.0))); // years of paint wiped off it
        }
        if (m == M_BRUSH) {
          // long varnished handles, the paint that has crept down them never quite cleaned off
          vec3 q = artLocal(p) - ART_BOX;
          return 0.46 + 0.16 * hash2(floor(q.xz * 90.0) + 17.0) + 0.04 * (noise(q.xy * 400.0) - 0.5);
        }
        if (m == M_BOOK) {
          // three hardbacks lying flat, spines out: dark cloth, a paler one, a mid one, with the
          // page edges showing pale between the boards at the ends
          vec3 q = crateLocal(p);
          float y = q.y - BOX_T;
          float lo = y < 0.034 ? 0.0 : y < 0.058 ? 0.034 : 0.058, hi = y < 0.034 ? 0.034 : y < 0.058 ? 0.058 : 0.079;
          float cloth = y < 0.034 ? 0.12 : y < 0.058 ? 0.55 : 0.3;
          bool pageEdge = abs(q.x) > 0.1 && min(y - lo, hi - y) > 0.003;
          return (pageEdge ? 0.8 : cloth) + 0.03 * (noise(q.xz * 300.0 + y * 90.0) - 0.5);
        }
        if (m == M_MATCHBOX) {
          vec3 q = crateLocal(p);
          return q.y > CRATE_H + 0.0135 ? 0.72 + 0.04 * (noise(q.xz * 500.0) - 0.5) : 0.16; // printed paper top, brown striking sides
        }
        if (m == M_MATCH) {
          vec3 q = crateLocal(p);
          return length(q.xz - vec2(0.074, -0.09)) < 0.006 ? 0.04 : 0.62; // burnt head
        }
        if (m == M_WAX) return 0.86;
        if (m == M_SOFA) {
          // teddy fleece: pale grey, a curly pile, a little darker where the cover bunches
          vec3 q = sofaLocal(p);
          return 0.48 + 0.07 * (fbm(vec2(q.x * 6.0 + q.z * 3.0, q.y * 6.0 - q.z * 3.0)) - 0.5) + 0.03 * (noise(vec2(q.x * 90.0 + q.y * 70.0, q.z * 90.0 - q.y * 60.0)) - 0.5);
        }
        if (m == M_PILLOW) {
          // a cream cover with a leafy grey print
          vec3 q = sofaLocal(p);
          float print = smoothstep(0.5, 0.62, fbm(vec2(q.x * 14.0 + q.z * 3.0, q.y * 14.0) + 5.0));
          return mix(0.72, 0.40, print) + 0.03 * (noise(q.xy * 300.0) - 0.5);
        }
        if (m == M_DOG) {
          // a black wiry coat, greyer on the beard, brow and legs (a schnauzer's furnishings)
          vec3 q = sofaLocal(p);
          vec3 h = q - HEAD_C;
          float a = 0.055 + 0.03 * (noise(vec2(q.x * 350.0 + q.y * 300.0, q.z * 350.0 - q.y * 260.0)) - 0.5);
          if (h.x > 0.03 && h.y < -0.035) a += 0.05; // the beard
          if (h.x > 0.03 && h.x < 0.085 && h.y > 0.015 && abs(h.z) < 0.05) a += 0.03; // the brow
          if (q.x > 0.37 && q.y < 0.585 && h.x < 0.0) a += 0.04; // the front legs
          return a;
        }
        if (m == M_NOSE) return 0.03;
        if (m == M_SLEEVE) {
          // spines of different records, some thicker than others
          vec3 q = tableLocal(p);
          float u = (q.x + 1.0) * 170.0 + 0.8 * sin(q.x * 41.0) + 0.5 * sin(q.x * 97.0);
          float id = floor(u);
          float a = 0.22 + 0.42 * hash2(vec2(id, 7.0));
          a *= 1.0 - 0.35 * (1.0 - smoothstep(0.0, 0.08, min(fract(u), 1.0 - fract(u)))); // the gap between sleeves
          a -= 0.06 * smoothstep(0.3, 0.9, fbm(q.zy * 30.0 + id));
          return clamp(a, 0.04, 0.8);
        }
        if (m == M_PLINTH) return 0.08 + 0.02 * (noise(p.xz * 80.0) - 0.5);
        if (m == M_PLATTER) {
          // aluminium, with a ring of strobe dots round the rim that turn with it
          vec3 q = tableLocal(p);
          vec2 v = q.xz - REC_C;
          if (length(v) < 0.146) return 0.55;
          float a = atan(v.y, v.x) + uSpin;
          return q.y > 0.607 && q.y < 0.618 ? mix(0.22, 0.7, step(0.5, fract(a * 36.0 / PI))) : 0.6;
        }
        if (m == M_RECORD) {
          vec3 q = tableLocal(p);
          if (q.y < REC_Y - 5e-4) return 0.05; // the edge
          vec2 v = q.xz - REC_C;
          float r = length(v);
          // turning clockwise seen from above: the pattern that is at angle a now started at a + uSpin
          float a = atan(v.y, v.x) + uSpin;
          if (r < LABEL_R) {
            // a paper label printed off-centre, so the turning shows even from across the hall
            vec2 u = vec2(cos(a), sin(a)) * r;
            float lab = u.x > 0.0 && r < 0.042 ? 0.36 : 0.8;
            lab -= 0.45 * edgeLine(r - 0.045, 0.0012);
            lab -= 0.5 * step(abs(u.y - 0.012), 0.004) * step(abs(u.x + 0.02), 0.014);
            lab -= 0.35 * step(abs(u.y + 0.014), 0.0025) * step(abs(u.x + 0.018), 0.012);
            lab -= 0.35 * step(r, 0.0045);
            return lab;
          }
          float g = 0.035 + 0.012 * (noise(vec2(r * 2600.0, 0.5)) - 0.5);
          g += 0.035 * (edgeLine(r - 0.086, 0.0011) + edgeLine(r - 0.109, 0.0011) + edgeLine(r - 0.131, 0.0011)); // gaps between tracks
          return r > 0.147 ? 0.05 : g;
        }
        if (m == M_METAL) return 0.62;
        if (m == M_RUBBER) return 0.05;
        if (m == M_LEFT) {
          vec2 q = vec2(p.z, p.y);
          float a = 0.84;
          a -= 0.2 * smoothstep(0.58, 0.78, fbm(q * vec2(0.45, 0.7) + 3.0));
          a -= 0.4 * smoothstep(0.7, 0.86, fbm(q * 2.6 + 11.0));
          a -= 0.14 * (1.0 - smoothstep(0.0, 0.9, p.y));
          a += 0.035 * (noise(q * 35.0) - 0.5);
          // painted-over doorways
          for (int i = 0; i < 3; i++) {
            float z0 = 5.0 + float(i) * 15.0;
            vec2 dq = vec2(abs(p.z - (z0 + 1.1)) - 1.1, p.y - 2.5);
            float outline = max(edgeLine(dq.x, 0.035) * step(p.y, 2.5), edgeLine(dq.y, 0.035) * step(dq.x, 0.0));
            a *= 1.0 - 0.35 * outline;
            if (dq.x < 0.0 && dq.y < 0.0) a += 0.04;
          }
          return clamp(a, 0.05, 0.92);
        }
        if (m == M_RIGHT) {
          float a = 0.46 + 0.08 * (fbm(vec2(p.z, p.y) * 0.9) - 0.5);
          a *= 1.0 - 0.4 * edgeLine(mod(p.z + 1.22, 2.44) - 1.22, 0.01);
          return a;
        }
        if (m == M_STUD || m == M_PLATE) return 0.8 + 0.06 * (noise(vec2(p.z * 3.0, p.y * 0.6)) - 0.5);
        if (m == M_CEIL) return 0.06;
        if (m == M_BEAM) return 0.08;
        if (m == M_PIPE) return 0.62;
        if (m == M_BACK) {
          float a = 0.34 + 0.06 * (fbm(p.xy * 0.8) - 0.5);
          vec2 dq = vec2(abs(p.x) - DOOR_HALF_W, p.y - DOOR_H);
          if (dq.x < 0.25 && dq.y < 0.25) a = 0.14; // steel frame around the door
          return a;
        }
        return 0.5;
      }

      // ---- the colours of the art corner ----
      // The paint on a spare canvas's face: a window of four of CSPLAT, chosen by which canvas it
      // is, so no two are splattered alike.
      vec4 canvasPaint(vec2 q, int i) {
        vec3 rgb = vec3(0.0);
        float cover = 0.0;
        for (int j = 0; j < 4; j++) {
          vec4 s = CSPLAT[(3 * i + j) % CSPLAT_N];
          if (abs(q.x - s.x) > 6.0 * s.z || abs(q.y - s.y) > 6.0 * s.z) continue;
          float m = splatMask(q, s.xy, s.z, float(i) * 5.3 + float(j) * 1.9 + 0.7);
          if (m <= 0.0) continue;
          rgb = mix(rgb, PAINT[int(s.w)], m);
          cover = max(cover, m);
        }
        return vec4(rgb, cover);
      }

      // A canvas: primed cotton over a stretcher — the face, the sides where the cloth folds round
      // the bars, and the back, a pale wooden bar round the border with slack cloth inside. Every
      // one has paint on it except the easel's, which is left clean: the site hangs my paintings on
      // that one.
      vec3 canvasSurface(vec3 p) {
        const vec3 linen = vec3(1.0, 0.975, 0.93); // primed cotton, a shade warm
        vec3 q = artLocal(p);
        for (int i = 0; i < CANVAS_N; i++) {
          vec3 f = CANVAS_FORM[i];
          vec3 c = canvasLocal(q, i);
          if (abs(c.x) > 0.5 * f.y + 2e-3 || c.y < -2e-3 || c.y > f.z + 2e-3 || c.z < -2e-3 || c.z > CANVAS_T + 2e-3) continue;
          float weave = 0.5 * (noise(c.xy * 880.0) + noise(c.yx * 640.0)) - 0.5;
          float inset = min(0.5 * f.y - abs(c.x), min(c.y, f.z - c.y));
          if (c.z < 1e-3) { // the face: gesso, a little uneven, darker where the cloth folds over the edge
            float a = 0.84 + 0.05 * weave - 0.05 * smoothstep(0.55, 0.85, fbm(c.xy * 7.0 + float(i) * 3.0));
            a *= 1.0 - 0.07 * (1.0 - smoothstep(0.0, 0.014, inset));
            if (i == 0) return a * linen;
            vec4 splat = canvasPaint(c.xy, i);
            return mix(a * linen, splat.rgb, splat.w);
          }
          if (c.z > CANVAS_T - 1e-3) return inset < 0.036 // the back
            ? (0.58 + 0.14 * (fbm(vec2(c.x * 2.2, c.y * 44.0)) - 0.5)) * mix(linen, OAK, 0.55) // a stretcher bar
            : (0.63 + 0.06 * weave) * linen; // the cloth between them
          return (0.76 + 0.05 * weave) * linen; // the sides
        }
        return 0.84 * linen;
      }

      // The palette: an old board darkened by oil, with a blob of each colour squeezed round its
      // top edge and what has been mixed from them dragged across the middle.
      vec3 paletteSurface(vec3 p) {
        vec3 q = paletteLocal(artLocal(p));
        vec3 wood = vec3(0.40, 0.27, 0.16);
        if (q.z > 0.5 * PALETTE_T) return wood * 0.75; // its back, against the crate
        vec2 uv = vec2(q.x / PALETTE_HW, q.y / PALETTE_H); // -1..1 across it, 0..1 up it
        vec2 aspect = vec2(1.0, PALETTE_H / PALETTE_HW); // so a blob comes out round
        vec3 col = wood * (0.88 + 0.24 * noise(uv * 26.0));
        for (int i = 0; i < PAINT_N; i++) {
          vec2 c = vec2(mix(-0.76, 0.76, (float(i) + 0.5) / float(PAINT_N)), 0.80 + 0.05 * sin(float(i) * 2.3));
          float r = 0.10 + 0.05 * hash2(vec2(float(i), 4.0));
          col = mix(col, PAINT[i], 1.0 - smoothstep(0.62 * r, r, length((uv - c) * aspect)));
        }
        float mixed = smoothstep(0.62, 0.28, uv.y) * smoothstep(0.34, 0.80, fbm(uv * vec2(5.0, 7.0) + 3.0));
        vec3 muddy = mix(PAINT[0] * 0.6 + PAINT[1] * 0.45, PAINT[5] * 0.75, 0.4 + 0.45 * noise(uv * 9.0));
        return mix(col, muddy, 0.85 * mixed);
      }

      // A tube of oil paint: a tin body with the colour it holds printed round the middle, the
      // crimped tail at one end and a cap of the same colour at the other.
      vec3 tubeSurface(vec3 p) {
        vec3 q = artLocal(p) - ART_BOX;
        for (int i = 0; i < PAINT_TUBE_N; i++) {
          vec4 t = PAINT_TUBE[i];
          float y = (i < 4 ? ART_BOX_H : ART_BOX_SHELF + BOX_T) + PAINT_TUBE_R;
          if (abs(q.y - y) > PAINT_TUBE_R + 3e-3) continue;
          vec2 v = q.xz - t.xy;
          float cs = cos(t.z), sn = sin(t.z);
          float along = v.x * cs + v.y * sn, side = -v.x * sn + v.y * cs;
          if (abs(along) > PAINT_TUBE_L + 0.02 || abs(side) > PAINT_TUBE_R + 3e-3) continue;
          vec3 paint = PAINT[int(t.w)];
          if (along > PAINT_TUBE_L) return paint * 0.8; // the cap
          float u = (along + PAINT_TUBE_L) / (2.0 * PAINT_TUBE_L); // 0 at the crimped tail, 1 at the neck
          if (u < 0.13) return vec3(0.6, 0.59, 0.57) * (0.82 + 0.36 * step(0.5, fract(side * 110.0))); // the crimp
          if (abs(u - 0.52) < 0.21) return paint; // the band of colour it holds
          return vec3(0.76, 0.75, 0.72) * (0.92 + 0.16 * noise(vec2(along, side) * 500.0));
        }
        return vec3(0.74, 0.73, 0.70);
      }

      // Bristles that have not been cleaned: each brush keeps whatever it was last used with,
      // strongest at the tip. Which colour comes from where the cluster is, so a brush is one colour.
      vec3 bristleSurface(vec3 p) {
        vec3 q = artLocal(p) - ART_BOX;
        vec3 paint = PAINT[min(int(hash2(floor(q.xz * 80.0) + 3.0) * float(PAINT_N)), PAINT_N - 1)];
        float tip = smoothstep(0.0, 0.03, q.y - (ART_BOX_H + 0.20));
        return mix(vec3(0.70, 0.66, 0.56), paint, 0.3 + 0.55 * tip);
      }

      // The tin the brushes stand in: galvanised, with what has run down the inside of it dried
      // over the outside.
      vec3 potSurface(vec3 p) {
        vec3 q = artLocal(p) - ART_BOX - vec3(POT_C.x, 0.0, POT_C.y);
        float a = 0.52 + 0.08 * (noise(vec2(atan(q.z, q.x) * 9.0, q.y * 120.0)) - 0.5);
        float run = smoothstep(0.52, 0.78, fbm(vec2(atan(q.z, q.x) * 3.4, q.y * 7.0 - 4.0)));
        vec3 paint = PAINT[min(int(hash2(vec2(floor(atan(q.z, q.x) * 2.2), 8.0)) * float(PAINT_N)), PAINT_N - 1)];
        return mix(vec3(a) * vec3(1.0, 0.99, 0.97), paint * 0.8, 0.75 * run);
      }

      // A rag: cotton, stained with everything wiped onto it.
      vec3 ragSurface(vec3 p) {
        vec2 uv = (artLocal(p) - ART_BOX).xz * 26.0;
        float cloth = 0.68 + 0.12 * (fbm(uv * 2.4) - 0.5);
        float stain = smoothstep(0.45, 0.72, fbm(uv + 11.0));
        vec3 paint = PAINT[min(int(hash2(floor(uv * 0.6) + 5.0) * float(PAINT_N)), PAINT_N - 1)];
        return mix(vec3(cloth) * vec3(1.0, 0.98, 0.94), paint * 0.7, 0.8 * stain);
      }

      // A surface's colour. The hall itself is grey — concrete, slate, steel, the fleece sofa, the
      // card letters. What really has a colour gets it: the candles' navy glass and gold printing,
      // their cream wax, the oak the crates and the easel are made of, the primed cotton of the
      // canvases, and the oil paint — in the tubes, on the palette, on the brushes, and flicked
      // over the floor round the easel and onto the sofa.
      vec3 surface(int m, vec3 p, vec3 n) {
        if (m == M_WAX) return vec3(0.87, 0.84, 0.77);
        if (m == M_CANVAS) return canvasSurface(p);
        if (m == M_PALETTE) return paletteSurface(p);
        if (m == M_PAINT_TUBE) return tubeSurface(p);
        if (m == M_BRISTLE) return bristleSurface(p);
        if (m == M_POT) return potSurface(p);
        if (m == M_RAG) return ragSurface(p);
        if (m != M_GLASS) {
          float a = albedo(m, p);
          if (m == M_WOOD || m == M_EASEL) return a * OAK;
          if (m == M_BRUSH) return a * vec3(1.0, 0.89, 0.72); // varnished handles
          // paint flicked over the concrete round the easel, and over the sofa. The floor is the
          // most-hit surface in the hall, so one box test keeps the dabs' loop off the rest of it.
          if (m == M_FLOOR) {
            vec2 q = artLocal(p).xz;
            if (q.x < -1.05 || q.x > 2.0 || q.y < -1.65 || q.y > 2.15) return vec3(a);
            vec4 s = paintOn(q, 0, SPLAT_FLOOR);
            return mix(vec3(a), s.rgb, s.w);
          }
          if (m == M_SOFA) { vec4 s = paintOn(sofaLocal(p).xz, SPLAT_FLOOR, SPLAT_N); return mix(vec3(a), s.rgb, s.w); }
          return vec3(a);
        }
        vec3 q = jarLocal(p, nearestJar(p));
        if (n.y > 0.5) return vec3(0.12, 0.16, 0.3); // the rim
        if (dot(n.xz, q.xz) < 0.0) return vec3(0.03, 0.05, 0.13); // the inside of the wall, above the wax
        if (q.y < JAR_BASE) return vec3(0.1, 0.12, 0.18); // the thick clear base
        vec2 uv = vec2(fract((atan(q.z, q.x) - LABEL_FACING) / (2.0 * PI) + 0.5), 1.0 - q.y / JAR_H);
        float gold = textureLod(uLabel, uv, 0.0).r;
        return mix(vec3(0.018, 0.032, 0.095), vec3(0.8, 0.6, 0.28), gold);
      }

      // Candlelight coming through the glass: the wall above the wax glows with the flame behind
      // it, and below that the wax lets some through near the top. The gold ink blocks it.
      vec3 jarGlow(vec3 p, vec3 n) {
        vec3 q = jarLocal(p, nearestJar(p));
        if (n.y > 0.5 || dot(n.xz, q.xz) < 0.0) return vec3(0.0); // rim and inside are lit by the flame directly
        vec3 blue = vec3(0.22, 0.4, 1.0);
        if (q.y > WAX_Y) return 0.014 * blue;
        if (q.y < JAR_BASE) return 0.001 * CANDLE_RGB;
        vec2 uv = vec2(fract((atan(q.z, q.x) - LABEL_FACING) / (2.0 * PI) + 0.5), 1.0 - q.y / JAR_H);
        return 0.006 * exp(-(WAX_Y - q.y) / 0.02) * (1.0 - textureLod(uLabel, uv, 0.0).r) * blue;
      }

      // the laptop's screen lit up: the picture on it as light, a white pixel giving SCREEN_LE
      float screenLight(vec3 p) {
        return SCREEN_LE * pow(textureLod(uScreen, screenUV(lidLocal(lapLocal(deskLocal(p)))), 0.0).r, 2.2);
      }

      float emission(int m, vec3 p) {
        if (m == M_TUBE) return TUBE_LE;
        if (m == M_BACK && abs(p.x) < DOOR_HALF_W && p.y < DOOR_H) {
          float slats = 0.8 + 0.2 * smoothstep(0.3, 0.5, abs(fract(p.x / 0.18) - 0.5) * 2.0);
          return DOOR_LE * slats * (0.85 + 0.15 * p.y / DOOR_H);
        }
        return 0.0;
      }

      // ---- lighting ----
      vec3 tubeCentre(int r, int c) { return vec3(COL0 + float(c) * COL_STEP, TUBE_Y, ROW0 + float(r) * ROW_STEP); }

      float tubeWeight(vec3 p, vec3 n, vec3 lc) {
        vec3 q = vec3(clamp(p.x, lc.x - TUBE_HALF_LEN, lc.x + TUBE_HALF_LEN), TUBE_Y, lc.z);
        vec3 v = q - p;
        float d2 = dot(v, v) + 0.2;
        float inv = inversesqrt(d2);
        return (max(0.0, v.y * inv) + 0.02) * (max(0.0, dot(n, v) * inv) + 0.02) / d2;
      }

      // Next-event estimation: pick one tube (nearer, better-facing tubes more often) and
      // test a shadow ray to a random point on its glowing underside.
      float directLight(vec3 p, vec3 n) {
        float total = 0.0;
        for (int r = 0; r < ROWS; r++) for (int c = 0; c < COLS; c++) total += tubeWeight(p, n, tubeCentre(r, c));
        float pick = rnd() * total;
        float w = 0.0;
        vec3 lc = tubeCentre(ROWS - 1, COLS - 1);
        bool found = false;
        for (int r = 0; r < ROWS && !found; r++) for (int c = 0; c < COLS && !found; c++) {
          vec3 cc = tubeCentre(r, c);
          w = tubeWeight(p, n, cc);
          pick -= w;
          if (pick <= 0.0) { lc = cc; found = true; }
        }
        if (!found) w = tubeWeight(p, n, lc);
        vec3 s = vec3(lc.x + (rnd() * 2.0 - 1.0) * TUBE_HALF_LEN, TUBE_Y, lc.z + (rnd() * 2.0 - 1.0) * TUBE_HALF_W);
        vec3 v = s - p;
        float dist2 = dot(v, v);
        float dist = sqrt(dist2);
        vec3 dir = v / dist;
        float cosS = dot(n, dir);
        float cosL = dir.y;
        if (cosS <= 0.0 || cosL <= 0.0) return 0.0;
        if (occluded(p + n * 2e-3, dir, dist)) return 0.0;
        return TUBE_LE * cosS * cosL * TUBE_AREA / (dist2 * (w / total)) / PI;
      }

      // How likely the glossy lobe around mirror direction r is to land on a tube: a
      // Gaussian in the distance from where r crosses the tubes' plane to the tube.
      float glossyWeight(vec3 p, vec3 r, vec3 lc) {
        float t = (TUBE_Y - p.y) / r.y;
        vec3 hp = p + r * t;
        float dx = max(0.0, abs(hp.x - lc.x) - TUBE_HALF_LEN);
        float dz = abs(hp.z - lc.z) - TUBE_HALF_W;
        float sigma = GLOSS_SPREAD * t + 0.02;
        return exp(-(dx * dx + max(0.0, dz) * max(0.0, dz)) / (2.0 * sigma * sigma)) + 1e-4;
      }

      // The tubes seen in the floor's glossy reflection, sampled directly so the
      // reflection converges instead of being a scatter of fireflies.
      float glossyLight(vec3 p, vec3 n, vec3 r) {
        if (r.y <= 0.0) return 0.0;
        float total = 0.0;
        for (int i = 0; i < ROWS; i++) for (int c = 0; c < COLS; c++) total += glossyWeight(p, r, tubeCentre(i, c));
        float pick = rnd() * total;
        float w = 0.0;
        vec3 lc = tubeCentre(ROWS - 1, COLS - 1);
        bool found = false;
        for (int i = 0; i < ROWS && !found; i++) for (int c = 0; c < COLS && !found; c++) {
          vec3 cc = tubeCentre(i, c);
          w = glossyWeight(p, r, cc);
          pick -= w;
          if (pick <= 0.0) { lc = cc; found = true; }
        }
        if (!found) w = glossyWeight(p, r, lc);
        vec3 s = vec3(lc.x + (rnd() * 2.0 - 1.0) * TUBE_HALF_LEN, TUBE_Y, lc.z + (rnd() * 2.0 - 1.0) * TUBE_HALF_W);
        vec3 v = s - p;
        float dist2 = dot(v, v);
        float dist = sqrt(dist2);
        vec3 dir = v / dist;
        float cosS = dot(n, dir);
        float cosL = dir.y;
        if (cosS <= 0.0 || cosL <= 0.0) return 0.0;
        float lobe = pow(max(0.0, dot(r, dir)), GLOSS_N);
        if (lobe < 1e-5) return 0.0;
        if (occluded(p + n * 2e-3, dir, dist)) return 0.0;
        float f = (GLOSS_N + 2.0) / (2.0 * PI) * lobe;
        return TUBE_LE * f * cosS * cosL * TUBE_AREA / (dist2 * (w / total));
      }

      // The candles as lights: a point in the bright middle of a flame, at rest (the flicker is
      // applied in post, so the light doesn't move in the loops). A candle wouldn't show at all
      // against these tubes, so they are far stronger than real ones (set in post), and their
      // fall-off is softened close to them so what stands beside them isn't burnt out. Each point
      // asks one candle, chosen by how strongly it would light it (its distance and its fade),
      // and weights the answer by that choice; which candle it was decides the channel the light
      // goes into, so post can flicker each on its own.
      vec3 flamePoint(int i) {
        return jarWorld(vec3((rnd() * 2.0 - 1.0) * 0.002, FLAME_Y + FLAME_H * (0.2 + 0.45 * rnd()), (rnd() * 2.0 - 1.0) * 0.002), i);
      }

      // how strong candle i would be at p, without shadowing: the fall-off and the fade
      float candleWeight(vec3 p, int i) {
        float dist2 = dot(jarOrigin(i) - p, jarOrigin(i) - p);
        if (dist2 > CANDLE_REACH * CANDLE_REACH) return 0.0;
        return (1.0 - smoothstep(0.6 * CANDLE_REACH, CANDLE_REACH, sqrt(dist2))) / (dist2 + CANDLE_SOFT * CANDLE_SOFT);
      }

      // picks a candle for p; false if none reaches it. The chance of the one picked is in share.
      // (rnd() can come out as exactly 1, so a candle with no weight is never left to chance:
      // dividing by its zero share would put an infinity in the frame.)
      bool pickCandle(vec3 p, out int which, out float share) {
        float w0 = candleWeight(p, 0), w1 = candleWeight(p, 1);
        float total = w0 + w1;
        which = 0;
        share = 1.0;
        if (total <= 0.0) return false;
        which = w1 <= 0.0 || rnd() * total < w0 ? 0 : 1;
        share = (which == 0 ? w0 : w1) / total;
        return share > 0.0;
      }

      float candleLight(vec3 p, vec3 n, out int which) {
        float share;
        if (!pickCandle(p, which, share)) return 0.0;
        vec3 v = flamePoint(which) - p;
        float dist2 = dot(v, v);
        float dist = sqrt(dist2);
        vec3 dir = v / dist;
        float cosS = dot(n, dir);
        if (cosS <= 0.0) return 0.0;
        if (occluded(p + n * 2e-3, dir, dist)) return 0.0;
        float fade = 1.0 - smoothstep(0.6 * CANDLE_REACH, CANDLE_REACH, dist);
        return cosS * fade / ((dist2 + CANDLE_SOFT * CANDLE_SOFT) * PI * share);
      }

      // ...and a flame seen in the floor's glossy reflection
      float candleGlossy(vec3 p, vec3 n, vec3 r, out int which) {
        float share;
        if (!pickCandle(p, which, share)) return 0.0;
        vec3 v = flamePoint(which) - p;
        float dist2 = dot(v, v);
        float dist = sqrt(dist2);
        vec3 dir = v / dist;
        float cosS = dot(n, dir);
        float lobe = pow(max(0.0, dot(r, dir)), GLOSS_N);
        if (cosS <= 0.0 || lobe < 1e-5) return 0.0;
        if (occluded(p + n * 2e-3, dir, dist)) return 0.0;
        // the candles' boost is for what they light; a reflection only needs to be a faint smudge
        return 0.06 * (GLOSS_N + 2.0) / (2.0 * PI) * lobe * cosS / ((dist2 + CANDLE_SOFT * CANDLE_SOFT) * share);
      }

      vec3 phongSample(vec3 r) {
        float r1 = rnd(), r2 = rnd();
        float cosT = pow(r2, 1.0 / (GLOSS_N + 1.0));
        float sinT = sqrt(max(0.0, 1.0 - cosT * cosT));
        float phi = 2.0 * PI * r1;
        vec3 t = abs(r.y) < 0.9 ? normalize(cross(r, vec3(0, 1, 0))) : normalize(cross(r, vec3(1, 0, 0)));
        vec3 b = cross(r, t);
        return normalize(t * cos(phi) * sinT + b * sin(phi) * sinT + r * cosT);
      }

      vec3 cosineSample(vec3 n) {
        float r1 = rnd(), r2 = rnd();
        float phi = 2.0 * PI * r1, r = sqrt(r2);
        vec3 t = abs(n.y) < 0.9 ? normalize(cross(n, vec3(0, 1, 0))) : normalize(cross(n, vec3(1, 0, 0)));
        vec3 b = cross(n, t);
        return normalize(t * cos(phi) * r + b * sin(phi) * r + n * sqrt(1.0 - r2));
      }

      void main() {
        rngState = pcg(uint(gl_FragCoord.x) * 1973u + uint(gl_FragCoord.y) * 9277u + uint(uFrame) * 26699u) | 1u;
        vec2 uv = (gl_FragCoord.xy + vec2(rnd(), rnd())) / uRes * 2.0 - 1.0;
        vec3 o = uCamPos;
        vec3 d = safeDir(normalize(uCamRight * (uv.x * uTanY * uRes.x / uRes.y) + uCamUp * (uv.y * uTanY) + uCamFwd));

        // Three kinds of light are summed apart: the tubes' and the door's, and each candle's (its
        // colour included, but not its strength or flicker, which post decides). Each flame itself,
        // seen straight on, goes in the alpha of its candle's sum.
        vec3 radiance = vec3(0.0);
        vec3 candle0 = vec3(0.0), candle1 = vec3(0.0);
        float flame0 = 0.0, flame1 = 0.0;
        vec3 throughput = vec3(1.0);
        bool countEmitters = true;
        int which = 0;
        for (int bounce = 0; bounce < 4; bounce++) {
          Hit h = trace(o, d);
          if (bounce == 0) { flame0 += flameGlow(o, d, h.t, 0); flame1 += flameGlow(o, d, h.t, 1); }
          if (h.m == M_NONE) break;
          vec3 p = o + d * h.t;

          float e = emission(h.m, p);
          if (h.m == M_TUBE) { if (countEmitters) radiance += throughput * e; break; }
          if (e > 0.0) { radiance += throughput * e; break; }
          if (h.m == M_SCREEN) radiance += throughput * screenLight(p); // the screen's own light; it goes on as a dark matt surface

          vec3 a = surface(h.m, p, h.n);
          vec3 n = h.n;
          if (h.m == M_GLASS) { vec3 glow = throughput * jarGlow(p, n); if (nearestJar(p) == 0) candle0 += glow; else candle1 += glow; }

          // sealed concrete, vinyl and glass: a faint, slightly blurry mirror, strongest at grazing angles
          bool record = h.m == M_RECORD && vinyl(p, n);
          bool glass = h.m == M_GLASS;
          if (h.m == M_FLOOR || record || glass) {
            float grazing = pow(1.0 - max(0.0, -dot(d, n)), 5.0);
            float fresnel = glass ? 0.04 + 0.6 * grazing : (record ? 0.05 : 0.025) + (record ? 0.7 : 0.5) * grazing;
            if (rnd() < fresnel) {
              vec3 r = reflect(d, n);
              // a dark record shows every overbright sample as a white speck, so its highlights are capped
              float mirrored = glossyLight(p, n, r);
              radiance += throughput * (record ? min(mirrored, 3.0) : mirrored);
              if (h.m == M_FLOOR && bounce < 2) {
                vec3 smudge = throughput * CANDLE_RGB * candleGlossy(p, n, r, which);
                if (which == 0) candle0 += smudge; else candle1 += smudge;
              }
              d = safeDir(phongSample(r));
              if (dot(d, n) < 0.0) d = reflect(d, n);
              o = p + n * 2e-3;
              countEmitters = false;
              continue;
            }
          }

      function boxBlur(src, w, h, r) {
        const tmp = new Float32Array(src.length)
        const out = new Float32Array(src.length)
        const inv = 1 / (2 * r + 1)
        for (let y = 0; y < h; y++) {
          let acc = 0
          const row = y * w
          for (let x = -r; x <= r; x++) acc += src[row + Math.min(w - 1, Math.max(0, x))]
          for (let x = 0; x < w; x++) {
            tmp[row + x] = acc * inv
            acc += src[row + Math.min(w - 1, x + r + 1)] - src[row + Math.max(0, x - r)]
          }
        }
        for (let x = 0; x < w; x++) {
          let acc = 0
          for (let y = -r; y <= r; y++) acc += tmp[Math.min(h - 1, Math.max(0, y)) * w + x]
          for (let y = 0; y < h; y++) {
            out[y * w + x] = acc * inv
            acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]
          }
        }
        return out
      }

        const xf = x - xi, yf = y - yi
        const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf)
        const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1)

      function edt(grid, width, height) {
